# Example HTTPS site for browser-reachable RustFS (S3 API).
# One-level hostname only — never s3.chat.example.com.
#
# Prod:  s3.example.com        → 127.0.0.1:9000
# Preview: s3-preview.example.com → 127.0.0.1:9010

server {
    listen 80;
    listen [::]:80;
    server_name s3.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s3.example.com;

    # ssl_certificate     /etc/letsencrypt/live/s3.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/s3.example.com/privkey.pem;

    client_max_body_size 0;

    # Chat image upload: browser PUTs a presigned URL from chat.example.com
    # (different origin). CORS lets the browser send that signed request; it is
    # not object authorization. Objects stay private (no anonymous GetObject).
    # RustFS only emits CORS when RUSTFS_CORS_ALLOWED_ORIGINS is set; older
    # images / missing env still return 200 OPTIONS with no Access-Control-*
    # headers, which the browser treats as a CORS failure.
    # Hide upstream CORS so we never send duplicate Allow-Origin values.
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "ETag, x-amz-request-id, x-amz-id-2, x-amz-version-id" always;
        add_header Access-Control-Max-Age 3600 always;
    }
}
