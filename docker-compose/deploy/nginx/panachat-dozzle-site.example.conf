# Example site for Dozzle (Docker log UI).
# Place under /etc/nginx/sites-available/ and enable TLS (certbot).
#
# Prod: dozzle.panafor.com → 127.0.0.1:8081
#
# Bind Dozzle to loopback only (`127.0.0.1:8081:8080`). Do not publish 8081
# on 0.0.0.0. Arvan/Cloudflare cloud proxy must be OFF (DNS-only) so Let's
# Encrypt HTTP-01 and nginx see the hostname. Orange/cloud ON cannot proxy
# port 8081 anyway.
#
# Dozzle uses SSE for logs and WebSocket for shells — disable buffering.

server {
    listen 80;
    listen [::]:80;
    server_name dozzle.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# After `certbot --nginx -d dozzle.example.com`, Certbot adds listen 443 +
# ssl_certificate. Keep the SSE/WebSocket settings in the HTTPS location.
