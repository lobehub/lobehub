# Example HTTPS site for Stalwart WebAdmin (not SMTP).
# Place under /etc/nginx/sites-available/ and enable TLS (certbot).
#
# Prod: mailer.panafor.com → 127.0.0.1:8080
#
# Do NOT proxy ports 25 / 465 / 587 here — those stay on the Stalwart
# container, published on the host. Bind Stalwart's 8080 to loopback
# once this vhost is live.

server {
    listen 80;
    listen [::]:80;
    server_name mailer.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mailer.example.com;

    # ssl_certificate     /etc/letsencrypt/live/mailer.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mailer.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
