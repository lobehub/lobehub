# Mount runtime data outside the repo (see PANACHAT_DATA_DIR in deploy/.env).
# Used with: docker compose -f docker-compose.yml -f docker-compose.aico.override.yml -f docker-compose.aico.data.override.yml

services:
  postgresql:
    volumes:
      - ${PANACHAT_DATA_DIR}/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - ${PANACHAT_DATA_DIR}/redis:/data

  rustfs:
    volumes:
      - ${PANACHAT_DATA_DIR}/rustfs:/data
