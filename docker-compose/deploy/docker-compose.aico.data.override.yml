# Runtime data for Aico local moz deploys (see PANACHAT_DATA_DIR in deploy/.env).
#
# Postgres uses a Docker *named* volume (panachat_postgres_data). That avoids the
# Docker Desktop + WSL2 bug where a host bind mount appears in `docker inspect`
# but the container actually gets empty tmpfs → Postgres initdb → 0 users while
# the real cluster still sits on disk under PANACHAT_DATA_DIR/postgres.
#
# Redis / RustFS stay on host binds (easier to inspect; less catastrophic if
# Desktop remounts wrong). SQL backups via `moz -B` remain the recovery path.
#
# Used with:
#   docker compose -f docker-compose.yml -f docker-compose.aico.override.yml \
#     -f docker-compose.aico.data.override.yml ...

services:
  postgresql:
    volumes:
      - panachat_postgres_data:/var/lib/postgresql/data

  redis:
    volumes:
      - ${PANACHAT_DATA_DIR}/redis:/data

  rustfs:
    volumes:
      - ${PANACHAT_DATA_DIR}/rustfs:/data

volumes:
  panachat_postgres_data:
    name: panachat_postgres_data
