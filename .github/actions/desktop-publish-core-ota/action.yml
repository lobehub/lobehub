name: Desktop Publish Core OTA
description: Upload a buildCore.mjs output tree (cas + core/<platform>) to the update server

inputs:
  core-dir:
    description: 'Protocol directory (core for v3, core-v4 for v4)'
    required: false
    default: core
  channel:
    description: 'Update channel (stable, beta, canary)'
    required: true
  release-dir:
    description: 'Directory produced by buildCore.mjs --out'
    required: true
  shell-json:
    description: 'Optional path to a shell.json to publish as <channel>/shell.json before latest.json'
    required: false
    default: ''
  aws-access-key-id:
    description: 'AWS access key ID'
    required: true
  aws-secret-access-key:
    description: 'AWS secret access key'
    required: true
  s3-bucket:
    description: 'S3 bucket name'
    required: true
  s3-region:
    description: 'S3 region (defaults to us-east-1)'
    required: false
    default: 'us-east-1'
  s3-endpoint:
    description: 'Custom S3 endpoint (for R2/MinIO etc.)'
    required: false
    default: ''

outputs:
  published:
    description: 'Whether latest.json was uploaded for at least one platform'
    value: ${{ steps.upload.outputs.published }}
  platforms:
    description: 'Space-separated platforms published'
    value: ${{ steps.upload.outputs.platforms }}

runs:
  using: composite
  steps:
    - name: Upload core release to S3
      id: upload
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_REGION: ${{ inputs.s3-region }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        CHANNEL: ${{ inputs.channel }}
        CORE_DIR: ${{ inputs.core-dir }}
        RELEASE_DIR: ${{ inputs.release-dir }}
        SHELL_JSON: ${{ inputs.shell-json }}
      run: |
        set -euo pipefail
        case "$CORE_DIR" in core|core-v4) ;; *) exit 1 ;; esac
        echo "published=false" >> "$GITHUB_OUTPUT"
        echo "platforms=" >> "$GITHUB_OUTPUT"
        if [ -z "$S3_BUCKET" ]; then
          echo "⚠️ S3 bucket is not configured, skipping core OTA upload"
          exit 0
        fi
        ENDPOINT_ARGS=()
        if [ -n "$S3_ENDPOINT" ]; then
          ENDPOINT_ARGS=(--endpoint-url "$S3_ENDPOINT")
        fi
        IMMUTABLE=(--cache-control "public,max-age=31536000,immutable")

        # seq is allocated as max(published)+1 without a lock, so a concurrent publisher for the
        # same channel may have landed first. Same seq + same version is a re-run and allowed.
        assert_not_behind() {
          local platform=$1
          local key="$CHANNEL/$CORE_DIR/$platform/latest.json"
          aws s3 ls "s3://$S3_BUCKET/$key" "${ENDPOINT_ARGS[@]}" >/dev/null 2>&1 || return 0
          local remote local_json remote_seq remote_version local_seq local_version
          remote=$(aws s3 cp "s3://$S3_BUCKET/$key" - "${ENDPOINT_ARGS[@]}")
          local_json="$RELEASE_DIR/$CORE_DIR/$platform/latest.json"
          remote_seq=$(jq -r '.seq // -1' <<<"$remote")
          remote_version=$(jq -r '.version' <<<"$remote")
          local_seq=$(jq -r '.seq' "$local_json")
          local_version=$(jq -r '.version' "$local_json")
          if [ "$remote_seq" -gt "$local_seq" ] || { [ "$remote_seq" -eq "$local_seq" ] && [ "$remote_version" != "$local_version" ]; }; then
            echo "::error::$key already at seq $remote_seq ($remote_version); refusing to publish seq $local_seq ($local_version)"
            exit 1
          fi
        }

        for platform_dir in "$RELEASE_DIR"/"$CORE_DIR"/*/; do
          [ -d "$platform_dir" ] || continue
          assert_not_behind "$(basename "$platform_dir")"
        done

        # Order matters for clients mid-download: objects → packs → snapshot → shell.json → latest.json.
        if [ -d "$RELEASE_DIR/cas" ]; then
          echo "📦 Syncing CAS objects"
          aws s3 sync "$RELEASE_DIR/cas" "s3://$S3_BUCKET/cas" --size-only \
            --content-type application/zstd "${IMMUTABLE[@]}" "${ENDPOINT_ARGS[@]}"
        fi

        PLATFORMS=""
        for platform_dir in "$RELEASE_DIR"/"$CORE_DIR"/*/; do
          [ -d "$platform_dir" ] || continue
          platform=$(basename "$platform_dir")
          target="s3://$S3_BUCKET/$CHANNEL/$CORE_DIR/$platform"
          version=$(jq -r '.version' "$platform_dir/latest.json")
          echo "🚀 $platform: core $version → $target"
          PACK_TYPE=application/zip
          [ "$CORE_DIR" != core-v4 ] || PACK_TYPE=application/octet-stream
          if [ -d "$platform_dir/packs" ]; then
            aws s3 sync "$platform_dir/packs" "$target/packs" --size-only \
              --content-type "$PACK_TYPE" "${IMMUTABLE[@]}" "${ENDPOINT_ARGS[@]}"
          fi
          if [ "$CORE_DIR" = core-v4 ]; then
            # Verify uploaded bytes and a real S3 Range before exposing this version.
            while IFS=$'\t' read -r hash pack_path size offset length frame_hash; do
              key="$CHANNEL/$CORE_DIR/$platform/$pack_path"
              actual=$(aws s3 cp "s3://$S3_BUCKET/$key" - "${ENDPOINT_ARGS[@]}" | sha256sum | cut -d ' ' -f1)
              [ "$actual" = "$hash" ] || { echo "::error::pack hash mismatch: $key"; exit 1; }
              range_file=$(mktemp)
              end=$((offset + length - 1))
              metadata=$(aws s3api get-object --bucket "$S3_BUCKET" --key "$key" --range "bytes=$offset-$end" "${ENDPOINT_ARGS[@]}" "$range_file")
              actual=$(sha256sum "$range_file" | cut -d ' ' -f1)
              rm "$range_file"
              [ "$actual" = "$frame_hash" ] && [ "$(jq -r '.ContentRange' <<<"$metadata")" = "bytes $offset-$end/$size" ] \
                || { echo "::error::pack Range verification failed: $key"; exit 1; }
            done < <(jq -r '. as $m | .packs[] | . as $p | ([$m.objects[], $m.patches[]] | map(select(.packSha256 == $p.sha256)) | first) as $f | [$p.sha256, $p.path, $p.size, $f.offset, $f.length, $f.compressedSha256] | @tsv' "$platform_dir/latest.json")
          fi
          aws s3 cp "$platform_dir/versions/$version.json" "$target/versions/$version.json" \
            --content-type application/json --cache-control no-store "${ENDPOINT_ARGS[@]}"
          PLATFORMS="$PLATFORMS $platform"
        done

        if [ -n "$SHELL_JSON" ]; then
          echo "📋 Publishing $CHANNEL/shell.json: $(cat "$SHELL_JSON")"
          aws s3 cp "$SHELL_JSON" "s3://$S3_BUCKET/$CHANNEL/shell.json" \
            --content-type application/json --cache-control no-store "${ENDPOINT_ARGS[@]}"
        fi

        for platform in $PLATFORMS; do
          assert_not_behind "$platform"
          aws s3 cp "$RELEASE_DIR/$CORE_DIR/$platform/latest.json" "s3://$S3_BUCKET/$CHANNEL/$CORE_DIR/$platform/latest.json" \
            --content-type application/json --cache-control no-store "${ENDPOINT_ARGS[@]}"
        done

        if [ -n "$PLATFORMS" ]; then
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS# }" >> "$GITHUB_OUTPUT"
          echo "✅ Published core for:$PLATFORMS"
        else
          echo "⚠️ No core/<platform> directories found under $RELEASE_DIR"
        fi
