name: Setup Environment
description: Setup Node.js, pnpm (install) and Bun (script runner) for workflows

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24.11.1'
  bun-version:
    description: Bun version
    required: false
    default: 'canary'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Install bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # setup-node only caches pnpm when `cache` is set explicitly; its automatic
    # caching covers npm alone. The root `pnpm-lock.yaml` is gitignored, so the
    # dependency path has to name the tracked declarations — a missing file makes
    # the action fail rather than cache nothing.
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        cache: pnpm
        cache-dependency-path: |
          package.json
          pnpm-workspace.yaml
          apps/*/package.json
          packages/*/package.json
          patches/*.patch
          apps/desktop/pnpm-lock.yaml
        node-version: ${{ inputs.node-version }}
