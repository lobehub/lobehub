name: Desktop Core Seq
description: Resolve the next core seq (max over every platform's published latest.json + 1) so a new core always outranks published ones

inputs:
  channel:
    description: 'Update channel'
    required: true
  update-server-url:
    description: 'Update server URL (with or without channel suffix)'
    required: true

outputs:
  seq:
    description: 'Next core seq'
    value: ${{ steps.seq.outputs.seq }}
  feed-base-url:
    description: 'Update server URL without the channel suffix'
    value: ${{ steps.seq.outputs.feed_base_url }}

runs:
  using: composite
  steps:
    - name: Resolve next core seq
      id: seq
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        UPDATE_SERVER_URL: ${{ inputs.update-server-url }}
      run: |
        set -euo pipefail
        BASE="${UPDATE_SERVER_URL%/}"
        case "$BASE" in
          */stable|*/nightly|*/canary|*/beta) BASE="${BASE%/*}" ;;
        esac
        MAX_SEQ=-1
        for p in darwin win32 linux; do
          HTTP_STATUS=$(curl -sS --connect-timeout 10 --max-time 30 \
            -o "$RUNNER_TEMP/latest-$p.json" -w '%{http_code}' "$BASE/$CHANNEL/core/$p/latest.json")
          case "$HTTP_STATUS" in
            200) SEQ=$(jq -er '.seq | select(type == "number")' "$RUNNER_TEMP/latest-$p.json") ;;
            404) SEQ=-1 ;;
            *) echo "::error::$p latest.json fetch failed: HTTP $HTTP_STATUS"; exit 1 ;;
          esac
          echo "$p latest seq: $SEQ"
          if [ "$SEQ" -gt "$MAX_SEQ" ]; then MAX_SEQ=$SEQ; fi
        done
        NEXT=$((MAX_SEQ + 1))
        echo "Next core seq: $NEXT"
        {
          echo "seq=$NEXT"
          echo "feed_base_url=$BASE"
        } >> "$GITHUB_OUTPUT"
