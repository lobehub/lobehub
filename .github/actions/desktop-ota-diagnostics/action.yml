name: Desktop OTA Diagnostics
description: Preserve compatibility inputs and explicit build/publication outcomes, including failures
inputs:
  kind:
    description: patch, build or release
    default: patch
  channel:
    description: Desktop update channel
    required: true
  steps-json:
    description: Caller step outcomes (only selected metadata is persisted)
    required: true
  job-status:
    description: Caller job status before diagnostics
    required: true
outputs:
  published:
    description: Whether the renderer patch was published
    value: ${{ steps.report.outputs.published }}
  reason:
    description: Publication or skip reason
    value: ${{ steps.report.outputs.reason }}
  requires_full_release:
    description: Whether compatibility requires a full release
    value: ${{ steps.report.outputs.requires_full_release }}
  version:
    description: Published renderer patch version
    value: ${{ steps.report.outputs.version }}
runs:
  using: composite
  steps:
    - name: Record diagnostic summary
      id: report
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        DIAGNOSTIC_KIND: ${{ inputs.kind }}
        JOB_STATUS: ${{ inputs.job-status }}
        STEPS_JSON: ${{ inputs.steps-json }}
      # Keep this script compatible with the ambient Node runtime if setup failed.
      run: node apps/desktop/scripts/reportRendererOta.mjs
    - name: Preserve diagnostic artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: renderer-ota-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
        if-no-files-found: warn
        retention-days: 14
        path: |
          renderer-ota-diagnostics/
          apps/desktop/release/renderer-mainhash-inputs.json
          apps/desktop/release/renderer-mainhash.txt
          apps/desktop/release/renderer-mainhash/
          release/renderer-mainhash-inputs.json
          release/renderer-mainhash.txt
          release/renderer-mainhash/
          ${{ runner.temp }}/renderer-base.json
          ${{ runner.temp }}/base-mainhash-inputs.json
          ${{ runner.temp }}/renderer-mainhash-diff.txt
