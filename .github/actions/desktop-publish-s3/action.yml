name: Desktop Publish to S3
description: Upload desktop release artifacts to S3 update server

inputs:
  channel:
    description: 'Update channel (stable, canary, nightly)'
    required: true
  version:
    description: 'Release version (e.g., 2.1.29-canary.1)'
    required: true
  cloud-ref:
    description: 'Cloud repository commit used by the packaged binaries'
    required: true
  aws-access-key-id:
    description: 'AWS access key ID'
    required: true
  aws-secret-access-key:
    description: 'AWS secret access key'
    required: true
  s3-bucket:
    description: 'S3 bucket name'
    required: true
  s3-region:
    description: 'S3 region (defaults to us-east-1)'
    required: false
    default: 'us-east-1'
  s3-endpoint:
    description: 'Custom S3 endpoint (for R2/MinIO etc.)'
    required: false
    default: ''
  upload-release-files:
    description: Upload installers and electron-updater manifests
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Download merged artifacts
      uses: actions/download-artifact@v7
      with:
        name: merged-release
        path: release

    - name: List artifacts to upload
      shell: bash
      run: |
        echo "📦 Artifacts to upload to S3:"
        ls -lah release/
        echo ""
        echo "📋 YML files in release/:"
        ls -la release/*.yml 2>/dev/null || echo "   ⚠️ No yml files found!"
        echo ""
        echo "📋 Version: ${{ inputs.version }}, Channel: ${{ inputs.channel }}"

    - name: Download r0 core releases
      uses: actions/download-artifact@v7
      with:
        path: release/core-r0
        pattern: core-r0-*

    - name: Merge r0 cores and compose shell.json
      id: shell
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ls release/core-r0
        mkdir -p release/core-ota
        SHELL_ABI=""
        # Same-platform builds from different runners (mac arm64/x64) must produce identical trees.
        for dir in release/core-r0/*/; do
          for latest in "$dir"core/*/latest.json; do
            platform=$(basename "$(dirname "$latest")")
            [ "$(jq -r '.version' "$latest")" = "$VERSION" ] || { echo "::error::core version in $latest is not $VERSION"; exit 1; }
            abi=$(jq -er '.shellAbi' "$latest")
            [ -z "$SHELL_ABI" ] && SHELL_ABI="$abi"
            [ "$abi" = "$SHELL_ABI" ] || { echo "::error::shellAbi differs across platforms ($latest)"; exit 1; }
            if [ -f "release/core-ota/core/$platform/latest.json" ]; then
              # A mismatch only costs delta efficiency for some clients (they fall back to objects/full pack); keep the first tree.
              diff <(jq -S '.tree' "release/core-ota/core/$platform/latest.json") <(jq -S '.tree' "$latest") \
                || echo "::warning::$platform core trees differ between runners; keeping the first"
              continue
            fi
            mkdir -p release/core-ota/cas release/core-ota/core
            if [ -d "$dir"cas ]; then cp -R "$dir"cas/. release/core-ota/cas/; fi
            cp -R "$dir"core/"$platform" release/core-ota/core/
          done
        done
        [ -n "$SHELL_ABI" ] || { echo "::error::no r0 core artifacts found"; exit 1; }
        jq -n --arg shellAbi "$SHELL_ABI" --arg shellVersion "$VERSION" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{shellAbi: $shellAbi, shellVersion: $shellVersion, publishedAt: $publishedAt}' > release/shell.json
        cat release/shell.json

    - name: Publish shell.json and r0 core
      id: base
      uses: ./.github/actions/desktop-publish-core-ota
      with:
        channel: ${{ inputs.channel }}
        release-dir: release/core-ota
        shell-json: release/shell.json
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-endpoint: ${{ inputs.s3-endpoint }}

    - name: Upload to S3
      id: installers
      if: inputs.upload-release-files == 'true'
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_REGION: ${{ inputs.s3-region }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "$S3_BUCKET" ]; then
          echo "⚠️ S3 bucket is not configured, skipping S3 upload"
          exit 0
        fi

        # 构建端点参数
        ENDPOINT_ARG=""
        if [ -n "$S3_ENDPOINT" ]; then
          ENDPOINT_ARG="--endpoint-url $S3_ENDPOINT"
          echo "📡 Using custom S3 endpoint: $S3_ENDPOINT"
        fi

        echo "🚀 Uploading to S3 bucket: $S3_BUCKET"
        echo "📁 Target path: s3://$S3_BUCKET/$CHANNEL/"
        echo ""

        # 1. 上传安装包到版本目录
        echo "📦 Uploading release files to s3://$S3_BUCKET/$CHANNEL/$VERSION/"
        for file in release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb release/*.rpm release/*.snap release/*.tar.gz release/*.blockmap; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            echo "   ↗️ $filename"
            aws s3 cp "$file" "s3://$S3_BUCKET/$CHANNEL/$VERSION/$filename" $ENDPOINT_ARG
          fi
        done

        # 2. stable 渠道补充 stable*.yml
        # electron-builder 对稳定版默认生成 latest*.yml
        echo ""
        if [ "$CHANNEL" = "stable" ]; then
          echo "📋 Creating stable*.yml from latest*.yml..."
          for yml in release/latest*.yml; do
            if [ -f "$yml" ]; then
              stable_yml=$(basename "$yml" | sed 's/^latest/stable/')
              cp "$yml" "release/$stable_yml"
              echo "   📄 Created $stable_yml from $(basename "$yml")"
            fi
          done
        fi

        # 3. 为所有 yml manifest 的 URL 加版本目录前缀
        # merge-mac-files 步骤已生成 {channel}*.yml (如 canary-mac.yml)
        # 安装包在 s3://$BUCKET/$CHANNEL/$VERSION/ 下，URL 需加 $VERSION/ 前缀
        echo ""
        echo "📋 Adding version prefix to yml manifest URLs..."
        for yml in release/${CHANNEL}*.yml release/latest*.yml; do
          if [ -f "$yml" ]; then
            sed -i "s|url: |url: $VERSION/|g" "$yml"
            echo "   📄 Updated $(basename $yml) with URL prefix: $VERSION/"
          fi
        done

        # 4. 上传 installer manifest 到根目录和版本目录
        # 根目录: electron-updater 需要，每次发版覆盖
        # 版本目录: 作为存档保留
        echo ""
        echo "📋 Uploading manifest files..."
        for yml in release/${CHANNEL}*.yml release/latest*.yml; do
          if [ -f "$yml" ]; then
            filename=$(basename "$yml")
            echo "   ↗️ $filename -> s3://$S3_BUCKET/$CHANNEL/$filename"
            aws s3 cp "$yml" "s3://$S3_BUCKET/$CHANNEL/$filename" $ENDPOINT_ARG
            echo "   ↗️ $filename -> s3://$S3_BUCKET/$CHANNEL/$VERSION/$filename (archive)"
            aws s3 cp "$yml" "s3://$S3_BUCKET/$CHANNEL/$VERSION/$filename" $ENDPOINT_ARG
          fi
        done

        echo ""
        echo "✅ S3 upload completed!"
        echo ""
        echo "📋 Files in s3://$S3_BUCKET/$CHANNEL/:"
        aws s3 ls "s3://$S3_BUCKET/$CHANNEL/" $ENDPOINT_ARG || true
        echo ""
        echo "📋 Files in s3://$S3_BUCKET/$CHANNEL/$VERSION/:"
        aws s3 ls "s3://$S3_BUCKET/$CHANNEL/$VERSION/" $ENDPOINT_ARG || true

    - name: Preserve release publication diagnostics
      if: always()
      uses: ./.github/actions/desktop-ota-diagnostics
      env:
        APP_VERSION: ${{ inputs.version }}
        CLOUD_REF: ${{ inputs.cloud-ref }}
      with:
        kind: release
        channel: ${{ inputs.channel }}
        steps-json: ${{ toJSON(steps) }}
        job-status: ${{ job.status }}
