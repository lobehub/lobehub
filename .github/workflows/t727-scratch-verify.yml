name: T727 scratch lint

on:
  push:
    branches:
      - ci/t727-verify

permissions:
  contents: read

jobs:
  lint:
    name: root lint and eval testCase unit test
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: e691850bdbe23dc7783e0b3b40fc67eabb74db1f
      - name: Setup environment
        uses: ./.github/actions/setup-env
      - name: Install deps
        run: pnpm i
      - name: Lint (bun run lint = eslint + stylelint + type-check + circular)
        run: bun run lint
      - name: Unit test - eval testCase slice
        run: bunx vitest run --project app src/store/eval/slices/testCase/action.test.ts
