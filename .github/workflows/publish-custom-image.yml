name: Publish custom Docker image

on:
  push:
    branches:
      - canary
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example, dev or v2.3.3)
        required: false
        default: ''
      publish_latest:
        description: Also move the latest tag to this build
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR image names must be lowercase. metadata-action normalizes the value.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4


      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-
            type=raw,value=canary,enable=${{ github.ref_name == 'canary' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || inputs.publish_latest == true }}
            type=ref,event=branch

      - name: Build and push Linux x64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ github.sha }}
            INSTALL_TFS_CURL=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
