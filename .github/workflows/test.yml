name: Test CI

on:
  push:
    branches:
      - main
      - canary
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/issue-*.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/sync*.y*ml'
      - '.github/workflows/auto-*.yml'
      - '.github/workflows/manual-*.yml'
      - '.github/workflows/lighthouse.yml'
      - '.github/workflows/bundle-analyzer.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/issue-*.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/sync*.y*ml'
      - '.github/workflows/auto-*.yml'
      - '.github/workflows/manual-*.yml'
      - '.github/workflows/lighthouse.yml'
      - '.github/workflows/bundle-analyzer.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Package tests - all packages in single job to save runner resources
  test-packages:
    runs-on: ubuntu-latest
    name: Test Packages
    env:
      PACKAGES: '@lobechat/file-loaders @lobechat/prompts @lobechat/model-runtime @lobechat/web-crawler @lobechat/electron-server-ipc @lobechat/utils @lobechat/context-engine @lobechat/agent-runtime @lobechat/conversation-flow @lobechat/ssrf-safe-fetch @lobechat/memory-user-memory @lobechat/types @lobechat/trpc @lobechat/app-config @lobechat/locales @lobechat/env @lobechat/builtin-tool-lobe-agent model-bank @lobechat/agent-gateway-client @lobechat/agent-manager-runtime @lobechat/device-gateway-client @lobechat/device-identity @lobechat/eval-dataset-parser @lobechat/eval-rubric @lobechat/fetch-sse @lobechat/heterogeneous-agents'

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Verify preview build filtering
        run: node --test .github/scripts/vercel-ignored-build-step.test.cjs

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Install CLI deps
        run: pnpm install
        working-directory: apps/cli

      - name: Test CLI build configuration
        run: bunx vitest run --config vitest.config.mts --silent='passed-only' tsdown.config.test.ts
        working-directory: apps/cli

      - name: Test packages with coverage
        run: |
          for package in $PACKAGES; do
            echo "::group::Testing $package"
            bun run --filter $package test:coverage
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        if: always()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail

          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Build common args
          COMMON_ARGS="--git-service github"

          # PR args setup
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMON_ARGS="$COMMON_ARGS --pr ${{ github.event.pull_request.number }}"
            COMMON_ARGS="$COMMON_ARGS --sha ${{ github.event.pull_request.head.sha }}"
            # Fork PR needs username:branch format for tokenless upload
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              COMMON_ARGS="$COMMON_ARGS --branch ${{ github.event.pull_request.head.label }}"
            else
              COMMON_ARGS="$COMMON_ARGS --branch ${{ github.event.pull_request.head.ref }}"
            fi
          fi

          # Token (if available)
          if [ -n "$CODECOV_TOKEN" ]; then
            COMMON_ARGS="$COMMON_ARGS -t $CODECOV_TOKEN"
          fi

          upload_coverage() {
            local dir="$1"
            local flag="$2"

            echo "Uploading coverage for $dir as $flag..."
            ./codecov upload-coverage \
              $COMMON_ARGS \
              --file "./packages/$dir/coverage/lcov.info" \
              --flag "$flag" \
              --disable-search
          }

          pids=()
          labels=()
          failed=0

          reap_one() {
            local pid="${pids[0]}"
            local label="${labels[0]}"

            if wait "$pid"; then
              echo "Coverage upload completed for $label."
            else
              echo "::error::Coverage upload failed for $label."
              failed=1
            fi

            pids=("${pids[@]:1}")
            labels=("${labels[@]:1}")
          }

          for package in $PACKAGES; do
            dir="${package#@lobechat/}"
            if [ -f "./packages/$dir/coverage/lcov.info" ]; then
              flag="packages/$dir"

              case "$dir" in
                builtin-tool-*)
                  flag="builtin-tools"
                  ;;
                locales|env|device-gateway-client)
                  echo "Skipping Codecov upload for $dir."
                  continue
                  ;;
              esac

              while [ "${#pids[@]}" -ge 4 ]; do
                reap_one
              done

              upload_coverage "$dir" "$flag" &
              pids+=("$!")
              labels+=("$dir")
            fi
          done

          while [ "${#pids[@]}" -gt 0 ]; do
            reap_one
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  # App tests - run sharded tests
  test-app:
    strategy:
      matrix:
        shard: [1, 2, 3]
    name: Test App (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Run tests
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --project app --shard=${{ matrix.shard }}/3

      - name: Upload App Coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/app/lcov.info
          flags: app
          name: app-shard-${{ matrix.shard }}

  # Windows-only verification of the local shell execution strategy.
  # The unit tests mock process.platform and fs.existsSync, so they prove
  # nothing about real Windows behaviour: argument tokenization by the Windows
  # CRT, Windows PowerShell 5.1 (which lacks `&&`), and the pwsh/5.1/cmd
  # detection cascade against real install paths. The driver script only needs
  # node builtins, so this job skips the monorepo install entirely.
  test-windows-shell:
    name: Test Windows Shell

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Verify Windows shell strategy
        run: bun run packages/local-file-shell/scripts/verify-windows-shell.ts

  test-desktop:
    name: ALint & Test Desktop App

    runs-on: ubuntu-latest
    env:
      ALINT_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # pnpm 12 writes broken relative symlinks for workspace members outside the desktop
      # workspace root (../../packages/*). Installing the root workspace relinks them so
      # tsgo can resolve sibling packages from source.
      - name: Relink root workspace members
        run: pnpm install --ignore-scripts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Typecheck Desktop
        run: pnpm type-check
        working-directory: apps/desktop

      - name: Test Desktop Client
        run: pnpm test
        working-directory: apps/desktop

      - name: Upload Desktop App Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/desktop/coverage/lcov.info
          flags: desktop

      # ---- alint: model-backed lint rules (packages/alint) on this push's diff ----
      # Advisory: findings land as inline warning annotations and a job summary,
      # never as a failure. Skipped when the provider secret is unavailable (forks).
      # Runs here to reuse the root install instead of paying for another job.
      - name: alint · expose the diff against the base as dirty changes
        if: ${{ !cancelled() && env.ALINT_API_KEY != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'canary' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          MERGE_BASE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD_SHA}" --jq .merge_base_commit.sha)
          echo "merge base: ${MERGE_BASE}"
          git fetch --no-tags --depth=1 origin "${MERGE_BASE}"
          # alint --dirty lints the working tree against HEAD and keeps only the
          # findings on changed lines; moving HEAD to the merge base makes the
          # whole diff "dirty", so the scope is exactly this change.
          git reset --mixed "${MERGE_BASE}"
          git status --short | head -50

      - name: alint · restore cache
        if: ${{ !cancelled() && env.ALINT_API_KEY != '' }}
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .alintcache
          key: alint-${{ hashFiles('alint.config.toml', 'packages/alint/rules/**') }}-${{ github.sha }}
          restore-keys: |
            alint-${{ hashFiles('alint.config.toml', 'packages/alint/rules/**') }}-

      - name: alint · lint changed files
        if: ${{ !cancelled() && env.ALINT_API_KEY != '' }}
        continue-on-error: true
        run: |
          bun run alint:setup
          node_modules/.bin/alint plugin install
          node_modules/.bin/alint --dirty --format json > alint-output.json || status=$?
          # 1 = findings at error level (none of ours yet), 2 = alint could not run
          if [ "${status:-0}" = "2" ]; then cat alint-output.json; exit 2; fi
          if [ ! -s alint-output.json ]; then echo "nothing to lint"; exit 0; fi
          bun packages/alint/annotate.ts alint-output.json

      - name: alint · calibrate rule fixtures (when rules or fixtures changed)
        if: ${{ !cancelled() && env.ALINT_API_KEY != '' }}
        continue-on-error: true
        run: |
          if git status --porcelain -- alint.config.toml packages/alint | grep -q .; then
            cd packages/alint && bunx vitest run fixtures.test.ts
          else
            echo "rules and fixtures unchanged; skipping calibration"
          fi

  test-server:
    strategy:
      matrix:
        shard: [1, 2]
    name: Test Server (shard ${{ matrix.shard }}/2)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Test Server Coverage
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --coverage.reportsDirectory=./apps/server/coverage --project server --shard=${{ matrix.shard }}/2

      - name: Upload Server Coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/server/coverage/lcov.info
          flags: server
          name: server-shard-${{ matrix.shard }}

  test-databsae:
    name: Test Database

    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s  --health-retries 5

        ports:
          - 5432:5432

    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm i

      - name: Lint
        run: bun run lint

      - name: Test Coverage
        run: pnpm --filter @lobechat/database test:coverage
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_DRIVER: node
          KEY_VAULTS_SECRET: Kix2wcUONd4CX51E/ZPAd36BqM4wzJgKjPtz2sGztqQ=
          S3_PUBLIC_DOMAIN: https://example.com
          APP_URL: https://home.com

      - name: Upload Database coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/database/coverage/lcov.info
          flags: database
