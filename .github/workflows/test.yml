name: Test CI

on:
  push:
    branches:
      - main
      - canary
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/issue-*.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/sync*.y*ml'
      - '.github/workflows/auto-*.yml'
      - '.github/workflows/manual-*.yml'
      - '.github/workflows/bundle-analyzer.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/issue-*.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/sync*.y*ml'
      - '.github/workflows/auto-*.yml'
      - '.github/workflows/manual-*.yml'
      - '.github/workflows/bundle-analyzer.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new PR push supersedes the run in progress. A canary/main push is never
  # cancelled midway: the next push waits (replacing any older waiting one), so
  # every push run that starts also finishes and the full suite keeps covering
  # canary. PR runs only test what they changed and rely on that.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what this run tests (see .github/scripts/ci-scope.mjs). Pushes,
  # release branches, the `trigger:full-ci` label and changes that can move any test run
  # everything; other PRs run only the jobs for the areas they touched, and the
  # vitest shards narrow further to the tests that import a changed file.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      app: ${{ steps.scope.outputs.app }}
      server: ${{ steps.scope.outputs.server }}
      packages: ${{ steps.scope.outputs.packages }}
      database: ${{ steps.scope.outputs.database }}
      windows_shell: ${{ steps.scope.outputs.windows_shell }}
      coverage_packages: ${{ steps.scope.outputs.coverage_packages }}
      plain_packages: ${{ steps.scope.outputs.plain_packages }}
      durations: ${{ steps.durations.outputs.cache-matched-key != '' }}
    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=2 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Decide what to test
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/ci-scope.mjs

      # Per-file durations recorded by the last canary run. Restored once here
      # and handed to every shard, so all shards balance on the same numbers.
      - name: Restore recorded test durations
        id: durations
        uses: actions/cache/restore@v4
        with:
          path: .vitest-durations/durations.json
          key: vitest-durations-v1-${{ github.sha }}
          restore-keys: |
            vitest-durations-v1-

      - name: Share the durations with the shards
        if: steps.durations.outputs.cache-matched-key != ''
        uses: actions/upload-artifact@v6
        with:
          name: vitest-durations
          path: .vitest-durations/durations.json
          retention-days: 1

  # oxlint, stylelint, type-check and circular imports: whole-repo, every run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Lint
        run: bun run lint

  # Every workspace package with a `test` script, several at a time. A PR runs
  # the packages it changed and their dependents, without coverage.
  test-packages:
    needs: scope
    if: needs.scope.outputs.packages == 'true'
    runs-on: ubuntu-latest
    name: Test Packages
    env:
      COVERAGE_PACKAGES: ${{ needs.scope.outputs.coverage_packages }}
      PLAIN_PACKAGES: ${{ needs.scope.outputs.plain_packages }}

    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Verify CI scripts
        run: |
          node --test \
            .github/scripts/standalone-workspaces.test.mjs \
            .github/scripts/ci-scope.test.mjs \
            .github/scripts/vercel-ignored-build-step.test.cjs \
            .github/scripts/bundle-size-gate.test.cjs \
            .github/scripts/size-gate-comment.test.cjs \
            .github/scripts/pr-admission-check.test.cjs \
            .github/scripts/mergeAllowBuilds.test.mjs \
            .github/scripts/testCheckout.test.mjs \
            .github/scripts/desktopRelease*.test.mjs \
            .github/scripts/desktop-core-gate.test.mjs

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Verify MCP tool route bundle boundary
        run: node --test .github/scripts/mcp-tools-bundle.test.mjs

      - name: Install CLI deps
        run: pnpm install
        working-directory: apps/cli

      - name: Verify CLI release automation
        run: node --test .github/scripts/cliRelease.test.mjs

      - name: Verify hotfix operator CLI
        run: node --test .github/scripts/hotfixWorkflow.test.mjs

      - name: Verify desktop release workflows
        run: node --test .github/scripts/desktop-publish-s3.test.mjs .github/scripts/release-desktop-canary.test.mjs .github/scripts/desktop-overlay-type-check.test.mjs .github/scripts/overlayTypeErrors.test.mjs

      - name: Test CLI build configuration, bundle and model-facing docs
        run: bunx vitest run --config vitest.config.mts --silent='passed-only' tsdown.config.test.ts bundle.test.ts src/modelFacingDocs.test.ts
        working-directory: apps/cli

      # Each package runs its own vitest. Two at a time with two workers each
      # fills the 4 vCPUs instead of paying every small package's startup one
      # after another; three at a time with Vitest's default 3 workers
      # oversubscribed the runner and timing-sensitive tests timed out. A full
      # runner still slows the heaviest tests (budget-error spreadsheets, large
      # tRPC payloads, token counting: 3.5–4.8 s on canary) to the 5 s default,
      # so per-test timeouts are 20 s here; a hung test still fails.
      - name: Test packages
        env:
          VITEST_MAX_WORKERS: '2'
        run: |
          run_packages() {
            local script="$1"; shift
            [ "$#" -gt 0 ] || return 0
            local filters=()
            for package in "$@"; do filters+=(--filter "$package"); done
            pnpm "${filters[@]}" --workspace-concurrency=2 --no-sort --no-bail run "$script" --testTimeout=20000
          }
          status=0
          # shellcheck disable=SC2086
          run_packages test:coverage $COVERAGE_PACKAGES || status=1
          # shellcheck disable=SC2086
          run_packages test $PLAIN_PACKAGES || status=1
          exit $status

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && needs.scope.outputs.mode == 'full' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail

          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Build common args
          COMMON_ARGS="--git-service github"

          # PR args setup
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMON_ARGS="$COMMON_ARGS --pr ${{ github.event.pull_request.number }}"
            COMMON_ARGS="$COMMON_ARGS --sha ${{ github.event.pull_request.head.sha }}"
            # Fork PR needs username:branch format for tokenless upload
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              COMMON_ARGS="$COMMON_ARGS --branch ${{ github.event.pull_request.head.label }}"
            else
              COMMON_ARGS="$COMMON_ARGS --branch ${{ github.event.pull_request.head.ref }}"
            fi
          fi

          # Token (if available)
          if [ -n "$CODECOV_TOKEN" ]; then
            COMMON_ARGS="$COMMON_ARGS -t $CODECOV_TOKEN"
          fi

          upload_coverage() {
            local dir="$1"
            local flag="$2"

            echo "Uploading coverage for $dir as $flag..."
            ./codecov upload-coverage \
              $COMMON_ARGS \
              --file "./packages/$dir/coverage/lcov.info" \
              --flag "$flag" \
              --disable-search
          }

          pids=()
          labels=()
          failed=0

          reap_one() {
            local pid="${pids[0]}"
            local label="${labels[0]}"

            if wait "$pid"; then
              echo "Coverage upload completed for $label."
            else
              echo "::error::Coverage upload failed for $label."
              failed=1
            fi

            pids=("${pids[@]:1}")
            labels=("${labels[@]:1}")
          }

          for lcov in packages/*/coverage/lcov.info packages/*/*/coverage/lcov.info; do
            [ -f "$lcov" ] || continue
            dir="${lcov#packages/}"
            dir="${dir%/coverage/lcov.info}"
            if [ -f "./packages/$dir/coverage/lcov.info" ]; then
              flag="packages/$dir"

              case "$dir" in
                builtin-tool-*)
                  flag="builtin-tools"
                  ;;
                locales|env|device-gateway-client)
                  echo "Skipping Codecov upload for $dir."
                  continue
                  ;;
              esac

              while [ "${#pids[@]}" -ge 4 ]; do
                reap_one
              done

              upload_coverage "$dir" "$flag" &
              pids+=("$!")
              labels+=("$dir")
            fi
          done

          while [ "${#pids[@]}" -gt 0 ]; do
            reap_one
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  # App tests - run sharded tests
  test-app:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Test App (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=2 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Download recorded test durations
        if: needs.scope.outputs.durations == 'true'
        uses: actions/download-artifact@v7
        with:
          name: vitest-durations
          path: .vitest-durations

      # Full runs collect coverage. A PR in affected mode runs only the tests
      # that import a changed file (`--changed` against the base tip, the merge
      # commit's first parent) and skips coverage. Shards split by the recorded
      # durations when there are any (tests/ci/shardByDuration.ts).
      - name: Run tests
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          VITEST_SHARD_DURATIONS: ${{ needs.scope.outputs.durations == 'true' && '.vitest-durations/durations.json' || '' }}
          VITEST_DURATIONS_OUT: .vitest-durations/app-${{ matrix.shard }}.json
        run: |
          args=(--silent='passed-only' --reporter=default --reporter=./tests/ci/durationReporter.ts --project app --shard=${{ matrix.shard }}/3)
          if [ "$MODE" = "full" ]; then args+=(--coverage); else args+=(--changed=HEAD^1 --passWithNoTests); fi
          bunx vitest "${args[@]}"

      # Codecov scores a flag on whatever uploads it has, so a shard uploading
      # alone reports a fraction of the coverage as a drop. Hand the report to
      # `upload-sharded-coverage`, which uploads all shards together.
      - name: Save App Coverage shard
        if: success() && needs.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-app-${{ matrix.shard }}
          path: ./coverage/app/lcov.info
          retention-days: 1

      - name: Save test durations
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/canary'
        uses: actions/upload-artifact@v6
        with:
          name: vitest-durations-app-${{ matrix.shard }}
          path: .vitest-durations/app-${{ matrix.shard }}.json
          retention-days: 1

  # Windows-only verification of the local shell execution strategy.
  # The unit tests mock process.platform and fs.existsSync, so they prove
  # nothing about real Windows behaviour: argument tokenization by the Windows
  # CRT, Windows PowerShell 5.1 (which lacks `&&`), and the pwsh/5.1/cmd
  # detection cascade against real install paths. The driver script only needs
  # node builtins, so this job skips the monorepo install entirely.
  test-windows-shell:
    needs: scope
    if: needs.scope.outputs.windows_shell == 'true'
    name: Test Windows Shell

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'canary'

      - name: Verify Windows shell strategy
        run: bun run packages/local-file-shell/scripts/verify-windows-shell.ts

  test-desktop:
    name: ALint & Test Desktop App

    runs-on: ubuntu-latest
    # checks + pull-requests: the alint steps publish an "ALint" check run and
    # keep one summary review on the PR up to date.
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    env:
      ALINT_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Weekly release PRs (`release/weekly-*`, cut from canary) carry a whole cycle
      # of canary changes that already ran alint on their own PRs, and so does a
      # push to main. Re-linting them takes over an hour and spends provider tokens
      # for nothing. Other release branches and `hotfix/*` start from main and get
      # new or cherry-picked changes (and conflict resolutions) on the branch
      # itself, so their PRs are the only place those changes get linted.
      ALINT_SKIP_REASON: >-
        ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/weekly-') && 'weekly release PR, whose changes were linted on their own PRs' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'push to main, whose changes were linted on their own PRs' || '' }}

    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # pnpm 12 writes broken relative symlinks for workspace members outside the desktop
      # workspace root (../../packages/*). Installing the root workspace relinks them so
      # tsrs can resolve sibling packages from source.
      - name: Relink root workspace members
        run: pnpm install --ignore-scripts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Typecheck Desktop
        run: pnpm type-check
        working-directory: apps/desktop

      - name: Test Desktop Client
        run: pnpm test
        working-directory: apps/desktop

      - name: Upload Desktop App Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/desktop/coverage/lcov.info
          flags: desktop

      # ---- alint: model-backed lint rules (packages/alint) on this push's diff ----
      # Findings are published as a separate "ALint" check (red when a rule at
      # `error` level fires) plus one PR review: its summary body is rewritten
      # on every push, and every finding gets an inline comment on its own line
      # — like an eslint run. A file that piles up more than 5 findings is
      # commented once instead, which keeps a runaway run inside the 1000
      # requests/hour GITHUB_TOKEN budget of the whole repository; at the
      # observed volume (a handful of warnings, one per file) per-line comments
      # cost one request each. This job itself never fails because of alint.
      # Skipped when the provider secret is unavailable (forks) and for weekly
      # release PRs and pushes to main (see ALINT_SKIP_REASON). Runs here to
      # reuse the root install instead of paying for another job.
      - name: alint · report a skipped run
        if: ${{ !cancelled() && env.ALINT_API_KEY != '' && env.ALINT_SKIP_REASON != '' }}
        run: echo "::notice::ALint skipped for this ${ALINT_SKIP_REASON}"

      - name: alint · expose the diff against the base as dirty changes
        id: alint_diff
        if: ${{ !cancelled() && env.ALINT_API_KEY != '' && env.ALINT_SKIP_REASON == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'canary' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Tests use the merge commit, but inline lint findings must describe
          # only the PR head. Preserve installed dependencies for alint below.
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          git checkout --force --detach "${HEAD_SHA}"
          MERGE_BASE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD_SHA}" --jq .merge_base_commit.sha)
          echo "merge base: ${MERGE_BASE}"
          git fetch --no-tags --depth=1 origin "${MERGE_BASE}"
          # alint --dirty lints the working tree against HEAD and keeps only the
          # findings on changed lines; moving HEAD to the merge base makes the
          # whole diff "dirty", so the scope is exactly this change.
          git reset --mixed "${MERGE_BASE}"
          git status --short | head -50

      - name: alint · restore cache
        if: ${{ !cancelled() && steps.alint_diff.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .alintcache
          # alint keys each cached result by the rule's own text (>= 0.7.2), so a
          # rule edit re-runs only that rule; restore the latest cache whatever
          # the rule set, instead of starting cold on every rule change.
          key: alint-${{ github.sha }}
          restore-keys: |
            alint-

      - name: alint · lint changed files
        if: ${{ !cancelled() && steps.alint_diff.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bun run alint:setup
          node_modules/.bin/alint plugin install
          node_modules/.bin/alint --dirty --format json > alint-output.json || status=$?
          # 1 = findings at error level (reported by the ALint check), 2 = alint could not run
          if [ "${status:-0}" = "2" ]; then cat alint-output.json; exit 2; fi
          if [ ! -s alint-output.json ]; then echo '{"diagnostics":[]}' > alint-output.json; fi
          bun packages/alint/report.ts alint-output.json

      - name: alint · calibrate rule fixtures (when rules or fixtures changed)
        if: ${{ !cancelled() && steps.alint_diff.outcome == 'success' }}
        continue-on-error: true
        run: |
          if git status --porcelain -- alint.config.toml packages/alint ':(glob)packages/*/alint/**' | grep -q .; then
            cd packages/alint && bunx vitest run fixtures.test.ts
          else
            echo "rules and fixtures unchanged; skipping calibration"
          fi

  # Test Server is usually the last Test CI job to finish; its shards split by
  # recorded duration (tests/ci/shardByDuration.ts) so none trails the others.
  test-server:
    needs: scope
    if: needs.scope.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Test Server (shard ${{ matrix.shard }}/3)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=2 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Download recorded test durations
        if: needs.scope.outputs.durations == 'true'
        uses: actions/download-artifact@v7
        with:
          name: vitest-durations
          path: .vitest-durations

      # See Test App: coverage on full runs, `--changed` on PRs in affected mode.
      - name: Test Server
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          VITEST_SHARD_DURATIONS: ${{ needs.scope.outputs.durations == 'true' && '.vitest-durations/durations.json' || '' }}
          VITEST_DURATIONS_OUT: .vitest-durations/server-${{ matrix.shard }}.json
        run: |
          args=(--silent='passed-only' --reporter=default --reporter=./tests/ci/durationReporter.ts --project server --shard=${{ matrix.shard }}/3)
          if [ "$MODE" = "full" ]; then args+=(--coverage --coverage.reportsDirectory=./apps/server/coverage); else args+=(--changed=HEAD^1 --passWithNoTests); fi
          bunx vitest "${args[@]}"

      # See the App shard above: uploaded together by `upload-sharded-coverage`.
      - name: Save Server Coverage shard
        if: success() && needs.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-server-${{ matrix.shard }}
          path: ./apps/server/coverage/lcov.info
          retention-days: 1

      - name: Save test durations
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/canary'
        uses: actions/upload-artifact@v6
        with:
          name: vitest-durations-server-${{ matrix.shard }}
          path: .vitest-durations/server-${{ matrix.shard }}.json
          retention-days: 1

  # One Codecov upload per sharded flag, sent only once every shard of that
  # flag has passed. Uploading each shard as it finished let Codecov score a
  # flag on a partial report and fail its project status with a false drop
  # (e.g. -25% after 1/3 app shards) until the remaining shards landed.
  # Canary pushes also publish the merged per-file durations for the shards.
  upload-sharded-coverage:
    name: Upload Sharded Coverage
    needs: [scope, test-app, test-server]
    if: ${{ !cancelled() && needs.scope.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Download App Coverage shards
        if: needs.test-app.result == 'success'
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-app-*
          path: ./coverage-shards

      - name: Upload App Coverage to Codecov
        if: needs.test-app.result == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-shards/coverage-app-1/lcov.info,./coverage-shards/coverage-app-2/lcov.info,./coverage-shards/coverage-app-3/lcov.info
          disable_search: true
          flags: app
          name: app

      - name: Download Server Coverage shards
        if: needs.test-server.result == 'success'
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-server-*
          path: ./coverage-shards

      - name: Upload Server Coverage to Codecov
        if: needs.test-server.result == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-shards/coverage-server-1/lcov.info,./coverage-shards/coverage-server-2/lcov.info,./coverage-shards/coverage-server-3/lcov.info
          disable_search: true
          flags: server
          name: server

      - name: Download test durations
        id: durations
        if: github.event_name == 'push' && github.ref == 'refs/heads/canary' && needs.test-app.result == 'success' && needs.test-server.result == 'success'
        uses: actions/download-artifact@v7
        with:
          pattern: vitest-durations-*
          path: ./duration-shards
          merge-multiple: true

      - name: Merge test durations
        if: steps.durations.outcome == 'success'
        run: |
          mkdir -p .vitest-durations
          node -e '
            const fs = require("node:fs");
            const dir = "duration-shards";
            const merged = {};
            for (const file of fs.readdirSync(dir)) Object.assign(merged, JSON.parse(fs.readFileSync(`${dir}/${file}`, "utf8")));
            fs.writeFileSync(".vitest-durations/durations.json", JSON.stringify(merged));
            console.log(`${Object.keys(merged).length} test files`);
          '

      - name: Publish test durations
        if: steps.durations.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .vitest-durations/durations.json
          key: vitest-durations-v1-${{ github.run_id }}

  # The server-DB suite against Postgres. Full runs run all of it with coverage;
  # a PR in affected mode runs the DB tests that import a changed file
  # (`--changed`, which follows the package's `@/` and `@/server/*` aliases into
  # src/ and apps/server/). Migrations and fixtures are read from disk, so
  # changing them makes the whole run full (ci-scope.mjs). Three workers, each
  # with its own database (DATABASE_TEST_WORKERS, see getTestDB).
  test-databsae:
    needs: scope
    if: needs.scope.outputs.database == 'true'
    name: Test Database

    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s  --health-retries 5

        ports:
          - 5432:5432

    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=2 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm i

      - name: Test
        run: |
          if [ "$MODE" = "full" ]; then
            pnpm --filter @lobechat/database test:coverage
          else
            cd packages/database
            bunx vitest run --config vitest.config.server.mts --silent='passed-only' --changed=HEAD^1 --passWithNoTests
          fi
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_TEST_WORKERS: '3'
          DATABASE_DRIVER: node
          KEY_VAULTS_SECRET: Kix2wcUONd4CX51E/ZPAd36BqM4wzJgKjPtz2sGztqQ=
          S3_PUBLIC_DOMAIN: https://example.com
          APP_URL: https://home.com

      - name: Upload Database coverage to Codecov
        if: needs.scope.outputs.mode == 'full'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/database/coverage/lcov.info
          flags: database

  # The one check to require: green when every job this run needed passed,
  # skipped jobs included. Codecov uploads are reporting, not a gate.
  gate:
    name: Test CI Gate
    if: always()
    needs:
      [scope, lint, test-packages, test-app, test-windows-shell, test-desktop, test-server, test-databsae]
    runs-on: ubuntu-latest
    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const bad = Object.entries(needs).filter(([, job]) => !["success", "skipped"].includes(job.result));
            for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
            if (needs.scope.result !== "success") bad.push(["scope", needs.scope]);
            if (bad.length > 0) { console.log(`::error::${bad.map(([name]) => name).join(", ")} did not pass`); process.exit(1); }
          '
