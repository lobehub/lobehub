ge for $dir as $flag...\"\n  ./codecov upload-coverage \\\n    $COMMON_ARGS \\\n    --file \"./packages/$dir/coverage/lcov.info\" \\\n    --flag \"$flag\" \\\n    --disable-search\n}\n\npids=()\nlabels=()\nfailed=0\n\nreap_one() {\n  local pid=\"${pids[0]}\"\n  local label=\"${labels[0]}\"\n\n  if wait \"$pid\"; then\n    echo \"Coverage upload completed for $label.\"\n  else\n    echo \"::error::Coverage upload failed for $label.\"\n    failed=1\n  fi\n\n  pids=(\"${pids[@]:1}\")\n  labels=(\"${labels[@]:1}\")\n}\n\nfor package in $PACKAGES; do\n  dir=\"${package#@lobechat/}\"\n  if [ -f \"./packages/$dir/coverage/lcov.info\" ]; then\n    flag=\"packages/$dir\"\n\n    case \"$dir\" in\n      builtin-tool-*)\n        flag=\"builtin-tools\"\n        ;;\n      locales|env|device-gateway-client)\n        echo \"Skipping Codecov upload for $dir.\"\n        continue\n        ;;\n    esac\n\n    while [ \"${#pids[@]}\" -ge 4 ]; do\n      reap_one\n    done\n\n    upload_coverage \"$dir\" \"$flag\" &\n    pids+=(\"$!\")\n    labels+=(\"$dir\")\n  fi\ndone\n\nwhile [ \"${#pids[@]}\" -gt 0 ]; do\n  reap_one\ndone\n\nif [ \"$failed\" -ne 0 ]; then\n  exit 1\nfi\n"}]},test-app: {needs: check-duplicate-run,if: "needs.check-duplicate-run.outputs.should_skip != 'true'",strategy: {matrix: {shard: [1,2,3,4]}},name: 'Test App (shard ${{ matrix.shard }}/4)',runs-on: ubuntu-latest,steps: [{name: Checkout,env: {REF_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}",REPOSITORY: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"},run: "git init .\ngit remote add origin \"https://github.com/${REPOSITORY}.git\"\ngit fetch --no-tags --depth=1 origin \"${REF_SHA}\"\ngit checkout --force FETCH_HEAD\n"},{name: Setup environment,uses: ./.github/actions/setup-env},{name: Install deps,run: pnpm install},{name: Run tests,run: "bunx vitest --coverage --silent='passed-only' --reporter=d