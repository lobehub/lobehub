name: Release CLI

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - canary
    paths:
      - 'apps/cli/src/**'
      - 'apps/cli/scripts/**'
      - 'apps/cli/package.json'
      - 'apps/cli/pnpm-workspace.yaml'
      - 'apps/cli/tsconfig.json'
      - 'apps/cli/tsdown.config.ts'
      - '!apps/cli/**/*.test.*'
      - '!apps/cli/**/*.spec.*'
      - '!apps/cli/**/__tests__/**'
      - '!apps/cli/**/__fixtures__/**'
      - '!apps/cli/**/fixtures/**'
      - '!apps/cli/**/testUtils.*'
      - '!apps/cli/**/*.md'
      - '!apps/cli/**/*.mdx'
      - '.github/workflows/release-cli.yml'
      - '.github/scripts/cliRelease.mjs'
  workflow_dispatch: {}

# Never interrupt a publish or let two runs publish the same version concurrently.
concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish CLI
    if: github.repository == 'lobehub/lobehub' && github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release version
        id: release
        run: node .github/scripts/cliRelease.mjs prepare

      - name: Setup environment
        if: steps.release.outputs.publish == 'true'
        uses: ./.github/actions/setup-env

      - name: Configure npm registry
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install

      - name: Install CLI workspace dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install
        working-directory: apps/cli

      - name: Test CLI bundle and model-facing docs
        if: steps.release.outputs.publish == 'true'
        run: bunx vitest run --config vitest.config.mts --silent='passed-only' tsdown.config.test.ts bundle.test.ts src/modelFacingDocs.test.ts
        working-directory: apps/cli

      - name: Build publishable CLI bundle
        if: steps.release.outputs.publish == 'true'
        run: npm run prepublishOnly
        working-directory: apps/cli

      - name: Smoke check
        if: steps.release.outputs.publish == 'true'
        run: |
          node dist/index.js --version
          node dist/index.js --help
          test -s dist/maintenanceWorker.mjs
          test -s dist/acceptance-report.html
          test -s man/man1/lh.1
        working-directory: apps/cli

      # Publish exactly the bundle checked above, without rebuilding in lifecycle hooks.
      - name: Pack CLI
        if: steps.release.outputs.publish == 'true'
        run: npm pack --ignore-scripts
        working-directory: apps/cli

      - name: Reserve version for retries
        if: steps.release.outputs.publish == 'true'
        run: node .github/scripts/cliRelease.mjs reserve

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        run: npm publish ./lobehub-cli-*.tgz --provenance --access public --tag latest
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        if: steps.release.outputs.publish == 'true'
        run: node .github/scripts/cliRelease.mjs verify
