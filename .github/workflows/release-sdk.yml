name: Release SDK

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - canary
    paths:
      - packages/sdk/**
      # The SDK is generated from the spec: a spec change ships an SDK change.
      - packages/openapi/openapi.yml
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'canary'

      - name: Install dependencies
        run: pnpm install

      - name: Check generated SDK is in sync
        run: bun scripts/generate-sdk.ts --check
        working-directory: packages/sdk

      - name: Test package
        run: pnpm --filter @lobehub/sdk test

      - name: Build package
        run: pnpm --filter @lobehub/sdk build

      # Semver: package.json `version` + its CHANGELOG.md section go to `latest`;
      # a push whose version is already on npm ships `x.y.(z+1)-canary.<ts>`
      # under the `canary` dist-tag. See packages/sdk/scripts/release-version.ts.
      - name: Prepare publish package
        id: version
        run: |
          PUBLISHED=$(npm view @lobehub/sdk versions --json 2>/dev/null || echo '[]')
          RELEASE=$(bun packages/sdk/scripts/release-version.ts --published "$PUBLISHED")
          SDK_VERSION=$(node -p "JSON.parse(process.argv[1]).version" "$RELEASE")
          SDK_TAG=$(node -p "JSON.parse(process.argv[1]).tag" "$RELEASE")
          export SDK_VERSION

          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'packages/sdk/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const toDistExport = (sourcePath) => sourcePath.replace('./src/', './dist/').replace(/\.ts$/, '.mjs');

          packageJson.version = process.env.SDK_VERSION;
          packageJson.type = 'module';
          packageJson.main = './dist/index.mjs';
          packageJson.types = './dist/index.d.mts';
          packageJson.files = ['dist', 'CHANGELOG.md'];
          packageJson.repository = {
            type: 'git',
            url: 'https://github.com/lobehub/lobehub',
            directory: 'packages/sdk',
          };
          packageJson.exports = Object.fromEntries(
            Object.entries(packageJson.exports).map(([key, value]) => {
              if (typeof value !== 'string') return [key, value];

              const distPath = toDistExport(value);

              return [
                key,
                {
                  types: distPath.replace(/\.mjs$/, '.d.mts'),
                  import: distPath,
                  default: distPath,
                },
              ];
            }),
          );

          delete packageJson.private;
          delete packageJson.devDependencies;
          delete packageJson.scripts;

          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          echo "version=${SDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${SDK_TAG}" >> "$GITHUB_OUTPUT"
          echo "Prepared @lobehub/sdk@${SDK_VERSION} (dist-tag ${SDK_TAG})"

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.tag }}"
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
