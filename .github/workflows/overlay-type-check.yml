name: Overlay Type Check

on:
  pull_request:
    branches: [canary]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'

concurrency:
  group: overlay-type-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.1'

jobs:
  overlay-type-check:
    name: Overlay type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Create overlay token
        id: overlay-token
        uses: ./.github/actions/overlay-token
        with:
          app-id: ${{ vars.LOBEHUB_BOT_APP_ID }}
          private-key: ${{ secrets.LOBEHUB_BOT_APP_PRIVATE_KEY }}
          repository: ${{ vars.OVERLAY_REPOSITORY }}

      - name: Type check this pull request with the overlay
        id: head
        if: steps.overlay-token.outputs.token != ''
        continue-on-error: true
        uses: ./.github/actions/overlay-type-check
        with:
          log-name: head.log
          node-version: ${{ env.NODE_VERSION }}
          overlay-repository: ${{ vars.OVERLAY_REPOSITORY }}
          overlay-token: ${{ steps.overlay-token.outputs.token }}

      # The overlay follows this branch with a delay, so the base can already fail
      # for reasons this pull request did not cause; only errors it adds count.
      - name: Check out the base with this pull request's workflow tooling
        if: steps.head.outcome == 'failure'
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          git checkout --force --detach HEAD^1
          git checkout "$head_sha" -- .github

      - name: Type check the base with the same overlay
        if: steps.head.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/overlay-type-check
        with:
          log-name: base.log
          node-version: ${{ env.NODE_VERSION }}
          overlay-ref: ${{ env.OVERLAY_REF }}
          overlay-repository: ${{ vars.OVERLAY_REPOSITORY }}
          overlay-token: ${{ steps.overlay-token.outputs.token }}

      - name: Fail on type errors this pull request introduces
        if: steps.head.outcome == 'failure'
        run: node .github/scripts/overlayTypeErrors.mjs "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log"
