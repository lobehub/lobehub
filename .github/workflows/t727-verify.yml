name: T727 Verify

on:
  push:
    branches:
      - feat/replica-eval-test-case
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify testCase replica migration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/setup-env
      - name: Install deps
        run: pnpm install
      - name: Lint (eslint + stylelint + type-check + circular deps)
        run: bun run lint
      - name: Test testCase slice
        run: bunx vitest run --project app src/store/eval/slices/testCase/action.test.ts
