name: Revalidate Docs
permissions:
  contents: read

# Aico: not used (no Anthropic org token / not our product surface).
# Restore upstream `on:` when re-enabling. Manual run still possible.
on:
  workflow_dispatch: {}

jobs:
  revalidate:
    name: Revalidate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs revalidation
        run: |
          response=$(curl "${{ secrets.DOCS_REVALIDATE_URL }}" --silent --show-error)
          echo "Response: $response"
          if [ "$response" != '{"success":true}' ]; then
            echo "Error: Unexpected response"
            exit 1
          fi
