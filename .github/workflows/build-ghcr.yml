name: Build GHCR Image

on:
  push:
    branches:
      - chore/ghcr-build-workflow
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: fix-mobile-usage-popover-trigger

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/beiyu114514/lobehub
  IMAGE_TAG: ${{ inputs.tag || 'fix-mobile-usage-popover-trigger' }}

jobs:
  prepare:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve SHA
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  probe:
    name: Verify GHCR write access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe package write
        run: |
          set -euo pipefail
          docker pull busybox:latest
          docker tag busybox:latest "${IMAGE_NAME}:ci-bootstrap"
          docker push "${IMAGE_NAME}:ci-bootstrap"

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare, probe]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.title=LobeHub
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          short_sha="${SHA::7}"
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:sha-${short_sha}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
