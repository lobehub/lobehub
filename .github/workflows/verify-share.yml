{name: Verify Share,'on': {workflow_dispatch: {}},permissions: {actions: read,contents: read,pull-requests: write},concurrency: {group: 'verify-share-${{ github.event.pull_request.number }}',cancel-in-progress: true},jobs: {verify: {runs-on: ubuntu-latest,env: {SAME_REPO: '${{ github.event.pull_request.head.repo.full_name == github.repository }}',USE_OVERLAY: "${{ github.event.pull_request.head.repo.full_name == github.repository && vars.OVERLAY_REPOSITORY != '' && secrets.LOBEHUB_CLOUD_TOKEN != '' }}"},steps: [{name: Checkout,uses: actions/checkout@v7,with: {fetch-depth: 0}},{name: Resolve last successful verify,id: base,env: {GH_TOKEN: '${{ github.token }}'},run: "run_id=$(gh run list --repo \"${{ github.repository }}\" \\\n  --workflow verify-share.yml --status success --limit 1 \\\n  --json databaseId --jq '.[0].databaseId' || true)\necho \"run_id=$run_id\" >> \"$GITHUB_OUTPUT\"\n"},{name: Download last build-inputs manifest,id: manifest,if: "steps.base.outputs.run_id != ''",env: {GH_TOKEN: '${{ github.token }}'},run: "if gh run download \"${{ steps.base.outputs.run_id }}\" --repo \"${{ github.repository }}\" \\\n  -n share-build-inputs -D /tmp/share-manifest; then\n  # An overlay build records this repo's files under the submodule\n  # prefix (`lobehub/src/...`); strip it so the manifest exact-matches\n  # this repo's own diff paths. Overlay-only entries survive\n  # unprefixed and simply never match here.\n  sed -i 's#^lobehub/##' /tmp/share-manifest/build-inputs.txt\n  echo \"path=/tmp/share-manifest/build-inputs.txt\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"no manifest artifact on last successful run\"\nfi\n"},{name: Detect share input changes,id: detect,env: {SHARE_MANIFEST: '${{ steps.manifest.outputs.path }}'},run: "if [ -z \"$SHARE_MANIFEST\" ]; then\n  echo \"no previous verify manifest — building\"\n  echo \"should_build=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  node apps/share/scripts/should-build.mjs \\\n    \"origin/${{ github.base_ref }}\" HEAD\nfi\n"},{name: Overlay business repository,if: "steps.detect.outputs.should_build == 'true' && env.USE_OVERLAY == 'true'",uses: ./.github/actions/business-overlay,with: {overlay-repository: '${{ vars.OVERLAY_REPOSITORY }}',overlay-token: '${{ secrets.LOBEHUB_CLOUD_TOKEN }}'}},{name: Setup environment,if: "steps.detect.outputs.should_build == 'true'",uses: ./.github/actions/setup-env},{name: Install deps (overlay workspace),if: "steps.detect.outputs.should_build == 'true' && env.USE_OVERLAY == 'true'",run: cd .. && pnpm install},{name: Install deps (open-source workspace),if: "steps.detect.outputs.should_build == 'true' && env.USE_OVERLAY != 'true'",run: pnpm install},{name: Build share (business overlay),if: "steps.detect.outputs.should_build == 'true' && env.USE_OVERLAY == 'true'",env: {NODE_ENV: production,VITE_CDN_BASE: 'https://pr${{ github.event.pull_request.number }}-lobehub-share-preview.lobeobjects-tg.workers.dev/'},run: "cd ..\nbun run build:share\nprintf '/*\\n  Access-Control-Allow-Origin: *\\n' > lobehub/apps/share/build/client/_headers\n"},{name: Build share (open-source stubs),if: "steps.detect.outputs.should_build == 'true' && env.USE_OVERLAY != 'true'",env: {NODE_ENV: production,NODE_OPTIONS: '--max-old-space-size=8192'},run: bun run build:rr,working-directory: apps/share},{name: Upload build-inputs manifest,if: "steps.detect.outputs.should_build == 'true'",uses: actions/upload-artifact@v4,with: {name: share-build-inputs,path: apps/share/build-inputs.txt,retention-days: 90}},{name: Upload preview version and validate worker bundle,if: "steps.detect.outputs.should_build == 'true'",shell: bash,env: {CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}',HEAD_SHA: '${{ github.event.pull_request.head.sha }}',PR: '${{ github.event.pull_request.number }}'},run: "if [ \"$SAME_REPO\" = 'true' ]; then\n  set -- --preview-alias \"pr${PR}\" --tag \"${HEAD_SHA::7}\" \\\n    --message \"PR-${PR} ${GITHUB_ACTOR} ${GITHUB_REPOSITORY}@${HEAD_SHA::7} run ${GITHUB_RUN_ID}\"\nelse\n  set -- --dry-run\nfi\n# Previews go to a sibling `-preview` Worker, never to the production script:\n# Cloudflare only rolls back to the 100 most recently uploaded versions, and PR\n# uploads onto the real script would push its deployed versions out of that\n# window within a day.\nnode_modules/.bin/wrangler versions upload \\\n  --name lobehub-share-preview \\\n  --config build/server/wrangler.json \"$@\" | tee /tmp/upload.log\ngzip_kib=$(grep -Eo 'gzip: [0-9.]+ KiB' /tmp/upload.log | grep -Eo '[0-9.]+' | head -1)\necho \"worker gzip size: ${gzip_kib} KiB\"\nif [ -n \"$gzip_kib\" ] && [ \"$(printf '%.0f' \"$gzip_kib\")\" -gt 8192 ]; then\n  echo \"::error::worker bundle ${gzip_kib} KiB gzip exceeds the 8 MiB guard (plan limit is 10 MiB)\"\n  exit 1\nfi\nif [ \"$SAME_REPO\" = 'true' ]; then\n  echo \"Preview: https://pr${PR}-lobehub-share-preview.lobeobjects-tg.workers.dev\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n",working-directory: apps/share},{name: Comment the preview URL,if: "steps.detect.outputs.should_build == 'true' && env.SAME_REPO == 'true'",shell: bash,env: {GH_TOKEN: '${{ github.token }}',PR: '${{ github.event.pull_request.number }}',REPO: '${{ github.repository }}'},run: "# Matched on a marker rather than `gh pr comment --edit-last`, which edits the\n# last comment by this actor — and other workflows in this repo comment as the\n# same bot, so it would rewrite one of theirs.\nmarker='<!-- share-preview -->'\nif [ -n \"${OVERLAY_REF:-}\" ]; then\n  build_note=\"Built with the business overlay @ ${OVERLAY_REF} — the same surfaces the deployed worker renders.\"\nelse\n  build_note=\"Built with the open-source business stubs — overlay surfaces render their fallback here.\"\nfi\nbody=\"${marker}\n### Share preview\n\n<https://pr${PR}-lobehub-share-preview.lobeobjects-tg.workers.dev>\n\nA version, not a deployment: it takes no production traffic. ${build_note}\"\nid=$(gh api \"repos/${REPO}/issues/${PR}/comments\" --paginate \\\n  --jq \"map(select(.body | startswith(\\\"${marker}\\\"))) | .[0].id // empty\")\nif [ -n \"$id\" ]; then\n  gh api -X PATCH \"repos/${REPO}/issues/comments/${id}\" -f body=\"$body\" > /dev/null\nelse\n  gh api -X POST \"repos/${REPO}/issues/${PR}/comments\" -f body=\"$body\" > /dev/null\nfi\n"}]}}}