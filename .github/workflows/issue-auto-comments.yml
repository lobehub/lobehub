name: Issue Auto Comment
on:
  issues:
    types:
      - opened
      - closed
      - assigned
  pull_request_target:
    types:
      - opened
      - closed

permissions:
  contents: read

jobs:
  run:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Auto Comment on Issues Closed
        uses: wow-actions/auto-comment@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          issuesClosed: |
            ✅ @{{ author }}

            This issue is closed, If you have any questions, you can comment and reply.
      - name: Checkout repository
        if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
        uses: actions/checkout@v6

      - name: Check if PR author is maintainer
        if: github.event.pull_request.merged == true
        id: maintainer-check
        run: |
          if [ -f .github/maintainers.txt ] && grep -qx "${{ github.event.pull_request.user.login }}" .github/maintainers.txt; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Auto Comment on Pull Request Merged
        if: github.event.pull_request.merged == true && steps.maintainer-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<'EOF'
          ❤️ Great PR @${{ github.event.pull_request.user.login }} ❤️

          The growth of project is inseparable from user feedback and contribution, thanks for your contribution! If you are interesting with the lobehub developer community, please join our [discord](https://discord.com/invite/AYFPHvv2jT) and then dm @arvinxx or @canisminor1990. They will invite you to our private developer channel. We are talking about the lobe-chat development or sharing ai newsletter around the world.
          EOF
          )"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/reactions" \
            -f content='hooray' || true

