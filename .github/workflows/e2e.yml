name: E2E CI

on:
  push:
    branches:
      - main
      - canary
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/issue-*.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/sync*.y*ml'
      - '.github/workflows/auto-*.yml'
      - '.github/workflows/manual-*.yml'
      - '.github/workflows/bundle-analyzer.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/issue-*.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/sync*.y*ml'
      - '.github/workflows/auto-*.yml'
      - '.github/workflows/manual-*.yml'
      - '.github/workflows/bundle-analyzer.yml'

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR pushes supersede each other; canary/main push runs always finish (they
  # publish the size baselines), a newer push waits instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Size gates run on every PR. Main/canary pushes run the full E2E job and publish
  # their baselines, while the PR run owns the comparison gate.
  SIZE_GATE_ENABLED: ${{ github.event_name == 'pull_request' }}
  APP_URL: http://localhost:3006
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  DATABASE_DRIVER: node
  KEY_VAULTS_SECRET: LA7n9k3JdEcbSgml2sxfw+4TV1AzaaFU5+R176aQz4s=
  AUTH_SECRET: e2e-test-secret-key-for-better-auth-32chars!
  AUTH_EMAIL_VERIFICATION: '0'
  # Mock S3 env vars to prevent initialization errors
  S3_ACCESS_KEY_ID: e2e-mock-access-key
  S3_SECRET_ACCESS_KEY: e2e-mock-secret-key
  S3_BUCKET: e2e-mock-bucket
  S3_ENDPOINT: https://e2e-mock-s3.localhost

jobs:
  # Same decision as Test CI (.github/scripts/ci-scope.mjs): a PR that changes
  # nothing the deployed app is built from (tests only, desktop, CLI, docs, CI
  # scripts) skips the build and the browser tests. Render Budget runs for UI
  # changes only.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
      render_budget: ${{ steps.scope.outputs.render_budget }}
    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=2 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Decide what to test
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/ci-scope.mjs

  e2e:
    name: Test Web App
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s  --health-retries 5

        ports:
          - 5432:5432

    timeout-minutes: 30
    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: pnpm install

      - name: Generate OIDC test signing key
        run: |
          JWKS_KEY="$(bun -e "import { createTestOidcJwks } from './e2e/src/support/oidcTestKey'; process.stdout.write(createTestOidcJwks());")"
          printf 'JWKS_KEY=%s\n' "$JWKS_KEY" >> "$GITHUB_ENV"

      - name: Install Playwright browsers (with system deps)
        run: bunx playwright install --with-deps chromium

      - name: Run database migrations
        run: bun run db:migrate

      # Turbopack's persistent cache: with a warm cache the Next.js compile of
      # the same tree took 2.2 s instead of 2.1 min. It is 1.1 GB and the repo's
      # Actions cache is full, so only the first canary push of each day saves
      # one; every run restores the newest.
      - name: Restore the Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: next-build-v1-${{ github.sha }}
          restore-keys: |
            next-build-v1-

      - name: Build application
        run: bun run build
        env:
          SKIP_LINT: '1'

      - name: Name today's Next.js build cache
        id: next_cache_day
        if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Save the Next.js build cache (first canary push of the day)
        if: steps.next_cache_day.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-build-v1-${{ steps.next_cache_day.outputs.day }}

      # ===== Bundle size gate (web dist) =====
      # Baseline: artifact from the latest successful canary commit in the tested SHA's lineage.
      - name: Find latest canary baseline run
        if: env.SIZE_GATE_ENABLED == 'true'
        id: baseline_run
        uses: actions/github-script@v8
        with:
          # github-script JSON-encodes return values by default; we need the raw run id string
          result-encoding: string
          script: |
            const finder = require('${{ github.workspace }}/.github/scripts/find-size-baseline.cjs');
            return await finder({
              github,
              context,
              workflowId: 'e2e.yml',
              artifactName: 'bundle-size-baseline-web',
              targetSha: context.sha,
            });

      - name: Download web dist size baseline
        if: env.SIZE_GATE_ENABLED == 'true' && steps.baseline_run.outputs.result != ''
        uses: actions/download-artifact@v7
        with:
          name: bundle-size-baseline-web
          path: .size-baseline/
          run-id: ${{ steps.baseline_run.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure web dist size
        run: node .github/scripts/bundle-size-gate.cjs measure --type web --out size-report/web.json

      - name: Upload web dist size baseline (canary only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
        uses: actions/upload-artifact@v6
        with:
          name: bundle-size-baseline-web
          path: size-report/web.json
          retention-days: 30

      - name: Check web dist size against baseline
        if: env.SIZE_GATE_ENABLED == 'true'
        id: dist_size_check
        continue-on-error: true
        run: node .github/scripts/bundle-size-gate.cjs check --current size-report/web.json --baseline .size-baseline/web.json --label "Web dist" --report size-report/report.md

      # ===== Entry static-import graph gate =====
      # Total dist size cannot see a lazy chunk being pulled back into the first-screen sync graph; this can.
      - name: Find latest canary entry-graph baseline run
        if: env.SIZE_GATE_ENABLED == 'true'
        id: entry_graph_baseline_run
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const finder = require('${{ github.workspace }}/.github/scripts/find-size-baseline.cjs');
            return await finder({
              github,
              context,
              workflowId: 'e2e.yml',
              artifactName: 'bundle-size-baseline-entry-graph',
              targetSha: context.sha,
            });

      - name: Download entry-graph baseline
        if: env.SIZE_GATE_ENABLED == 'true' && steps.entry_graph_baseline_run.outputs.result != ''
        uses: actions/download-artifact@v7
        with:
          name: bundle-size-baseline-entry-graph
          path: .size-baseline/
          run-id: ${{ steps.entry_graph_baseline_run.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure entry static-import graph
        run: node .github/scripts/bundle-size-gate.cjs measure --type entry-graph --out size-report/entry-graph.json

      - name: Upload entry-graph baseline (canary only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
        uses: actions/upload-artifact@v6
        with:
          name: bundle-size-baseline-entry-graph
          path: size-report/entry-graph.json
          retention-days: 30

      - name: Check entry static-import graph against baseline
        if: env.SIZE_GATE_ENABLED == 'true'
        id: entry_graph_check
        continue-on-error: true
        run: node .github/scripts/bundle-size-gate.cjs check --current size-report/entry-graph.json --baseline .size-baseline/entry-graph.json --label "First-screen static import graph (gzip)" --report size-report/report.md --floor 65536

      - name: Upload size report with resolved dependency versions
        if: ${{ !cancelled() && env.SIZE_GATE_ENABLED == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: size-report
          path: size-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment bundle size report on PR
        if: ${{ !cancelled() && env.SIZE_GATE_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const report = fs.existsSync('size-report/report.md')
              ? fs.readFileSync('size-report/report.md', 'utf8')
              : 'Build did not reach the size gate step.';
            const comment = require('${{ github.workspace }}/.github/scripts/size-gate-comment.cjs');
            const issueNumber =
              context.issue?.number ??
              (await github.rest.repos.listPullRequestsAssociatedWithCommit({
                commit_sha: context.sha,
                owner: context.repo.owner,
                repo: context.repo.repo,
              })).data.find((pr) => pr.state === 'open')?.number;
            if (!issueNumber) {
              console.log('No open PR for this commit, skipping the size gate comment.');
              return;
            }
            await comment({
              github,
              context,
              issueNumber,
              title: 'Web dist',
              report,
              failed: ${{ steps.dist_size_check.outcome == 'failure' || steps.entry_graph_check.outcome == 'failure' }},
              identifier: 'web',
            });

      - name: Start E2E server
        run: |
          bunx next start -p 3006 > /tmp/lobehub-e2e-server.log 2>&1 &
          echo $! > /tmp/lobehub-e2e-server.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:3006 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lobehub-e2e-server.log
          exit 1

      - name: Run E2E tests
        run: bun run e2e
        env:
          BASE_URL: http://localhost:3006
          E2E_PARALLEL: '3'
          E2E_REPORTS: '0'
          HEADLESS: 'true'

      - name: Upload E2E test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts
          path: |
            e2e/reports
            e2e/screenshots
          if-no-files-found: ignore

  render-budget:
    name: Render Budget
    needs: scope
    if: needs.scope.outputs.render_budget == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s  --health-retries 5

        ports:
          - 5432:5432

    timeout-minutes: 30
    steps:
      - name: Checkout
        env:
          # Match the workflow's revision: PR merge commit, or the pushed commit.
          # Keep fetching anonymously; PR tests must not need checkout credentials.
          REF_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: pnpm install

      - name: Generate OIDC test signing key
        run: |
          JWKS_KEY="$(bun -e "import { createTestOidcJwks } from './e2e/src/support/oidcTestKey'; process.stdout.write(createTestOidcJwks());")"
          printf 'JWKS_KEY=%s\n' "$JWKS_KEY" >> "$GITHUB_ENV"

      - name: Install Playwright browsers (with system deps)
        run: bunx playwright install --with-deps chromium

      - name: Run database migrations
        run: bun run db:migrate

      # React's profiling build makes <Profiler> report in a production bundle;
      # the regular E2E job keeps the shipped bundle so its size gates stay exact.
      - name: Build application (React profiling)
        run: bun run build
        env:
          LOBE_REACT_PROFILING: '1'
          SKIP_LINT: '1'

      - name: Start E2E server
        run: |
          bunx next start -p 3006 > /tmp/lobehub-e2e-server.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:3006 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lobehub-e2e-server.log
          exit 1

      - name: Run render budget scenarios
        working-directory: e2e
        run: bun run test:perf
        env:
          BASE_URL: http://localhost:3006
          E2E_REPORTS: '0'
          HEADLESS: 'true'

      - name: Upload render budget receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: render-budget
          path: |
            e2e/reports/render-budget
            e2e/screenshots
          retention-days: 30
          if-no-files-found: ignore

  # The one check to require: green when every job this run needed passed.
  gate:
    name: E2E CI Gate
    if: always()
    needs: [scope, e2e, render-budget]
    runs-on: ubuntu-latest
    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const bad = Object.entries(needs).filter(([, job]) => !["success", "skipped"].includes(job.result));
            for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
            if (needs.scope.result !== "success") bad.push(["scope", needs.scope]);
            if (bad.length > 0) { console.log(`::error::${bad.map(([name]) => name).join(", ")} did not pass`); process.exit(1); }
          '
