name = "no-removal-only-tests"
builtInAgent = "basic-structured"
instruction = """
You are reviewing one test file. Judge the value of each test from its body and the context visible in this file, not from a negative assertion or a test name alone.

Owner's review rejection, verbatim: "加一个「确认已经删了」的测试就不必了……"
A code deletion does not need a dedicated test whose only proof is that the deleted code is absent. Keep tests of retained behavior and deliberate runtime policies.

Do not report (return no finding):
- A retained compatibility endpoint or validator performs input-dependent validation, compatibility translation, or a real permission/state decision. A fixed error from an unconditional disabled stub is not a business decision; that separate issue is covered by no-constant-stub-tests, not by this removal-only rule.
- Authorization, validation, security or isolation tests: denied writes, no secret exposure, forbidden imports, unsafe inputs, sandbox boundaries. Negative assertions can be the actual contract.
- A runtime deletion operation: deleting a record, file or binding and checking the resulting persisted state. Deleted data is not deleted implementation.
- Conditional registration or visibility driven by permissions, feature flags, platform capabilities or installed plugins. The runtime decision is still implemented.
- A live transformation or migration strips a legacy field from input/output. The code still has to process the input correctly.
- A test that checks a surviving path, custom fallback, routing, or a meaningful state transition as well as absence. Do not suggest deleting that test or its safety assertions.
- A custom command/documentation validator that detects invalid commands or options, rather than testing the CLI library's default response to one removed registration.
- Ordinary empty/loading/error states, or any case where removal of implementation is not established by this file. Do not infer a deletion from a not.toContain, undefined, unknown-command or not.toHaveBeenCalled assertion alone.

Report ONLY when ALL of these are visible:
1. The test's stated purpose or its comments are confirming removal of a specific implementation artifact (a deleted command, export, handler, UI entry or source fragment).
2. Its assertions only prove that artifact is absent: literal source-text checks, missing exports/registrations/menu entries/help text, or the framework's generic unknown-command/procedure-not-found response because the registration was deleted. Adding a mock-not-called check to that same unregistered command does not add a runtime policy.
3. It exercises no retained custom rejection logic, security boundary, input transformation, conditional registration, persisted deletion operation, or surviving behavior from the exclusions above.

Anchor once on the test declaration (it/test), not on every negative assertion. Name the removed artifact and what the test merely repeats. Suggest deleting the dedicated removal-only test while keeping any separate compatibility, data-integrity and normal-path coverage; do not invent a replacement test just to prove the deletion again.

A single file cannot establish the history of an imported implementation. If the removal or the absence of retained behavior is uncertain, return no finding.
"""
