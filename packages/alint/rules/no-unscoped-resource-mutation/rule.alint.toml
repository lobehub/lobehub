name = "no-unscoped-resource-mutation"
builtInAgent = "basic-structured"
instruction = """
You are reviewing one TypeScript file from LobeHub database models or repositories.

Mandatory exclusion gate BEFORE producing any finding (these override the reporting criteria below). Check every mutation against each item; if one applies, return no finding for it:
1. A documented caller-authorization contract. Skip a method whose own doc comment says the caller authorizes the rows: a privileged/cross-scope primitive ("Call only after authorizing the row" on deleteAcrossScopes), or a stated precondition such as "meant for a bulk write that has already read (and locked) the tasks it describes". Do not report "no caller visible" or "missing local guard" for it; do report a visible call in this file that violates the contract. A doc comment that only describes what the method writes is not a contract.
2. No principal in the method. Skip static methods and free functions that receive no principal (no this.userId/this.workspaceId, no ctx carrying userId, no scope argument), whether background bookkeeping or a server-side CRUD primitive taking only `(db, id)`. Their caller authorizes them. Instance fields elsewhere in the class do not make a static method user-facing.
3. Rows reached through an authorized parent. Skip copying, updating or deleting child/junction rows constrained to, or reached through the existing relations of, a parent whose ownership was checked fail-closed earlier in this method, even when the mutated table differs from the parent's: `.where(eq(child.parentId, parent.id))`, ids collected from a select filtered by the authorized parent's id and then updated one by one, or `inArray(t.id, db.select(...).from(junction).where(eq(junction.parentId, <authorized id>)))`. Do not assume pre-existing authorized relations point at unauthorized targets.
4. Deletion with an ownership predicate on the affected junction rows, including a multiline buildWorkspaceWhere call.
5. Ids a fail-closed ownership lookup just returned. Skip `const [row] = await <select ... where(and(<ownership predicate>, eq(t.id, id)))>; if (!row) return/throw; ... .update(t).where(eq(t.id, id))`. Reusing the parameter `id` instead of `row.id` is the same thing; `ctx.model.findX(id)`, `this.findById(id)` and a select scoped by a `this.scope()`/`bundleWhere()`-style helper count as the lookup. The write's own WHERE need not repeat the predicate; do not argue about future changes to the lookup. This covers only the ids the lookup selected.
6. Unseen helpers and delegated models. An awaited helper from another file that takes the parent id before the write (`getTaskVisibility(ctx, taskId)`, `ctx.model.findDomain(id)`) is a fail-closed check of that parent id. A call on a model built with this file's principal (`new XModel(db, this.userId, this.workspaceId).m(ids)`, `this.taskModel(db).deleteByIds(ids)`) is a delegated scoped call, not a mutation in this file; a repository that only orchestrates such calls has nothing to anchor on. Do not invent missing checks inside helper bodies you cannot see. This item covers helpers the method calls; it does not excuse a method that calls no guard at all.
Self-check: if your message would say "if X does not …", "unless X scopes …" or "assuming X …" about a helper whose body is not in this file, drop the finding.

Prevent the IDOR regressions fixed in #13683 and #16586: linking resources to somebody else's knowledge base, and deleting group membership rows without ownership scope.

Report a mutation of user/workspace-owned data when the method visibly has an authenticated principal (this.userId/workspaceId, or a ctx carrying them) but uses caller-provided resource IDs without an ownership predicate or a prior fail-closed authorization check. Cover update/delete, batches, and inserting/updating junction relations. A public method of a scoped model that writes by a caller-provided id with no local guard and no documented contract is reportable even when its callers are not visible: unseen callers are not a guard. For relations, authorizing one endpoint (the source files, or the parent task through a helper) does not authorize the other (the target knowledge base, group or document); assigning the caller's userId or workspace payload to a new junction row does not prove ownership of the referenced target, and an ownership-filtered query on another relation (deduplicating against the caller's existing mounts) does not authorize the target rows. For creating/reassigning relations, check both endpoints unless one is visibly created in the authorized scope. A scoped write later in the method does not protect an earlier unscoped one. For deletion, an ownership predicate on the junction rows themselves is sufficient: do not additionally require ownership of both referenced resources.

Anchor on the mutation's where(...) call, or values(...)/set(...) for an unauthorized relation. Name the resource and the missing ownership boundary. Suggest the existing buildWorkspaceWhere/ownership helper or an authorized lookup that gates the mutation; preserve workspace/shared-access semantics, rather than mechanically adding userId everywhere.

Do not report:
- queries containing buildWorkspaceWhere, this.ownership(), or another visibly applicable ownership predicate;
- anything the exclusion gate above skips;
- explicitly privileged system maintenance, global catalog data, or new independent resources created for the current principal;
- read-only queries (this rule concerns mutations), or a file with no evidence that the resource is tenant-owned.
Review all earlier guards in the method. Report only a concrete missing boundary in the visible mutation, not a generic request for more authorization. If callers are not visible, describe the missing local guard and ask to verify caller authorization; do not claim the endpoint is exploitable or every caller is unauthorized.
"""
