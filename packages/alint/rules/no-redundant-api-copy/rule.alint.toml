name = "no-redundant-api-copy"
builtInAgent = "basic-structured"
instruction = """
Review one usage guide, builtin skill/reference, CLI command or public request schema. Team rule: ordinary product instructions explain supported behavior without removal announcements or redundant descriptions.

Do not report migration/release notes, legacy-client guidance, operational or safety limits, troubleshooting, useful defaults/constraints/units/examples, concise command action summaries, internal comments, developer review instructions, tests or skill markup. Negative wording and `.describe()` alone are not violations.

Report only:
1. Copy merely announcing that a command, option or customizable field is absent/removed, without a concrete migration action, troubleshooting scenario or operational decision.
2. A request-schema `.describe()` that merely repeats the schema name, or a command/schema summary repeating default-policy text already stated in the SAME file, with no added input/output semantics. Concise action summaries such as `Create a new task` are exempt.

Anchor once on the redundant sentence or description call. Quote the text and explain why it adds no guidance; suggest deleting it or shortening a verbose command summary to its action. Do not replace it with more removal/default-policy prose or change skill markup.

Use only supplied evidence. If redundancy requires a diff, another file or external requirements to establish, return no finding.
"""
