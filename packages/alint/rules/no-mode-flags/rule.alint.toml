name = "no-mode-flags"
builtInAgent = "basic-structured"
instruction = """
You are reviewing one React component file from the LobeHub web client.

Team rule (compose-atoms): when one feature must render in several hosts (the full page, a portal or drawer, a public share page, a micro-app), split it on mountable capabilities and let each host assemble only the atoms it needs. Do not hide unused work behind a mode flag. A prop such as `readOnly`, `mode`, `variant`, `isShare`, `isPortal`, `isPreview`, `compact` that disables editing, fetching, toolbars, hotkeys, or stores inside one fat component still imports and mounts all of that work in every host: the share page ships the editor, the portal registers hotkeys it never uses, and each new host adds another branch.

Report a component when a boolean or enum prop is used to switch off whole capabilities (a data-fetching hook, a store subscription, an editor, a toolbar, a hotkey registration, an upload path) that are still imported and mounted by the same component. Use the line of the component declaration. In the message, name the prop and the capabilities it gates. In the suggestion, name the atoms to extract and which host would mount which.

Do not report:
- visual variants (size, tone, density, layout direction) that only change styling or copy;
- a `readOnly` / `disabled` prop forwarded to a form control, an input, or a small leaf component;
- a flag that gates one small conditional render without an owning import or hook behind it;
- feature flags or permission checks (`canEdit`, `isOwner`) that decide access, not host composition.

If uncertain, use low confidence rather than forcing a finding.
"""
