name = "no-secret-exposure"
builtInAgent = "basic-structured"
instruction = """
Mandatory evidence gate: identify an actual credential field/value flowing to the sink, not merely an object that could hypothetically contain one. The diagnostic must quote that credential field name as it appears in this file (e.g. `apiKey`, `keyVaults`, `botToken`, `accessToken`, `password`); if you cannot quote one, return no finding. A finding whose own message is conditional ("if the payload carries…", "if the thrown error…", "may contain", "not visible in this file") must be returned as no finding. Before reporting, check these exclusions; if one applies, return no finding:
- JWT payload/sub/aud/client_id claims alone are not access/refresh token credentials. Do not invent credential-bearing claims.
- Logging a caught error object (`log('…%O', err)`, `console.error(err)`, `logger.error({ err })`, error.message) from a call that loads, decrypts or uses credentials (`find*WithCredentials`, `decrypt*`, `getUserKeyVaults`, `verifyToken`): the error does not contain the credential because the call's name or the surrounding scope involves credentials. Report only when this file builds the logged text or object from a credential field. Library/parser diagnostic contents require separate review.
- A field named `token`/`nonce`/`key`/`secret` whose role in this file is a turn, idempotency, CAS or correlation identifier (generated with randomUUID, embedded in message or record ids, compared for staleness) returned to the authenticated owner of the record. The field name alone is not evidence; identify what the value authenticates to on its own.
- Passing a whole API/tRPC/model response to outputJson, res.json, Response.json or console.log(JSON.stringify(…)) when this file shows no credential field in that value. Do not infer secret fields from a spread, an unseen query, or a return type.

Review only this file. Require a concrete untrusted source, dangerous sink, and missing protection visible in the file. Follow local aliases and guards. Do not invent caller behavior or vulnerabilities inside unseen helpers. Report at the sink line, name the source and missing boundary, and suggest a specific fix. Do not include secret values or payloads in diagnostics. Findings are review warnings, not claims of proven exploitability.

Prevent accidental credential exposure through logs, public configuration, or API/list responses. Historical #19452 stopped returning bot credentials from channel lists.
Report explicitly identified passwords, API keys, access/refresh tokens, Authorization/cookie headers, decrypted credential objects, or private signing keys flowing to console/debug/logger output, an ordinary public/list response, or browser-visible config. Also report a server secret assigned into a NEXT_PUBLIC_* config/serialized bootstrap. An entire headers/credential/request object is sensitive when its credential contents are visible. Report literal credentials only when clearly a real credential rather than a placeholder; never reproduce their values.
Recommend a field allowlist for response DTOs, redaction/omission for logs, and keeping server secrets in server-only config. Anchor on logging/return/config exposure, one finding per sink.
Do not report secret presence booleans, identifiers, masked/redacted values, ciphertext stored server-side, env reads alone, token hashes/fingerprints, fixtures/placeholders, or the intentional authenticated credential-issuance/reveal endpoint needed to deliver that credential to its owner. Diagnostic messages must contain field names only, never secret contents.
"""
