name = "no-unbounded-refetch"
builtInAgent = "basic-structured"
instruction = """
You are reviewing one TypeScript or React file from LobeHub's web client (features, hooks, Zustand store actions, layout) or the Electron main process.

Team rule, from the owner's request when this was found: "我是让你看看请求流量, 看看有哪些异常请求是多余的" — "收益高好修的都修". Every client request is a serverless function invocation, and most of them also read Postgres. Fixed cases: `channel.list` polled every 2 s by every client plus one refresh per subscriber on each `channel_changed`; `device.getRunningSummary` run by its own 15 s timer in each device card, even with the sidebar closed; `acceptance.getBySubject` polled every 2 s forever while no acceptance existed, by 2-3 components at once; and a desktop client re-reading a multi-MB message page thousands of times a day. lobehub#23745 and lobehub#23160 fixed these with terminal states, shared keys, dedupe, backoff, cheap change probes and coalesced refetches.

Report each of these, anchored on the line of the interval value, the `setInterval`/`setTimeout` call, or the refetch call:
1. A `refreshInterval`, `setInterval` or self-rescheduling `setTimeout` that makes a network request and keeps polling forever: no branch returns `0`/stops on a terminal or settled state, no backoff, no cap on attempts or duration, and no gate on visibility, focus, an open panel, or a boolean such as `enabled`, `active`, `live`, `isPaused`. Report it at 10 s or less, or at 30 s or less when the file shows it is mounted on an always-present surface (app layout, home page, sidebar, a global provider) or keeps polling while the thing it waits for does not exist yet.
2. A polling hook that is mounted once per row, card or list item (the file shows it is used inside a `.map` or an item component) without a shared SWR key, `dedupingInterval`, or a parent that polls once for all items.
3. A poll that re-fetches a heavy payload (the whole message page, a full list) only to learn one boolean or status, when a narrow probe would answer it (a status or revision endpoint, a snapshot query). The message names what the poll actually needs.
4. A server-event or stream handler for a frequent event (`tool_end`, `step_end`, stream chunks, `*_changed` broadcast to every subscriber) that calls a whole-scope refetch (`refreshMessages`, `refresh()`, `mutate()` of a page key, `getMessages`) once per event or once per subscriber, while the same file already applies the incremental patch for that event and the call is not behind coalescing (debounce, in-flight guard, a refresh gate or supersede ticket, one refetch per run end). The message names the missing coalescing.

Do not report:
- A timer that makes no network request (a re-render tick, a countdown, a local recompute, a watchdog), at any period.
- Short-lived polls that end by themselves: OAuth/device-code login, upload or import processing, an export job, a generation task, a verification run — when the interval stops on success, failure, a terminal status or timeout, even if each tick calls `mutate()` on a bundle.
- SSE/WebSocket heartbeats and keep-alives.
- Polls of 30 s or more against a small status endpoint, and polls of 10 s or more of one small object or a short list on a page-scoped surface.
- A poll inside a modal, drawer, popover or detail page that is mounted only while open, even without an explicit `enabled` flag.
- A poll already deduped by a shared SWR key, `dedupingInterval`, or gated by `document.visibilityState` / window focus / an open panel / `refreshWhenHidden: false`, or a function-form `refreshInterval` that can return 0.
- A refetch in a stream handler that goes through a gate, ticket or supersede helper (`refreshGate.*`, `isSuperseded`, a snapshot generation, a processing chain), even when the helper is defined in another file.
- A refetch on a rare, human-paced or legacy event: approval or intervention requests, a pause on `toolMessageIds`, a fallback for older servers, `notify_update`.
- A refetch that runs after a reconnect, a revision gap, a stop/abort, or once at the end of a run.
- Internal-only admin or developer consoles the file marks as such, which the owner ranked as low priority ("这个就我们内部人用吧").

If an exclusion applies, return no finding. If uncertain, use low confidence rather than forcing a finding.
"""
