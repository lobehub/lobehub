name = "ui-lightweight-errors"
builtInAgent = "basic-structured"
instruction = """
You are reviewing one React component file from LobeHub's web client.

Team rule, distilled from the product owner's review rejections ("你能否把这种报错展示换成轻量化的？轻量化的情况下再有一个 show detail，这样比较舒服", "我记得我们的 UI 里面有一种是直接一个很轻量的展示", "这块 error 展示太丑了，间距没有配置好"): an error inside a feature is shown as one short, readable line — an icon, a human sentence of what failed and what to do — with the raw details (stack, response body, provider message, error code) folded behind a "show details" toggle. A full red panel with the raw message dumped in is not acceptable.

Report, anchoring on the line of the error element:
1. an error state rendered as a large `Alert type="error"`, red block or bordered box inside a card, list row, message or panel, when it is not a page-level failure;
2. a raw error string, `error.message`, `JSON.stringify(error)`, a stack or an HTTP body shown directly to the user without a readable summary and a details toggle. A hover `Tooltip` / `title` and an `Alert`'s `extra` count as the details toggle (see below);
3. an error `description` that repeats the technical message instead of saying what the user can do.
In the message, name the error surface. In the suggestion, describe the one-line summary plus the folded details.

Do not report:
- page-level error boundaries and full-page error screens;
- form field validation messages;
- developer-only surfaces (DevPanel, debug views, logs, test consoles);
- errors already rendered through a shared error component: `AsyncBoundary` / `AsyncError`, `ErrorContent`, `ErrorBoundary` / `AlertFallback`, `customErrorRender`;
- `toast.error(...)` / `message.error(...)` — a toast already is the lightweight form;
- full-page auth, OAuth and device-pairing screens;
- tool execution output (stdout / stderr / a result field whose value is the error). This includes a per-item `error` inside a builtin tool's Render / Inspector / Streaming component (`BuiltinRenderProps`, `pluginState.results[].error`, files under `packages/builtin-tool-*/src/client/`): a failed item in a tool result is tool output, not a feature error state;
- eval result fields whose value is the failure reason: `evalResult.error`, a `failureReason`, or any eval case / run result shown under a failure-reason label in `src/routes/(main)/eval/**`;
- raw error text placed inside a hover `Tooltip`'s `title`, or in an element's `title` attribute (including a row component's `title` prop, such as `OverviewRow`), when the visible element is a compact tag or row with a translated label: the tooltip is the folded details;
- raw messages passed as the `extra` of an `Alert` from `@lobehub/ui`, under a translated `title` / `description`: `extra` renders as a collapsed details toggle. Report it only when `extraDefaultExpand` is set or the raw text is in `title` / `description`; a red `type="error"` Alert inside a card is still pattern 1;
- a single translated inline line that already reads as a sentence. A `t()` call that only wraps the raw message in a prefix (`t('file.error', { message: message || 'Unknown error' })`, a key like `'Error: {{message}}'`) is not such a sentence: what the user reads is the raw message, so report it under pattern 2.

If an exclusion applies, return no finding. If uncertain, use low confidence.
"""
