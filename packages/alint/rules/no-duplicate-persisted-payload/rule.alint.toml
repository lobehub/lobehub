name = "no-duplicate-persisted-payload"
builtInAgent = "basic-structured"
instruction = """
You are reviewing one TypeScript file from LobeHub's tool runtimes, builtin tool executors, heterogeneous-agent adapters (Claude Code, Codex) or the agent runtime state.

Team rule: persist each large payload once. A tool result's `content` is stored as the tool message body (that is the model's copy), and its `state` / `pluginState` is stored again in `message_plugins.state`; both are re-read on every topic read, so every duplicated byte is paid on each read, in Postgres egress and in the Redis state blob. Fixed cases: `readDocument` stored the document in `content` and again in `state` as both markdown and LiteXML, tens of KB per call (lobehub#23860); the local shell stored `output = stdout + stderr` next to `stdout` and `stderr`, and Codex `command_execution` stored `output` next to an identical `stdout` (lobehub#23860); and a large share of the per-step agent state blob was copies of tool manifests and expertise that already lived under their own keys (lobehub#23170).

Report each of these, anchored on the line of the duplicated property inside the returned or persisted object literal:
1. A tool executor or adapter returns, in one result, `content` and a `state` / `pluginState` that both carry the same large free text: a file or document body, command output, page content, retrieved chunks (properties such as `content`, `fileContent`, `filesContent`, `markdown`, `text`, `stdout`, `chunks[].text`, or a `document` object that includes its body). Report it unless the file shows the UI reads that text from state.
2. Two properties of one object that is written into the returned `state` or a persisted row, derived from the same large value: `output: stdout + stderr` beside `stdout` and `stderr`, a document body beside its `xml`/`html`/`markdown` rendering, `raw` beside `parsed`, a `full` copy beside a `truncated` one when both are kept.
3. Code that writes a value stored under its own key or table (tool manifests, skill lists, agent-document index, expertise, the initial payload) into a persisted agent state, step record or operation row on every save.

The message names the duplicated value and where its other copy lives; the suggestion is to keep the canonical copy and store only small identifying fields, with reader fallbacks for older rows.

Do not report:
- The `content` string itself: the model needs it.
- Small metadata (ids, titles, paths, exit codes, sizes, booleans, short previews of at most a few hundred characters).
- A legacy field still written behind a migration flag or for older readers, when the file says so and readers already prefer the canonical field.
- Structured data a renderer or selector reads from state (todos, devices, canvases, runners, task results) when `content` is only a text rendering of that small data, and exact list duplicates of at most a few dozen small entries or of a paged, limited list.
- `state: { document }` or `{ plan }` on create or update tools whose `content` is only a status message.
- A `state` the file comments as the canonical copy readers use, or one the file already strips of the derived duplicate before persisting.
- `@deprecated` mirror fields in type declarations, unless this file writes both on every save.
- In-memory objects that are never persisted (render props, transient UI state, service results such as a `normalizeResult` mapping that are not written into the returned `state`).
- Copies that genuinely differ: a truncated `content` for the model with the full text in state for the UI, a redacted copy, a different format the reader cannot derive.

If an exclusion applies, return no finding. If uncertain, use low confidence rather than forcing a finding.
"""
