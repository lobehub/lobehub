      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  service:
                    type: string
                  status:
                    const: ok
                    type: string
                  timestamp:
                    format: date-time
                    type: string
                required:
                  - service
                  - status
                  - timestamp
                type: object
          description: Successful response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Insufficient permission
        "404":
          content:
