<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon-32x32.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--SEO_META-->
    <style>
      html body {
        background: #f8f8f8;
      }
      html[data-theme='dark'] body {
        background-color: #000;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: inherit;
        gap: 12px;
      }
      #loading-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #1f1f1f;
      }
      #chinnahub-loader-text {
        font: 700 38px/1 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: -0.05em;
        background: linear-gradient(
          90deg,
          #5a5a6e 0%,
          #a0a0c0 15%,
          #d4d4f0 28%,
          #ffffff 40%,
          #c8c8e8 52%,
          #7c3aed 64%,
          #06b6d4 78%,
          #e0e0ff 88%,
          #7c7ca0 100%
        );
        background-size: 250% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: liquid-metal 2.8s ease-in-out infinite alternate;
      }
      @keyframes liquid-metal {
        0%   { background-position: 0% center; }
        100% { background-position: 250% center; }
      }
      html[data-theme='dark'] #loading-brand {
        color: #f0f0f0;
      }

      #chinnahub-loader-dots {
        display: flex;
        gap: 7px;
        align-items: center;
        margin-top: 4px;
      }
      #chinnahub-loader-dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c3aed, #06b6d4);
        animation: ch-dot 1.5s ease-in-out infinite;
      }
      #chinnahub-loader-dots span:nth-child(1) { animation-delay: 0s; }
      #chinnahub-loader-dots span:nth-child(2) { animation-delay: 0.22s; }
      #chinnahub-loader-dots span:nth-child(3) { animation-delay: 0.44s; }
      @keyframes ch-dot {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.65); }
        40%            { opacity: 1;   transform: scale(1); }
      }
      #chinnahub-loader-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 220px;
        height: 48px;
        transform: translate(-50%, -70%);
        background: linear-gradient(90deg, rgba(124,58,237,0.2), rgba(6,182,212,0.2));
        border-radius: 50%;
        filter: blur(28px);
        pointer-events: none;
        animation: ch-glow 2.8s ease-in-out infinite alternate;
      }
      @keyframes ch-glow {
        0%   { opacity: 0.4; transform: translate(-50%, -70%) scaleX(0.85); }
        100% { opacity: 0.9; transform: translate(-50%, -70%) scaleX(1.15); }
      }
      #loading-brand {
        position: relative;
        flex-direction: column;
        gap: 18px;
        animation: ch-fadein 0.45s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      @keyframes ch-fadein {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
    <script>
      (function () {
        function supportsImportMaps() {
          return (
            typeof HTMLScriptElement !== 'undefined' &&
            typeof HTMLScriptElement.supports === 'function' &&
            HTMLScriptElement.supports('importmap')
          );
        }

        function supportsCascadeLayers() {
          var el = document.createElement('div');
          el.className = '__layer_test__';
          el.style.position = 'absolute';
          el.style.left = '-99999px';
          el.style.top = '-99999px';

          var style = document.createElement('style');
          style.textContent =
            '@layer a, b;' +
            '@layer a { .__layer_test__ { color: rgb(1, 2, 3); } }' +
            '@layer b { .__layer_test__ { color: rgb(4, 5, 6); } }';

          document.documentElement.append(style);
          document.documentElement.append(el);

          var color = getComputedStyle(el).color;

          el.remove();
          style.remove();

          return color === 'rgb(4, 5, 6)';
        }

        if (!(supportsImportMaps() && supportsCascadeLayers())) {
          window.location.href = '/not-compatible.html';
          return;
        }

        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var resolvedTheme = theme === 'system' ? systemTheme : theme;
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        }

        var hl = new URLSearchParams(location.search).get('hl');
        var m = document.cookie.match(/(?:^|;\s*)LOBE_LOCALE=([^;]*)/);
        var cookie = m ? decodeURIComponent(m[1]) : '';
        var locale = hl || cookie || navigator.language || 'en-US';
        if (locale === 'auto') locale = navigator.language || 'en-US';
        if (hl && !cookie) {
          document.cookie =
            'LOBE_LOCALE=' + encodeURIComponent(hl) + ';path=/;max-age=7776000;SameSite=Lax';
        }
        document.documentElement.lang = locale;
        var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
        document.documentElement.dir =
          rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';
      })();
    </script>
    <script>
      window.__SERVER_CONFIG__ = undefined; /* SERVER_CONFIG */
    </script>
  </head>

  <body>
    <div id="loading-screen">
      <div id="loading-brand" aria-label="Loading ChinnaHub" role="status">
        <div id="chinnahub-loader-glow"></div>
        <div id="chinnahub-loader-text">ChinnaHub</div>
        <div id="chinnahub-loader-dots"><span></span><span></span><span></span></div>
      </div>
      </div>
    </div>
    <div id="root" style="height: 100%"></div>

    <!--ANALYTICS_SCRIPTS-->
    <script type="module" src="/src/spa/entry.web.tsx"></script>
  </body>
</html>
