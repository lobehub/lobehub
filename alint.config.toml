# alint: model-backed rules that eslint cannot express.
# Repo-wide rules live in packages/alint/rules (fixtures in packages/alint/fixtures).
# Package-level rules live next to their package, in packages/<pkg>/alint/rules
# (fixtures in packages/<pkg>/alint/fixtures), registered under their own plugin
# prefix and scoped only to that package. Set up a provider with `bun run alint:setup`, then
# `bun run check --alint` or `bun run alint --dirty`. See packages/alint/README.md.
#
# Scope rules with group `files`; never with `includeFiles` inside a rule
# (it only filters reports, doubles the jobs, and disables the cache).
#
# Severity: `error` is reserved for rules measured at zero false positives on
# real PRs; an error turns the ALint check red. Everything else stays `warn`.
# Fixture groups stay `warn` so a rule PR does not fail on its own bad fixtures.

[[config.group]]
ignores = [
  "**/node_modules/**",
  "**/dist/**",
  "**/.next/**",
  "**/*.d.ts",
  "packages/sdk/src/generated/**",
  "packages/heterogeneous-agents/src/codex/protocol/generated.ts",
]

[config.group.ignore]
gitignore = true

# Backend business logic.
[[config.group]]
files = [ "apps/server/src/**/*.ts", "packages/database/src/**/*.ts" ]
ignores = [ "**/*.test.ts", "**/__tests__/**", "**/migrations/**" ]

[config.group.plugins]
lobehub = "./packages/alint/rules"

[config.group.rules]
"lobehub/pmap-over-promise-all" = "error"
"lobehub/no-dynamic-import-in-server" = "warn"

# Database models layer: cross-table write transactions belong in repositories.
[[config.group]]
files = [ "packages/database/src/models/**/*.ts" ]
ignores = [ "**/*.test.ts", "**/__tests__/**" ]

[config.group.plugins]
lobehub = "./packages/alint/rules"

[config.group.rules]
"lobehub/no-transactions-in-models" = "error"

# Web client components.
[[config.group]]
files = [ "src/**/*.tsx" ]
ignores = [ "**/*.test.tsx" ]

[config.group.plugins]
lobehub = "./packages/alint/rules"

[config.group.rules]
"lobehub/no-effect-fetching" = "error"
"lobehub/no-mode-flags" = "warn"


# Browser code, everywhere: nothing Node-only may be imported where the SPA
# (or the Electron renderer) runs it. Global rule, in packages/alint/rules.
# `src/app` and `src/libs` are left out on purpose: they mix Next.js shells and
# server helpers (instrumentation, OIDC, MCP) with web code.
[[config.group]]
files = [
  "src/business/**/*.ts",
  "src/business/**/*.tsx",
  "src/components/**/*.ts",
  "src/components/**/*.tsx",
  "src/features/**/*.ts",
  "src/features/**/*.tsx",
  "src/helpers/**/*.ts",
  "src/helpers/**/*.tsx",
  "src/hooks/**/*.ts",
  "src/hooks/**/*.tsx",
  "src/layout/**/*.ts",
  "src/layout/**/*.tsx",
  "src/routes/**/*.ts",
  "src/routes/**/*.tsx",
  "src/services/**/*.ts",
  "src/services/**/*.tsx",
  "src/spa/**/*.ts",
  "src/spa/**/*.tsx",
  "src/store/**/*.ts",
  "src/store/**/*.tsx",
  "src/utils/**/*.ts",
  "src/utils/**/*.tsx",
  "packages/*/src/**/*.tsx",
]
ignores = [ "**/*.test.ts", "**/*.test.tsx", "**/__tests__/**", "**/*.server.ts" ]

[config.group.plugins]
lobehub = "./packages/alint/rules"

[config.group.rules]
"lobehub/no-node-in-browser" = "error"

# Heterogeneous agents: the browser-reachable layer (root, adapters, …) stays
# pure and I/O lives behind Node-only subpaths. A package-level rule, kept
# next to the code it describes in packages/heterogeneous-agents/alint/rules.
# Scoped to the browser-reachable layer plus the spawn pipeline: Node-only
# files are free to use Node, and sending them only buys "no violation" noise.
# The import graph itself is guarded deterministically by browserSafeRoot.test.ts.
[[config.group]]
files = [
  "packages/heterogeneous-agents/src/*.ts",
  "packages/heterogeneous-agents/src/adapters/**/*.ts",
  "packages/heterogeneous-agents/src/client/**/*.ts",
  "packages/heterogeneous-agents/src/client/**/*.tsx",
  "packages/heterogeneous-agents/src/errors/**/*.ts",
  "packages/heterogeneous-agents/src/quota/**/*.ts",
  "packages/heterogeneous-agents/src/utils/**/*.ts",
  "packages/heterogeneous-agents/src/mainAgentCoordinator/**/*.ts",
  "packages/heterogeneous-agents/src/subagentCoordinator/**/*.ts",
  "packages/heterogeneous-agents/src/providerBinding/**/*.ts",
  "packages/heterogeneous-agents/src/codex/protocol/**/*.ts",
  "packages/heterogeneous-agents/src/kimiCode/usage.ts",
  "packages/heterogeneous-agents/src/spawn/agentStreamPipeline.ts",
  "packages/heterogeneous-agents/src/spawn/spawnAgent.ts",
]
ignores = [ "**/*.test.ts", "**/__tests__/**", "**/generated.ts" ]

[config.group.plugins]
hetero = "./packages/heterogeneous-agents/alint/rules"

[config.group.rules]
"hetero/agent-layering" = "error"

# Calibration fixtures: one group per rule so a fixture only meets its own rule.
[[config.group]]
files = [ "packages/alint/fixtures/pmap-over-promise-all/**" ]
[config.group.plugins]
lobehub = "./packages/alint/rules"
[config.group.rules]
"lobehub/pmap-over-promise-all" = "warn"

[[config.group]]
files = [ "packages/alint/fixtures/no-dynamic-import-in-server/**" ]
[config.group.plugins]
lobehub = "./packages/alint/rules"
[config.group.rules]
"lobehub/no-dynamic-import-in-server" = "warn"

[[config.group]]
files = [ "packages/alint/fixtures/no-effect-fetching/**" ]
[config.group.plugins]
lobehub = "./packages/alint/rules"
[config.group.rules]
"lobehub/no-effect-fetching" = "warn"

[[config.group]]
files = [ "packages/alint/fixtures/no-mode-flags/**" ]
[config.group.plugins]
lobehub = "./packages/alint/rules"
[config.group.rules]
"lobehub/no-mode-flags" = "warn"

[[config.group]]
files = [ "packages/alint/fixtures/no-transactions-in-models/**" ]
[config.group.plugins]
lobehub = "./packages/alint/rules"
[config.group.rules]
"lobehub/no-transactions-in-models" = "warn"

[[config.group]]
files = [ "packages/alint/fixtures/no-node-in-browser/**" ]
[config.group.plugins]
lobehub = "./packages/alint/rules"
[config.group.rules]
"lobehub/no-node-in-browser" = "warn"

[[config.group]]
files = [ "packages/heterogeneous-agents/alint/fixtures/agent-layering/**" ]
[config.group.plugins]
hetero = "./packages/heterogeneous-agents/alint/rules"
[config.group.rules]
"hetero/agent-layering" = "warn"
