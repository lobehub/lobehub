<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChinnaHub</title>
    <style>
      .drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        -webkit-app-region: drag;
      }

            body {
        margin: 0;
        padding: 48px 0 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      .container {
        text-align: center;
      }

      .ch-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: ch-fadein 0.4s ease both;
      }

      @keyframes ch-fadein {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .ch-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 220px;
        height: 48px;
        transform: translate(-50%, -55%);
        background: linear-gradient(90deg, rgba(124,58,237,0.25), rgba(6,182,212,0.25));
        border-radius: 50%;
        filter: blur(28px);
        pointer-events: none;
        animation: ch-glow 2.8s ease-in-out infinite alternate;
      }

      @keyframes ch-glow {
        0%   { opacity: 0.4; transform: translate(-50%, -55%) scaleX(0.85); }
        100% { opacity: 0.9; transform: translate(-50%, -55%) scaleX(1.15); }
      }

      .ch-text {
        position: relative;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
        user-select: none;
        background: linear-gradient(
          90deg,
          #5a5a6e 0%, #a0a0c0 15%, #d4d4f0 28%,
          #ffffff 40%, #c8c8e8 52%, #7c3aed 64%,
          #06b6d4 78%, #e0e0ff 88%, #7c7ca0 100%
        );
        background-size: 250% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: ch-liquid 2.8s ease-in-out infinite alternate;
      }

      @keyframes ch-liquid {
        0%   { background-position: 0% center; }
        100% { background-position: 250% center; }
      }

      .ch-dots {
        display: flex;
        gap: 7px;
        align-items: center;
      }

      .ch-dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c3aed, #06b6d4);
        animation: ch-dot 1.5s ease-in-out infinite;
      }

      .ch-dots span:nth-child(1) { animation-delay: 0s; }
      .ch-dots span:nth-child(2) { animation-delay: 0.22s; }
      .ch-dots span:nth-child(3) { animation-delay: 0.44s; }

      @keyframes ch-dot {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.65); }
        40%            { opacity: 1;   transform: scale(1); }
      }

      @keyframes draw {
        0% {
          stroke-dashoffset: 1000;
        }

        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes fill {
        30% {
          fill-opacity: 5%;
        }

        100% {
          fill-opacity: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="drag-bar"></div>
    <div class="container">
      <div class="ch-wrapper" role="status" aria-label="Loading ChinnaHub">
        <div class="ch-glow"></div>
        <div class="ch-text">ChinnaHub</div>
        <div class="ch-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </body>
</html>
