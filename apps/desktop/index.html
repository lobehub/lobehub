<!doctype html>
<html class="desktop">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
            #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: inherit;
        gap: 12px;
      }
      #loading-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #loading-brand img {
        width: 40px;
        height: 40px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body style="height: 100%">
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var resolvedTheme = theme === 'system' ? systemTheme : theme;
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        }
        // The main process resolves `lng` from the stored setting, or from the OS
        // language when that setting is `auto`, so it always wins. The i18next
        // cache is only a fallback for renderer-side reloads (Cmd+R) that landed
        // on a client-routed URL without the query param. `navigator.language`
        // is last — packaging prunes the app's locales, which makes it report
        // English on a non-English system.
        var urlParams = new URLSearchParams(window.location.search);
        var locale = urlParams.get('lng');
        if (!locale) {
          try {
            locale = localStorage.getItem('i18nextLng');
          } catch (_) {}
        }
        if (!locale) locale = navigator.language || 'en-US';
        document.documentElement.lang = locale;
        var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
        document.documentElement.dir =
          rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';
      })();
    </script>
    <div id="loading-screen">
      <div id="loading-brand" aria-label="Loading" role="status">
        <img alt="Aico" height="40" src="/icons/icon-192x192.png" width="40" />
      </div>
        <div id="root" style="height: 100%"></div>
    <script>
      window.__SERVER_CONFIG__ = undefined;
    </script>
    <script type="module" src="../../src/spa/entry.desktop.tsx"></script>
  </body>
</html>
