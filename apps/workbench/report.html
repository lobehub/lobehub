<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The report runs from disk; only adjacent evidence and embedded assets may load. -->
    <!-- Bundled code may compile JS/Wasm (Zod/diagrams), but cannot load script URLs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file: data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!--ACCEPTANCE_LOCAL_TITLE-->
    <style>
      html body {
        background: #f8f8f8;
      }
      html[data-theme='dark'] body {
        background-color: #000;
      }
    </style>
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var resolvedTheme = theme === 'system' ? systemTheme : theme;
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        }
        var hl = new URLSearchParams(location.search).get('hl');
        document.documentElement.lang = hl || navigator.language || 'en-US';
      })();
    </script>
  </head>

  <body>
    <div id="root" style="height: 100%"></div>
    <!--ACCEPTANCE_LOCAL_DATA-->
    <script type="module" src="/src/localReport/entry.tsx"></script>
  </body>
</html>
