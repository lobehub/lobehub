# Slack App Manifest for the LobeHub Messenger.
#
# Source of truth for Slack-side configuration. Import this in the Slack App
# console (https://api.slack.com/apps → "Create from manifest") to bring up
# a new App, or use `apps.manifest.update` to roll out config changes.
#
# Dev / Prod separation: maintain two separate App IDs (e.g. "LobeHub Dev"
# and "LobeHub") and import this manifest into each. The fields you must
# override per environment are the four `request_url` / `redirect_urls`
# entries below — replace `app.lobehub.com` with your domain.
#
# Self-hosters: copy this file, swap the URLs to your own domain, and
# create your own Slack App. The four LOBE_SLACK_* env vars in `.env.example`
# come from your App's "Basic Information" page.
#
# See `slack-app-setup.md` (sibling file) for the full setup walkthrough.

display_information:
  name: LobeHub
  description: Your AI agent in Slack — chat, run tasks, get answers
  background_color: '#000000'
  long_description: |
    LobeHub brings your AI agents into Slack DMs. Link your LobeHub account
    once, then chat with your active agent directly in Slack — switch agents
    on the fly, kick off long-running tasks, get inline answers from your
    LobeHub knowledge base, and more.

features:
  bot_user:
    display_name: LobeHub
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # Mirrors the Telegram bot's commands one-for-one. `/help` is intentionally
  # omitted — Slack reserves it for the workspace's built-in help, so apps
  # can't register it; users discover the rest via Slack's autocomplete.
  slash_commands:
    - command: /start
      url: https://app.lobehub.com/api/agent/messenger/webhooks/slack
      description: Bind your LobeHub account
      should_escape: false
    - command: /agents
      url: https://app.lobehub.com/api/agent/messenger/webhooks/slack
      description: List agents and switch the active one
      usage_hint: '[number]'
      should_escape: false
    - command: /new
      url: https://app.lobehub.com/api/agent/messenger/webhooks/slack
      description: Start a new conversation
      should_escape: false
    - command: /stop
      url: https://app.lobehub.com/api/agent/messenger/webhooks/slack
      description: Stop the current execution
      should_escape: false

oauth_config:
  redirect_urls:
    - https://app.lobehub.com/api/agent/messenger/slack/oauth/callback
  scopes:
    bot:
      # DM with the bot
      - chat:write
      - im:history
      - im:read
      - im:write
      # Inline feedback emoji (👀 → ✅) on the user's message
      - reactions:write
      # Resolve user → email for account linking on first DM
      - users:read
      - users:read.email
      # PR3 will add: app_mentions:read, channels:history, commands, reactions:read

settings:
  event_subscriptions:
    request_url: https://app.lobehub.com/api/agent/messenger/webhooks/slack
    bot_events:
      - message.im
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://app.lobehub.com/api/agent/messenger/webhooks/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
