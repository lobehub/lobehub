<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goal · 流程管控原型（时序回放）</title>
    <style>body{margin:0} #boot{font:13px/1.6 ui-monospace,monospace;color:#888;padding:24px}</style>
    <script src="./lobe-prototype-runtime.js"></script>
    <script src="./babel.min.js"></script>
  </head>
  <body>
    <div id="boot">booting prototype runtime…</div>
    <div id="root"></div>
    <!--
      Built by build.py from src/**/*.tsx — edit the sources, not this file.
      Runtime: bash .claude/skills/design-prototype/scripts/build-runtime.sh <this dir>
      (lobe-prototype-runtime.js + babel.min.js are generated and must not be committed.)
      Each module below is compiled with Babel (typescript + react + commonjs) on load, so the
      sources are real TSX that can move into src/features/AgentGoals/ProcessControl/ with only
      the import paths and createStyles → createStaticStyles changed.
    -->
<script type="text/plain" data-module="src/App.tsx">
import {
  ActionIcon,
  Block,
  Button,
  Flexbox,
  Icon,
  Skeleton,
  Text,
  ThemeProvider,
  Tooltip,
} from '@lobehub/ui';
import { createStyles } from 'antd-style';
import { AlertTriangle, MoreHorizontal, PanelLeft, PanelRight } from 'lucide-react';
import { memo, useEffect, useState } from 'react';

import { GoalDetailPage } from './GoalDetailPage';
import { useSharedStyles } from './components/shared';
import { STEPS, at } from './data/steps';
import { hhmm } from './model/format';

// Prototype harness: a step bar (timeline replay) + the app's NavHeader chrome around GoalDetailPage.
// Only GoalDetailPage and its components are meant to move into the product.

const useStyles = createStyles(({ css, token }) => ({
  page: css`
    overflow: hidden;
    display: flex;
    flex-direction: column;

    height: 100dvh;

    background: ${token.colorBgLayout};
  `,
  stepBar: css`
    display: flex;
    flex: none;
    gap: 16px;
    align-items: center;

    padding-block: 8px;
    padding-inline: 16px;
    border-block-end: 1px solid ${token.colorBorderSecondary};

    background: ${token.colorBgContainer};
  `,
  dots: css`
    display: flex;
    flex-shrink: 0;
    gap: 4px;
  `,
  dot: css`
    cursor: pointer;

    width: 10px;
    height: 10px;
    border-radius: 3px;

    background: ${token.colorFillSecondary};

    &:hover {
      background: ${token.colorFill};
    }
  `,
  dotDone: css`
    background: ${token.colorTextQuaternary};
  `,
  dotActive: css`
    background: ${token.colorPrimary};
  `,
  main: css`
    display: flex;
    flex: 1;
    flex-direction: column;

    min-height: 0;

    background: ${token.colorBgContainer};
  `,
  navHeader: css`
    display: flex;
    flex: none;
    gap: 4px;
    align-items: center;

    height: 44px;
    padding: 8px;
    border-block-end: 1px solid ${token.colorBorderSecondary};
  `,
  scroll: css`
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  `,
  column: css`
    width: min(960px, 100%);
    margin-block: 0;
    margin-inline: auto;
    padding-block: 24px;
    padding-inline: 16px;
  `,
}));

const LoadingState = () => {
  const { styles } = useStyles();
  return (
    <div className={styles.column}>
      <Flexbox gap={20}>
        <Skeleton.Button active style={{ width: 360, height: 28 }} />
        <Skeleton active title={false} paragraph={{ rows: 2 }} />
        <Skeleton.Button active block style={{ height: 200 }} />
        <Skeleton.Button active block style={{ height: 420 }} />
      </Flexbox>
    </div>
  );
};

const ErrorState = ({ onRetry }: { onRetry: () => void }) => {
  const { styles } = useStyles();
  return (
    <div className={styles.column}>
      <Block variant="outlined" padding={32} align="center" gap={8}>
        <Icon icon={AlertTriangle} size={24} />
        <Text weight={600}>这个目标暂时加载不出来</Text>
        <Text type="secondary" fontSize={13}>
          网络或服务出了点问题，目标本身没有受影响。
        </Text>
        <Button size="small" onClick={onRetry}>
          重新加载
        </Button>
      </Block>
    </div>
  );
};

export const App = memo(() => {
  const { styles, cx } = useStyles();
  const { styles: shared } = useSharedStyles();
  const [step, setStep] = useState(0);
  const [mode, setMode] = useState<'timeline' | 'loading' | 'error'>('timeline');
  const cur = STEPS[step];
  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      if (e.key === 'ArrowRight') setStep((i) => Math.min(STEPS.length - 1, i + 1));
      if (e.key === 'ArrowLeft') setStep((i) => Math.max(0, i - 1));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <ThemeProvider themeMode="auto">
      <div className={styles.page}>
        <div className={styles.stepBar}>
          <Flexbox horizontal gap={8} align="center" style={{ flexShrink: 0 }}>
            <Button
              size="small"
              disabled={step === 0}
              onClick={() => {
                setMode('timeline');
                setStep(step - 1);
              }}
            >
              上一步
            </Button>
            <Button
              size="small"
              type="primary"
              disabled={step === STEPS.length - 1}
              onClick={() => {
                setMode('timeline');
                setStep(step + 1);
              }}
            >
              下一步
            </Button>
            <Text fontSize={12} className={cx(shared.muted, shared.mono)}>
              {step + 1} / {STEPS.length} · {hhmm(at(cur.t))}
            </Text>
          </Flexbox>
          <div className={styles.dots}>
            {STEPS.map((st, i) => (
              <Tooltip key={i} title={`${i + 1}. ${st.label}`}>
                <div
                  className={cx(
                    styles.dot,
                    i === step && styles.dotActive,
                    i < step && styles.dotDone,
                  )}
                  onClick={() => {
                    setMode('timeline');
                    setStep(i);
                  }}
                />
              </Tooltip>
            ))}
          </div>
          <Flexbox gap={0} style={{ minWidth: 0, flex: 1 }}>
            <Text fontSize={13} weight={600} ellipsis>
              {cur.label}
            </Text>
            <Text fontSize={12} type="secondary" ellipsis={{ rows: 2 }}>
              {cur.note}
            </Text>
          </Flexbox>
          <Flexbox horizontal gap={4} style={{ flexShrink: 0 }}>
            <Button
              size="small"
              type={mode === 'loading' ? 'default' : 'text'}
              onClick={() => setMode(mode === 'loading' ? 'timeline' : 'loading')}
            >
              加载中
            </Button>
            <Button
              size="small"
              type={mode === 'error' ? 'default' : 'text'}
              onClick={() => setMode(mode === 'error' ? 'timeline' : 'error')}
            >
              加载失败
            </Button>
          </Flexbox>
        </div>
        <div className={styles.main}>
          <div className={styles.navHeader}>
            <ActionIcon icon={PanelLeft} size="small" />
            <Flexbox horizontal gap={6} align="center" style={{ paddingLeft: 4, minWidth: 0 }}>
              <Text fontSize={13} type="secondary">
                所有目标
              </Text>
              <Text fontSize={13} type="secondary">
                ›
              </Text>
              <Text fontSize={13} type="secondary">
                Coding Agent
              </Text>
              <Text fontSize={13} type="secondary">
                ›
              </Text>
              <Text fontSize={13} className={shared.mono} type="secondary">
                GOAL-12
              </Text>
              <Text fontSize={13} weight={500} ellipsis style={{ maxWidth: 480 }}>
                复现 nanoGPT 本地训练（Shakespeare char，跑满 5000 iterations）
              </Text>
            </Flexbox>
            <Flexbox horizontal gap={2} align="center" style={{ marginLeft: 'auto' }}>
              <Tooltip title="添加任务 · 编辑目标 [NEW] · 复制 ID · 复制链接 · 结束目标 [NEW] · 删除">
                <ActionIcon icon={MoreHorizontal} size="small" />
              </Tooltip>
              <Tooltip title="打开右侧 Agent 面板（与 Task 页相同的 AgentTaskManager）">
                <ActionIcon icon={PanelRight} size="small" />
              </Tooltip>
            </Flexbox>
          </div>
          <div className={styles.scroll}>
            {mode === 'loading' ? (
              <LoadingState />
            ) : mode === 'error' ? (
              <ErrorState onRetry={() => setMode('timeline')} />
            ) : (
              <GoalDetailPage key={step} step={step} />
            )}
          </div>
        </div>
      </div>
    </ThemeProvider>
  );
});

</script>
<script type="text/plain" data-module="src/GoalDetailPage.tsx">
import { Drawer, Flexbox, Icon, Text } from '@lobehub/ui';
import { createStyles } from 'antd-style';
import { Lightbulb } from 'lucide-react';
import { memo, useMemo, useState } from 'react';

import { Activity } from './components/Activity';
import { Contract } from './components/Contract';
import { Findings } from './components/Findings';
import { FrontierList } from './components/Frontier/FrontierList';
import { GoalHeader } from './components/GoalHeader';
import { Graph, type GraphView } from './components/Graph/Graph';
import { NodeDetail, NodeDetailTitle } from './components/Graph/NodeDetail';
import { SectionHeader } from './components/SectionHeader';
import { useSharedStyles } from './components/shared';
import { STEPS, buildStep } from './data/steps';
import { clock, usd } from './model/format';
import { computeFrontier, isStale } from './model/frontier';
import type { GoalState } from './types';

// The page body, in TaskDetailPage order: header → 当前任务 → 探索图 → 结论 → 目标与验收标准 → 活动.
// Node detail / edit opens in a right-side Drawer. State here is the replayed step plus local
// optimistic mutations from the actions; production reads the goal graph snapshot and calls
// goal.* / acceptance.* procedures.

const useStyles = createStyles(({ css }) => ({
  column: css`
    width: min(960px, 100%);
    margin-block: 0;
    margin-inline: auto;
    padding-block: 24px 120px;
    padding-inline: 16px;
  `,
}));

export const GoalDetailPage = memo<{ step: number }>(({ step }) => {
  const { styles } = useStyles();
  const [state, setState] = useState<GoalState>(() => buildStep(step));
  const [hotId, setHotId] = useState<string | null>(null);
  const [selected, setSelected] = useState<{ id: string; edit?: boolean } | null>(null);
  const [graphView, setGraphView] = useState<GraphView>('stage');
  const [fullscreen, setFullscreen] = useState(false);
  const [findingsOpen, setFindingsOpen] = useState(true);
  const frontier = useMemo(() => computeFrontier(state), [state]);
  const freshIds = useMemo(() => new Set(STEPS[step].fresh), [step]);
  const now = clock.now;
  const select = (id: string, edit?: boolean) => setSelected({ id, edit });
  const push = (e: GoalState['log'][number]) => setState((s) => ({ ...s, log: [...s.log, e] }));
  const patch = (id: string, p: Partial<GoalState['nodes'][number]>) =>
    setState((s) => ({ ...s, nodes: s.nodes.map((n) => (n.id === id ? { ...n, ...p } : n)) }));
  const touch = (
    n: GoalState['nodes'][number],
    kind: NonNullable<GoalState['nodes'][number]['humanTouches']>[number]['kind'],
    text: string,
  ) => ({ ...n, humanTouches: [...(n.humanTouches ?? []), { t: now, kind, text }] });

  const actions = {
    start: () => {
      setState((s) => ({
        ...s,
        goal: { ...s.goal, status: 'running', startedAt: now, lastActivity: now },
        nodes: s.nodes.map((n) =>
          n.id === 'W1'
            ? {
                ...n,
                status: 'active',
                lastActivity: now,
                task: { id: 'T-90', agent: 'Kimi Code' },
                startedAt: now,
                lastLine: '正在准备工作目录…',
              }
            : n,
        ),
      }));
      push({ t: now, kind: 'resume', who: '你', text: '开始执行' });
    },
    pause: () => {
      setState((s) => ({ ...s, goal: { ...s.goal, status: 'paused', pauseCause: 'user' } }));
      push({ t: now, kind: 'pause', who: '你', text: '暂停：不再开始新的尝试' });
    },
    resume: () => {
      setState((s) => ({
        ...s,
        goal: {
          ...s.goal,
          status: s.decision ? 'review' : 'running',
          pauseCause: undefined,
          lastActivity: now,
        },
      }));
      push({ t: now, kind: 'resume', who: '你', text: '继续' });
    },
    setBudget: ({
      rounds,
      cost,
      perWork,
    }: {
      rounds: number | null;
      cost: number | null;
      perWork: number;
    }) => {
      setState((s) => ({
        ...s,
        goal: { ...s.goal, maxRounds: rounds, maxTotalCost: cost, maxAttemptsPerWork: perWork },
      }));
      push({
        t: now,
        kind: 'budget',
        who: '你',
        text: `更新预算：费用 ${cost != null ? usd(cost) : '不限'} · 尝试 ${rounds ?? '不限'} · 单项 ${perWork}`,
      });
    },
    decide: (optionId: string, reason?: string) => {
      const d = state.decision;
      if (!d) return;
      setState((s) => ({
        ...s,
        goal: { ...s.goal, status: 'running', lastActivity: now },
        decision: null,
        nodes: s.nodes.map((n) => {
          if (n.id === d.nodeId)
            return {
              ...n,
              status: 'resolved',
              title: optionId === 'retry' ? '训练两次未通过 → 再试一次' : '训练两次未通过 → 放弃',
              body: reason ? `你的说明：${reason}` : undefined,
              at: now,
            };
          if (n.id === d.workId)
            return optionId === 'retry'
              ? touch(
                  { ...n, status: 'active', startedAt: now, lastActivity: now, lastLine: '正在启动下一次尝试…' },
                  'retry',
                  `决策门：再试一次${reason ? ` — ${reason}` : ''}`,
                )
              : touch({ ...n, status: 'retired' }, 'retire', '决策门：放弃这项任务');
          return n;
        }),
      }));
      push({
        t: now,
        kind: 'decision',
        who: '你',
        text: optionId === 'retry' ? '决定：再试一次' : '决定：放弃这项任务',
        nodeId: d.nodeId,
      });
    },
    accept: () => {
      const target = state.nodes.find((n) => n.delivered);
      setState((s) => ({
        ...s,
        goal: { ...s.goal, status: 'achieved', completedAt: now },
        nodes: s.nodes.map((n) =>
          n.delivered
            ? touch({ ...n, delivered: false, status: 'resolved' }, 'accept', '确认验收：目标达成')
            : n,
        ),
      }));
      push({ t: now, kind: 'achieved', who: '你', text: '确认完成：目标达成', nodeId: target?.id });
    },
    reject: (comment: string) => {
      const target = state.nodes.find((n) => n.delivered);
      setState((s) => ({
        ...s,
        goal: { ...s.goal, status: 'running', lastActivity: now },
        nodes: s.nodes.map((n) =>
          n.delivered
            ? touch(
                {
                  ...n,
                  delivered: false,
                  status: 'active',
                  lastActivity: now,
                  lastLine: `按你的反馈重新验收：${comment}`,
                },
                'reject',
                `还不够，再来一轮：${comment}`,
              )
            : n,
        ),
      }));
      push({
        t: now,
        kind: 'decision',
        who: '你',
        text: `退回并带反馈再来一轮：${comment}`,
        nodeId: target?.id,
      });
    },
    addBudget: (cap: number) => {
      const target = state.nodes.find((n) => n.kind === 'work' && n.status === 'active');
      setState((s) => ({
        ...s,
        goal: {
          ...s.goal,
          status: 'running',
          pauseCause: undefined,
          maxTotalCost: cap,
          lastActivity: now,
        },
        nodes: s.nodes.map((n) =>
          n.id === target?.id ? touch(n, 'budget', `预算 → ${usd(cap)}，继续`) : n,
        ),
      }));
      push({
        t: now,
        kind: 'budget',
        who: '你',
        text: `费用上限调整为 ${usd(cap)}，继续`,
        nodeId: target?.id,
      });
    },
    reclaim: () => {
      setState((s) => ({
        ...s,
        goal: { ...s.goal, lastActivity: now },
        nodes: s.nodes.map((n) =>
          isStale(s.goal, n)
            ? {
                ...n,
                attempts: [
                  ...(n.attempts ?? []),
                  {
                    n: (n.attempts?.length ?? 0) + 1,
                    started: (n.lastActivity ?? now) - 20 * 60_000,
                    ended: now,
                    outcome: 'abandoned' as const,
                    cost: 0.3,
                    reason: '执行 Agent 失联，由系统回收；不计入失败次数',
                    taskId: n.task?.id,
                  },
                ],
                lastActivity: now,
                lastLine: '正在重新启动这次尝试…',
              }
            : n,
        ),
      }));
      push({ t: now, kind: 'abandon', who: '系统', text: '回收失联的尝试并重开', nodeId: 'W2' });
    },
    startNode: (id: string) => {
      patch(id, {
        status: 'active',
        startedAt: now,
        lastActivity: now,
        task: { id: 'T-97', agent: 'Kimi Code' },
        lastLine: '正在启动第 1 次尝试…',
      });
      push({ t: now, kind: 'start', who: '你', text: '现在开始（与当前尝试并行）', nodeId: id });
      setSelected(null);
    },
    comment: (text: string) => push({ t: now, kind: 'comment', who: '你', text }),
  };

  const findingsCount = state.nodes.filter((n) => n.kind === 'finding').length;

  return (
    <div className={styles.column}>
      <Flexbox gap={28}>
        <GoalHeader
          state={state}
          frontier={frontier}
          onStart={actions.start}
          onPause={actions.pause}
          onResume={actions.resume}
          onSetBudget={actions.setBudget}
        />
        <FrontierList
          state={state}
          frontier={frontier}
          hotId={hotId}
          onHover={setHotId}
          onSelect={select}
          actions={actions}
        />
        <Graph
          state={state}
          frontier={frontier}
          hotId={hotId}
          selectedId={selected?.id ?? null}
          freshIds={freshIds}
          onHover={setHotId}
          onSelect={(id) => select(id)}
          view={graphView}
          onViewChange={setGraphView}
          fullscreen={fullscreen}
          onFullscreen={setFullscreen}
        />
        <Flexbox gap={8}>
          <SectionHeader
            icon={Lightbulb}
            title="结论"
            count={findingsCount}
            isOpen={findingsOpen}
            onToggle={() => setFindingsOpen(!findingsOpen)}
          />
          {findingsOpen && (
            <Flexbox paddingInline={12}>
              <Findings
                state={state}
                hotId={hotId}
                onHover={setHotId}
                onSelect={(id) => select(id)}
              />
            </Flexbox>
          )}
        </Flexbox>
        <Contract goal={state.goal} />
        <Activity
          state={state}
          onHover={setHotId}
          onSelect={(id) => select(id)}
          onComment={actions.comment}
        />
      </Flexbox>
      <Drawer
        open={!!selected}
        onClose={() => setSelected(null)}
        placement="right"
        width={480}
        mask={false}
        title={
          selected ? <NodeDetailTitle state={state} frontier={frontier} id={selected.id} /> : null
        }
      >
        {selected && (
          <NodeDetail
            key={selected.id}
            state={state}
            frontier={frontier}
            id={selected.id}
            editing={selected.edit}
            onSelect={(id) => setSelected({ id })}
            onStart={actions.startNode}
          />
        )}
      </Drawer>
    </div>
  );
});

</script>
<script type="text/plain" data-module="src/components/Activity.tsx">
import { Button, Empty, Flexbox, Icon, Tag, Text, TextArea } from '@lobehub/ui';
import { createStyles } from 'antd-style';
import { BotMessageSquare, ChevronRight, ExternalLink } from 'lucide-react';
import { memo, useMemo, useState } from 'react';

import { GOAL_EVENT_META, type GoalEventKind, buildRecords } from '../model/activity';
import { ago, clock, elapsed, hhmm, min, usd } from '../model/format';
import type { ActivityEvent, GoalState } from '../types';
import { SectionHeader } from './SectionHeader';
import { ActorAvatar, KindDot, StatusGlyph, useSharedStyles } from './shared';

// 活动 — one row per node (what that task did, by whom, how it ended), newest first, with the
// per-attempt detail folded underneath. Verifier verdicts, evidence submission and lease recovery
// happen inside a task, so they live in that task's fold, not as separate rows. Goal-level events
// (created / paused / budget / comment / achieved) keep their own rows.
// Row shape follows TaskActivities' inline ActivityRow.

const useStyles = createStyles(({ css, token }) => ({
  row: css`
    cursor: pointer;
    padding-block: 6px;
    padding-inline: 9px;
    border-radius: ${token.borderRadiusSM}px;
    &:hover {
      background: ${token.colorFillQuaternary};
    }
  `,
  plainRow: css`
    padding-block: 6px;
    padding-inline: 9px;
  `,
  avatar: css`
    display: flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    color: ${token.colorTextQuaternary};
    background: ${token.colorFillTertiary};
  `,
  arrow: css`
    flex: none;
    color: ${token.colorTextQuaternary};
    transition: transform 0.2s;
  `,
  arrowOpen: css`
    transform: rotate(90deg);
  `,
  body: css`
    padding-block: 0 10px;
    padding-inline: 42px 9px;
  `,
  attempt: css`
    padding-block: 6px;
    border-block-start: 1px dashed ${token.colorBorderSecondary};
    &:first-of-type {
      border-block-start: none;
    }
  `,
  inputCard: css`
    display: flex;
    gap: 6px;
    align-items: flex-start;
    padding: 8px;
    border: 1px solid transparent;
    border-radius: ${token.borderRadiusLG}px;
    background: ${token.colorFillTertiary};
    &:focus-within {
      border-color: ${token.colorBorder};
    }
  `,
  time: css`
    flex: none;
    margin-inline-start: auto;
    color: ${token.colorTextQuaternary};
  `,
}));

interface ActivityProps {
  state: GoalState;
  onHover: (id: string | null) => void;
  onSelect: (id: string) => void;
  onComment: (text: string) => void;
}

const GOAL_KINDS = new Set<GoalEventKind>(['create', 'pause', 'resume', 'budget', 'comment', 'achieved']);

export const Activity = memo<ActivityProps>(({ state, onHover, onSelect, onComment }) => {
  const { styles, cx } = useStyles();
  const { styles: shared } = useSharedStyles();
  const [open, setOpen] = useState(true);
  const [openIds, setOpenIds] = useState<Set<string>>(new Set());
  const [comment, setComment] = useState('');

  const records = useMemo(() => buildRecords(state), [state]);
  const goalEvents = useMemo(
    () => state.log.filter((e): e is ActivityEvent & { kind: GoalEventKind } => GOAL_KINDS.has(e.kind as GoalEventKind)),
    [state.log],
  );
  const rows = useMemo(
    () => [...records.map((r) => ({ t: r.t, record: r }) as const), ...goalEvents.map((e) => ({ t: e.t, event: e }) as const)].sort((a, b) => b.t - a.t),
    [records, goalEvents],
  );
  const toggle = (id: string) =>
    setOpenIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });

  return (
    <Flexbox gap={8}>
      <SectionHeader icon={BotMessageSquare} title="活动" count={rows.length} isOpen={open} onToggle={() => setOpen(!open)} />
      {open && (
        <Flexbox gap={8} paddingBlock={12} paddingInline={12}>
          <div className={styles.inputCard}>
            <ActorAvatar name="你" size={24} />
            <TextArea value={comment} onChange={(e) => setComment(e.target.value)} placeholder="留下反馈来引导 Agent —— 你的说明会影响下一次尝试…" autoSize={{ minRows: 1, maxRows: 4 }} variant="borderless" style={{ flex: 1, background: 'transparent' }} />
            <Button size="small" shape="round" type="text" disabled={!comment.trim()} onClick={() => { onComment(comment); setComment(''); }}>
              发送
            </Button>
          </div>

          {rows.length === 0 && <Empty description="暂无活动" icon={BotMessageSquare} style={{ marginTop: 8 }} />}

          {rows.map((row, i) => {
            if ('event' in row) {
              const meta = GOAL_EVENT_META[row.event.kind];
              return (
                <Flexbox key={`e${i}`} horizontal align="center" gap={8} className={styles.plainRow}>
                  {row.event.who === '你' ? (
                    <ActorAvatar name="你" size={24} />
                  ) : (
                    <div className={styles.avatar}>
                      <Icon icon={meta.icon} size={12} />
                    </div>
                  )}
                  <Text fontSize={14} weight={500} style={{ flexShrink: 0 }}>
                    {row.event.who}
                  </Text>
                  <Text fontSize={14} type="secondary" ellipsis style={{ minWidth: 0 }}>
                    {row.event.text}
                  </Text>
                  <Text fontSize={12} className={cx(styles.time, shared.mono)} title={hhmm(row.event.t)}>
                    {ago(clock.now - row.event.t)}
                  </Text>
                </Flexbox>
              );
            }

            const { node, actor, summary, findings } = row.record;
            const isOpen = openIds.has(node.id);
            const attempts = node.attempts ?? [];
            const hasDetail = attempts.length > 0 || findings.length > 0 || !!node.humanTouches?.length;
            const running = node.kind === 'work' && node.status === 'active' && !node.delivered;
            return (
              <Flexbox key={node.id} gap={0}>
                <Flexbox horizontal align="center" gap={8} className={styles.row} onClick={() => (hasDetail ? toggle(node.id) : onSelect(node.id))} onMouseEnter={() => onHover(node.id)} onMouseLeave={() => onHover(null)}>
                  <Icon icon={ChevronRight} size={14} className={cx(styles.arrow, isOpen && styles.arrowOpen)} style={{ opacity: hasDetail ? 1 : 0 }} />
                  {actor ? <ActorAvatar name={actor} size={24} /> : <KindDot kind={node.kind} />}
                  <Text fontSize={14} weight={500} ellipsis style={{ flexShrink: 1, minWidth: 0 }}>
                    {node.title}
                  </Text>
                  {actor && <Tag size="small">{actor}</Tag>}
                  <Text fontSize={14} type="secondary" ellipsis style={{ flexShrink: 1, minWidth: 0 }}>
                    {summary}
                  </Text>
                  {running && node.startedAt && (
                    <Text fontSize={12} className={cx(shared.muted, shared.mono)} style={{ flexShrink: 0 }}>
                      已运行 {elapsed(clock.now - node.startedAt)}
                    </Text>
                  )}
                  <Text fontSize={12} className={cx(styles.time, shared.mono)} title={hhmm(row.t)}>
                    {ago(clock.now - row.t)}
                  </Text>
                </Flexbox>
                {isOpen && (
                  <Flexbox className={styles.body} gap={10}>
                    {attempts.length > 0 && (
                      <Flexbox gap={0}>
                        {attempts.map((a) => (
                          <Flexbox key={a.n} gap={2} className={styles.attempt}>
                            <Flexbox horizontal gap={8} align="center">
                              <Text fontSize={12} weight={600} style={{ flexShrink: 0 }}>
                                第 {a.n} 次
                              </Text>
                              <Text fontSize={12} type={a.outcome === 'passed' ? 'success' : a.outcome === 'failed' ? 'danger' : 'secondary'} style={{ flexShrink: 0 }}>
                                {a.outcome === 'passed' ? 'verifier 通过' : a.outcome === 'failed' ? 'verifier 未通过' : '失联回收'}
                              </Text>
                              <Text fontSize={12} className={cx(shared.muted, shared.mono)} style={{ flexShrink: 0 }}>
                                {Math.round((a.ended - a.started) / min(1))} 分钟 · {usd(a.cost)}
                              </Text>
                              <Button type="text" size="small" icon={<Icon icon={ExternalLink} />} style={{ marginLeft: 'auto' }}>
                                打开运行
                              </Button>
                            </Flexbox>
                            <Text fontSize={12} type="secondary">
                              {a.reason}
                            </Text>
                          </Flexbox>
                        ))}
                      </Flexbox>
                    )}
                    {findings.map((f) => (
                      <Flexbox key={f.id} horizontal gap={6} align="center" style={{ cursor: 'pointer' }} onClick={() => onSelect(f.id)}>
                        <KindDot kind="finding" />
                        <Text fontSize={13}>沉淀结论：{f.title}</Text>
                      </Flexbox>
                    ))}
                    {node.humanTouches?.map((t, k) => (
                      <Flexbox key={k} horizontal gap={6} align="center">
                        <ActorAvatar name="你" size={16} />
                        <Text fontSize={13}>{t.text}</Text>
                        <Text fontSize={12} className={cx(shared.muted, shared.mono)}>
                          {ago(clock.now - t.t)}
                        </Text>
                      </Flexbox>
                    ))}
                  </Flexbox>
                )}
              </Flexbox>
            );
          })}
        </Flexbox>
      )}
    </Flexbox>
  );
});

</script>
<script type="text/plain" data-module="src/components/Contract.tsx">
import { Block, Button, Flexbox, Icon, Tag, Text } from '@lobehub/ui';
import { createStyles } from 'antd-style';
import {
  Check,
  ChevronRight,
  CircleDashed,
  ExternalLink,
  HelpCircle,
  ShieldCheck,
  XCircle,
} from 'lucide-react';
import { memo, useState } from 'react';

import { usd } from '../model/format';
import type { GoalCheck, GoalInfo } from '../types';
import { SectionHeader } from './SectionHeader';
import { useSharedStyles } from './shared';

// Mirrors TaskAcceptance: section header → body (padding-inline 12, gap 14) → 验收目标 text →
// checklist as CriterionList (Block variant="outlined", rows separated by adjacency, leading status
// icon + C{seq} + title + Required chip). Verdict is a colored icon, never a Tag.
// (src/features/AgentTasks/AgentTaskDetail/TaskAcceptance.tsx + src/features/Verify/CriterionList)

const useStyles = createStyles(({ css, token }) => ({
  body: css`
    padding-inline: 12px;
  `,
  list: css`
    overflow: hidden;
    width: 100%;
    padding: 0;
  `,
  row: css`
    padding-block: 10px;
    padding-inline: 12px;

    & + & {
      border-block-start: 1px solid ${token.colorBorderSecondary};
    }
  `,
  seq: css`
    flex: none;
    font-size: 12px;
    color: ${token.colorTextTertiary};
  `,
  label: css`
    font-size: 12px;
    color: ${token.colorTextSecondary};
  `,
  budget: css`
    padding-block: 10px;
    padding-inline: 12px;
    border-block-start: 1px solid ${token.colorBorderSecondary};
  `,
}));

/** checkHeadMeta — the same state → icon/color table the acceptance checklist uses. */
const checkHeadMeta = (state: GoalCheck['state']) => {
  switch (state) {
    case 'passed':
      return { icon: Check, color: 'var(--ant-color-success)' };
    case 'failed':
      return { icon: XCircle, color: 'var(--ant-color-error)' };
    case 'uncertain':
      return { icon: HelpCircle, color: 'var(--ant-color-warning)' };
    default:
      return { icon: CircleDashed, color: 'var(--ant-color-text-quaternary)' };
  }
};

export const Contract = memo<{ goal: GoalInfo }>(({ goal }) => {
  const { styles, cx } = useStyles();
  const { styles: shared } = useSharedStyles();
  const [open, setOpen] = useState(false);
  const passed = goal.checks.filter((c) => c.state === 'passed').length;

  return (
    <Flexbox gap={8}>
      <SectionHeader
        icon={ShieldCheck}
        title="目标验收"
        count={goal.checks.length}
        isOpen={open}
        onToggle={() => setOpen(!open)}
        extra={
          <Button icon={<Icon icon={ExternalLink} />} size="small" type="text">
            验收报告
          </Button>
        }
      />
      {open && (
        <Flexbox className={styles.body} gap={14}>
          <Flexbox gap={6}>
            <span className={styles.label}>验收目标</span>
            <Text fontSize={13}>{goal.requirement}</Text>
          </Flexbox>
          <Flexbox gap={7}>
            <Flexbox horizontal align="center" gap={8}>
              <span className={styles.label}>验收清单</span>
              <Text fontSize={11} type="secondary">
                {passed} / {goal.checks.length} 通过
              </Text>
            </Flexbox>
            <Block variant="outlined" className={styles.list}>
              {goal.checks.map((c, i) => {
                const meta = checkHeadMeta(c.state);
                return (
                  <Flexbox key={c.label} horizontal align="center" gap={10} className={styles.row}>
                    <Icon color={meta.color} icon={meta.icon} size={16} style={{ flex: 'none' }} />
                    <span className={styles.seq}>C{i + 1}</span>
                    <Text ellipsis style={{ flex: 1, minWidth: 0 }}>
                      {c.label}
                    </Text>
                    <Tag color="info" size="small" variant="filled">
                      必需
                    </Tag>
                  </Flexbox>
                );
              })}
              <Flexbox horizontal gap={16} wrap="wrap" className={cx(styles.budget, shared.mono)}>
                <Text fontSize={12} type="secondary">
                  费用上限 {goal.maxTotalCost == null ? '不限' : usd(goal.maxTotalCost)}
                </Text>
                <Text fontSize={12} type="secondary">
                  总尝试 {goal.maxRounds ?? '不限'}
                </Text>
                <Text fontSize={12} type="secondary">
                  单项最多 {goal.maxAttemptsPerWork} 次
                </Text>
                <Text fontSize={12} type="secondary">
                  失联判定 {goal.leaseTimeoutMin} 分钟
                </Text>
              </Flexbox>
            </Block>
          </Flexbox>
        </Flexbox>
      )}
    </Flexbox>
  );
});

</script>
<script type="text/plain" data-module="src/components/Findings.tsx">
import { Button, Flexbox, Icon, Tag, Text } from '@lobehub/ui';
import { createStyles } from 'antd-style';
import { ChevronRight, ExternalLink, Lightbulb } from 'lucide-react';
import { memo, useState } from 'react';

import { ago, clock, short } from '../model/format';
import type { GoalState } from '../types';
import { KindDot, useSharedStyles } from './shared';

// What the system currently believes. Borderless rows; clicking one expands its evidence in place
// (source task · attempt · open run), instead of opening the side panel.

const useStyles = createStyles(({ css, token }) => ({
  row: css`
    cursor: pointer;
    padding-block: 8px;
    padding-inline: 8px;
    border-radius: ${token.borderRadiusSM}px;
    &:hover {
      background: ${token.colorFillQuaternary};
    }
  `,
  arrow: css`
    flex: none;
    color: ${token.colorTextQuaternary};
    transition: transform 0.2s;
  `,
  arrowOpen: css`
    transform: rotate(90deg);
  `,
  body: css`
    padding-block: 0 10px;
    padding-inline: 30px 8px;
  `,
}));

export const Findings = memo<{
  state: GoalState;
  hotId: string | null;
  onHover: (id: string | null) => void;
  onSelect: (id: string) => void;
}>(({ state, hotId, onHover, onSelect }) => {
  const { styles, cx } = useStyles();
  const { styles: shared } = useSharedStyles();
  const [openIds, setOpenIds] = useState<Set<string>>(new Set());
  const findings = state.nodes.filter((n) => n.kind === 'finding').sort((a, b) => (b.at ?? 0) - (a.at ?? 0));

  if (findings.length === 0)
    return (
      <Text fontSize={13} className={shared.muted}>
        还没有任何结论。
      </Text>
    );

  return (
    <Flexbox gap={0}>
      {findings.map((f) => {
        const open = openIds.has(f.id);
        const producer = state.nodes.find((n) => n.id === f.from);
        const attempt = producer?.attempts?.find((a) => a.outcome === 'passed');
        // A finding may answer a Problem (supports edge) — show that question, it's the reason it exists.
        const answers = state.edges
          .filter(([a, , kind]) => a === f.id && kind === 'supports')
          .map(([, b]) => state.nodes.find((n) => n.id === b))
          .filter(Boolean);
        return (
          <Flexbox key={f.id} gap={0}>
            <Flexbox horizontal gap={8} align="center" className={styles.row} onClick={() => setOpenIds((prev) => { const next = new Set(prev); if (next.has(f.id)) next.delete(f.id); else next.add(f.id); return next; })} onMouseEnter={() => onHover(f.id)} onMouseLeave={() => onHover(null)}>
              <Icon icon={ChevronRight} size={14} className={cx(styles.arrow, open && styles.arrowOpen)} />
              <KindDot kind="finding" />
              <Text weight={500} ellipsis style={{ flexShrink: 1, minWidth: 0 }}>
                {f.title}
              </Text>
              <Text fontSize={12} className={shared.muted} ellipsis style={{ flexShrink: 1, minWidth: 0 }}>
                {answers.length > 0 ? `回答「${answers[0]!.title}」` : `来自「${producer?.title}」`}
              </Text>
              <Text fontSize={12} className={cx(shared.muted, shared.mono)} style={{ marginLeft: 'auto', flexShrink: 0 }}>
                {short(clock.now - (f.at ?? clock.now))}
              </Text>
            </Flexbox>
            {open && (
              <Flexbox className={styles.body} gap={8}>
                {answers.map((q) => (
                  <Flexbox key={q!.id} horizontal gap={6} align="center" style={{ cursor: 'pointer' }} onClick={() => onSelect(q!.id)}>
                    <KindDot kind="problem" />
                    <Text fontSize={12} type="secondary">
                      回答了：{q!.title}
                    </Text>
                  </Flexbox>
                ))}
                {f.body && <Text fontSize={13}>{f.body}</Text>}
                <Flexbox horizontal gap={8} align="center" wrap="wrap">
                  {attempt && (
                    <>
                      <Text fontSize={12} type="secondary">
                        第 {attempt.n} 次尝试 · {attempt.taskId} · {ago(clock.now - attempt.ended)}
                      </Text>
                      <Button type="text" size="small" icon={<Icon icon={ExternalLink} />}>
                        打开这次运行
                      </Button>
                      <Tag size="small">证据版本 #1</Tag>
                    </>
                  )}
                  <Button size="small" type="text" icon={<Icon icon={Lightbulb} />} onClick={() => onSelect(f.id)}>
                    基于这个结论开一条任务
                  </Button>
                </Flexbox>
              </Flexbox>
            )}
          </Flexbox>
        );
      })}
    </Flexbox>
  );
});

</script>
<script type="text/plain" data-module="src/components/Frontier/FrontierList.tsx">
import { ActionIcon, Block, Button, Flexbox, Icon, InputNumber, Tag, Text, TextArea, Tooltip } from '@lobehub/ui';
import { Divider } from 'antd';
import { createStyles } from 'antd-style';
import { ChevronDown, ChevronRight, Pencil, Plus, RotateCcw } from 'lucide-react';
import { Fragment, memo, useState } from 'react';

import { clock, elapsed, short, usd } from '../../model/format';
import { type Frontier, type FrontierItem, nodeNumbers } from '../../model/frontier';
import type { GoalState } from '../../types';
import { ActorAvatar, type ExecStatus, StatusGlyph, useSharedStyles } from '../shared';

// 当前任务 — one row per thing that can move now, in the AgentTaskItem shape:
// [#n] [status glyph] title [state Tag] … [avatar] [elapsed | actions]. Just-finished tasks stay at
// the top (dimmed) so the list fades instead of items vanishing; blocked ones fold at the bottom and
// reference their blockers by number (#1 #2), the same numbers the rows carry.

const useStyles = createStyles(({ css, token }) => ({
  row: css`
    &:hover .row-actions {
      opacity: 1;
    }
  `,
  hoverActions: css`
    opacity: 0;
    transition: opacity 0.15s;
  `,
  num: css`
    flex: none;
    min-width: 22px;
    font-family: ${token.fontFamilyCode};
    font-size: 12px;
    color: ${token.colorTextQuaternary};
  `,
  spacer: css`
    flex: 1;
    min-width: 0;
  `,
  blockedHead: css`
    cursor: pointer;
    display: flex;
    gap: 6px;
    align-items: center;
    padding-block: 8px;
    padding-inline: 12px;
    font-size: 12px;
    color: ${token.colorTextTertiary};
    user-select: none;
    &:hover {
      color: ${token.colorTextSecondary};
    }
  `,
  dim: css`
    opacity: 0.55;
    transition: opacity 0.15s;
    &:hover {
      opacity: 1;
    }
  `,
  deps: css`
    font-family: ${token.fontFamilyCode};
    font-size: 12px;
    color: ${token.colorTextQuaternary};
  `,
  needsBody: css`
    padding-block: 2px 14px;
    padding-inline: 46px 12px;
  `,
  label: css`
    font-size: 12px;
    font-weight: 600;
    color: ${token.colorTextSecondary};
  `,
  option: css`
    display: grid;
    grid-template-columns: 104px 1fr;
    gap: 8px;
    align-items: baseline;
  `,
  attempt: css`
    padding-block: 6px;
    border-block-start: 1px dashed ${token.colorBorderSecondary};
    &:first-of-type {
      border-block-start: none;
    }
  `,
}));

export interface FrontierActions {
  decide: (optionId: string, reason?: string) => void;
  accept: () => void;
  reject: (comment: string) => void;
  addBudget: (cap: number) => void;
  reclaim: () => void;
  startNode: (id: string) => void;
}

interface FrontierListProps {
  state: GoalState;
  frontier: Frontier;
  hotId: string | null;
  onHover: (id: string | null) => void;
  onSelect: (id: string, edit?: boolean) => void;
  actions: FrontierActions;
}

const glyphOf = (item: FrontierItem, node: GoalState['nodes'][number]): { status: ExecStatus; live?: boolean } => {
  switch (item.kind) {
    case 'gate':
    case 'acceptance':
    case 'budget':
      return { status: 'waitingForHuman' };
    case 'stale':
      return { status: 'failed' };
    case 'running':
      return { status: 'running', live: true };
    case 'done':
      return { status: node.status === 'retired' ? 'canceled' : 'completed' };
    default:
      return { status: 'backlog' };
  }
};

const tagOf = (state: GoalState, item: FrontierItem): { text: string; color?: string } | null => {
  switch (item.kind) {
    case 'gate':
      return { text: '等你决定', color: 'warning' };
    case 'acceptance':
      return { text: '等你确认', color: 'warning' };
    case 'budget':
      return { text: '需要你接手', color: 'warning' };
    case 'stale':
      return { text: '失联', color: 'error' };
    case 'running':
      return null;
    case 'done':
      return { text: item.node.status === 'retired' ? '已放弃' : '完成' };
    default:
      // Not started and unblocked. The coordinator dispatches one node per tick, so promising
      // "可以开始" would be a promise the runtime can't keep — the row stays quiet.
      return null;
  }
};

const titleOf = (state: GoalState, item: FrontierItem) => {
  const { goal } = state;
  if (item.kind === 'budget') return item.node.title;
  if (item.kind === 'acceptance') {
    const passed = goal.checks.filter((c) => c.state === 'passed').length;
    return `验收通过 ${passed}/${goal.checks.length}，这个目标算完成了吗？`;
  }
  return item.node.title;
};

/** Inline note after the title — only where it says something the tag can't. */
const noteOf = (state: GoalState, item: FrontierItem) => {
  const n = item.node;
  switch (item.kind) {
    case 'stale':
    case 'gate':
    case 'acceptance':
    case 'budget':
      // Needs-you rows open a block below; nothing is squeezed onto the title line.
      return '';
    case 'done':
      return n.attempts?.length ? `${n.attempts.length} 次尝试 · ${usd(n.cost ?? 0)}` : '';
    default:
      return '';
  }
};

export const FrontierList = memo<FrontierListProps>(({ state, frontier, hotId, onHover, onSelect, actions }) => {
  const { styles, cx } = useStyles();
  const { styles: shared } = useSharedStyles();
  const { goal } = state;
  const [rejectOpen, setRejectOpen] = useState(false);
  const [comment, setComment] = useState('');
  const [reason, setReason] = useState('');
  const [budget, setBudget] = useState<number>((goal.maxTotalCost ?? 0) + 5);
  const [showBlocked, setShowBlocked] = useState(false);

  // Numbers come from the graph (creation order), not the list position — a task keeps its number
  // when others finish above it, so 依赖 #2 always points at the same node.
  const numberOf = nodeNumbers(state);

  const stop = (e: React.MouseEvent) => e.stopPropagation();

  const rightCluster = (item: FrontierItem) => {
    const n = item.node;
    switch (item.kind) {
      case 'gate': {
        const d = state.decision!;
        const rec = d.options.find((o) => o.id === d.recommended)!;
        return (
          <>
            {d.options
              .filter((o) => o.id !== rec.id)
              .map((o) => (
                <Tooltip key={o.id} title={o.consequence}>
                  <Button size="small" onClick={(e) => { stop(e); actions.decide(o.id, reason); }}>
                    {o.label}
                  </Button>
                </Tooltip>
              ))}
            <Tooltip title={`推荐 · ${rec.consequence}`}>
              <Button type="primary" size="small" onClick={(e) => { stop(e); actions.decide(rec.id, reason); }}>
                {rec.label}
              </Button>
            </Tooltip>
          </>
        );
      }
      case 'acceptance':
        return (
          <>
            <Button size="small" onClick={(e) => { stop(e); setRejectOpen(true); }}>
              还不够
            </Button>
            <Button type="primary" size="small" onClick={(e) => { stop(e); actions.accept(); }}>
              确认完成
            </Button>
          </>
        );
      case 'budget':
        return null;
      case 'stale':
        return (
          <Button type="primary" size="small" icon={<Icon icon={RotateCcw} />} onClick={(e) => { stop(e); actions.reclaim(); }}>
            立即重开
          </Button>
        );
      case 'running':
        return (
          <>
            <ActorAvatar name={n.task?.agent ?? ''} />
            <Text fontSize={12} className={cx(shared.muted, shared.mono)} title="已运行">
              {elapsed(clock.now - (n.startedAt ?? n.lastActivity ?? clock.now))}
            </Text>
          </>
        );
      case 'done':
        return (
          <Text fontSize={12} className={cx(shared.muted, shared.mono)}>
            {short(clock.now - (n.at ?? clock.now))}
          </Text>
        );
      default:
        return <ActionIcon icon={Pencil} size="small" title="编辑这项任务" className={cx('row-actions', styles.hoverActions)} onClick={(e) => { stop(e); onSelect(n.id, true); }} />;
    }
  };

  /** Everything a human decision needs, opened in place: why, options with consequences, history. */
  const NeedsYouBody = ({ item }: { item: FrontierItem }) => {
    const n = item.node;
    const attempts = n.attempts ?? [];
    const Ledger = () =>
      attempts.length === 0 ? null : (
        <Flexbox gap={0}>
          <span className={styles.label}>之前的尝试</span>
          {attempts.map((a) => (
            <Flexbox key={a.n} horizontal gap={10} align="baseline" className={styles.attempt}>
              <Text fontSize={12} className={cx(shared.muted, shared.mono)} style={{ flexShrink: 0, width: 52 }}>
                第 {a.n} 次
              </Text>
              <Text fontSize={12} type={a.outcome === 'passed' ? 'success' : a.outcome === 'failed' ? 'danger' : 'secondary'} style={{ flexShrink: 0 }}>
                {a.outcome === 'passed' ? '通过' : a.outcome === 'failed' ? '未通过' : '失联'}
              </Text>
              <Text fontSize={12} type="secondary" style={{ flex: 1, minWidth: 0 }}>
                {a.reason}
              </Text>
              <Text fontSize={12} className={cx(shared.muted, shared.mono)} style={{ flexShrink: 0 }}>
                {usd(a.cost)}
              </Text>
            </Flexbox>
          ))}
        </Flexbox>
      );

    switch (item.kind) {
      case 'gate': {
        const d = state.decision!;
        return (
          <Flexbox className={styles.needsBody} gap={12} onClick={stop}>
            <Flexbox gap={4}>
              <span className={styles.label}>为什么停下来</span>
              <Text fontSize={13}>{d.why}</Text>
            </Flexbox>
            <Flexbox gap={6}>
              <span className={styles.label}>每个选择意味着什么</span>
              {d.options.map((o) => (
                <div key={o.id} className={styles.option}>
                  <Text fontSize={13} weight={500}>
                    {o.label}
                    {o.id === d.recommended ? '（推荐）' : ''}
                  </Text>
                  <Text fontSize={13} type="secondary">
                    {o.consequence}
                  </Text>
                </div>
              ))}
            </Flexbox>
            <Ledger />
            <Flexbox gap={4}>
              <span className={styles.label}>补充说明（可选，会写进下一次尝试的指令）</span>
              <TextArea value={reason} onChange={(e) => setReason(e.target.value)} placeholder="例如：不要重训，基于静止 checkpoint 补齐 train.log 缺口" autoSize={{ minRows: 1, maxRows: 3 }} />
            </Flexbox>
          </Flexbox>
        );
      }
      case 'acceptance':
        return (
          <Flexbox className={styles.needsBody} gap={12} onClick={stop}>
            <Flexbox gap={4}>
              <span className={styles.label}>独立 verifier 的判定</span>
              {goal.checks.map((c) => (
                <Flexbox key={c.label} horizontal gap={8} align="center">
                  <StatusGlyph status={c.state === 'passed' ? 'completed' : 'backlog'} size={14} />
                  <Text fontSize={13}>{c.label}</Text>
                </Flexbox>
              ))}
              <Text fontSize={12} type="secondary">
                verifier 在同一目录重新加载了 checkpoint、核对 loss 和采样长度。确认后目标记为已达成。
              </Text>
            </Flexbox>
            {rejectOpen && (
              <Flexbox gap={8}>
                <TextArea autoFocus placeholder="哪里不够？会作为下一轮的输入" value={comment} onChange={(e) => setComment(e.target.value)} autoSize={{ minRows: 2, maxRows: 4 }} />
                <Flexbox horizontal gap={8} justify="flex-end">
                  <Button size="small" onClick={() => setRejectOpen(false)}>
                    取消
                  </Button>
                  <Button size="small" type="primary" disabled={!comment.trim()} onClick={() => { actions.reject(comment); setRejectOpen(false); }}>
                    带反馈再来一轮
                  </Button>
                </Flexbox>
              </Flexbox>
            )}
          </Flexbox>
        );
      case 'budget':
        return (
          <Flexbox className={styles.needsBody} gap={12} onClick={stop}>
            <Text fontSize={13} type="secondary">
              这项任务把总费用推到了 {usd(goal.spent)}，超过上限 {usd(goal.maxTotalCost ?? 0)}；已停下，不会再开始新的尝试。追加预算后它会接着跑。
            </Text>
            <Ledger />
            <Flexbox horizontal gap={8} align="center" wrap="wrap">
              <InputNumber size="small" value={budget} min={goal.spent} step={1} prefix="$" onChange={(v) => setBudget(Number(v ?? 0))} style={{ width: 110 }} />
              <Button type="primary" size="small" onClick={() => actions.addBudget(budget)}>
                追加预算并继续
              </Button>
              <Button size="small" danger>
                就此结束
              </Button>
            </Flexbox>
          </Flexbox>
        );
      case 'stale':
        return (
          <Flexbox className={styles.needsBody} gap={12} onClick={stop}>
            <Text fontSize={13} type="secondary">
              {n.task?.agent} 已 {short(clock.now - (n.lastActivity ?? clock.now))} 没有心跳。下一次推进会把这次尝试标为失联并自动重开（不计失败次数）；本机上由它拉起的进程不会被中断，重开的尝试会先审计已有产物。
            </Text>
            <Ledger />
          </Flexbox>
        );
      default:
        return null;
    }
  };

  const Row = ({ item }: { item: FrontierItem }) => {
    const n = item.node;
    const g = glyphOf(item, n);
    const tag = tagOf(state, item);
    const note = noteOf(state, item);
    const num = numberOf.get(n.id);
    const deps = (n.dependsOn ?? []).map((id) => numberOf.get(id)).filter(Boolean);
    return (
      <Block
        clickable
        variant="borderless"
        padding={12}
        className={cx(styles.row, item.kind === 'done' && styles.dim)}
        onClick={() => onSelect(n.id)}
        onMouseEnter={() => onHover(n.id)}
        onMouseLeave={() => onHover(null)}
      >
        <Flexbox horizontal gap={10} align="center">
          <span className={styles.num}>#{num}</span>
          <StatusGlyph status={g.status} live={g.live} />
          <Text weight={500} ellipsis style={{ flexShrink: 1, minWidth: 0, maxWidth: '55%' }}>
            {titleOf(state, item)}
          </Text>
          {tag && (
            <Tag size="small" color={tag.color as any}>
              {tag.text}
            </Tag>
          )}
          {item.kind === 'blocked' && deps.length > 0 && <span className={styles.deps}>依赖 {deps.map((d) => `#${d}`).join(' ')}</span>}
          {note && (
            <Text fontSize={12} className={shared.muted} ellipsis style={{ flexShrink: 1, minWidth: 0 }}>
              {note}
            </Text>
          )}
          <span className={styles.spacer} />
          <Flexbox horizontal gap={8} align="center" style={{ flexShrink: 0 }}>
            {rightCluster(item)}
          </Flexbox>
        </Flexbox>
        {item.rank === 0 && <NeedsYouBody item={item} />}
      </Block>
    );
  };

  const BlockedRow = ({ node }: { node: GoalState['nodes'][number] }) => {
    const deps = (node.dependsOn ?? []).map((id) => numberOf.get(id)).filter(Boolean);
    return (
      <Block clickable variant="borderless" padding={12} className={cx(styles.row, styles.dim)} onClick={() => onSelect(node.id, true)} onMouseEnter={() => onHover(node.id)} onMouseLeave={() => onHover(null)}>
        <Flexbox horizontal gap={10} align="center">
          <span className={styles.num}>#{numberOf.get(node.id)}</span>
          <StatusGlyph status="backlog" />
          <Text weight={500} ellipsis style={{ flexShrink: 1, minWidth: 0 }}>
            {node.title}
          </Text>
          {deps.length > 0 && <span className={styles.deps}>依赖 {deps.map((d) => `#${d}`).join(' ')}</span>}
          <span className={styles.spacer} />
          <ActionIcon icon={Pencil} size="small" title="编辑这项任务" className={cx('row-actions', styles.hoverActions)} onClick={(e) => { stop(e); onSelect(node.id, true); }} />
        </Flexbox>
      </Block>
    );
  };

  return (
    <Flexbox gap={8}>
      <Flexbox horizontal justify="space-between" align="baseline">
        <Flexbox horizontal gap={8} align="baseline">
          <Text fontSize={16} weight={600}>
            当前任务
          </Text>
          {goal.status !== 'planning' && (
            <Text fontSize={12} className={shared.muted}>
              {frontier.needsYou > 0 ? `${frontier.needsYou} 项需要你 · ` : ''}
              {frontier.items.filter((i) => i.kind !== 'done').length} 项能推进
            </Text>
          )}
        </Flexbox>
        <Button size="small" type="text" icon={<Icon icon={Plus} />}>
          添加任务
        </Button>
      </Flexbox>

      <div className={shared.list}>
        <Block variant="borderless" gap={0} padding={2}>
          {frontier.items.length === 0 && (
            <Flexbox padding={12} gap={2}>
              <Text weight={500}>{goal.status === 'achieved' ? '没有需要推进的了，目标已达成' : '当前没有可推进的任务'}</Text>
              <Text fontSize={12} type="secondary">
                {goal.status === 'achieved' ? '结论都在下面的图里；可以基于任何结论再开一条新任务。' : '所有任务都在等待或已终态。'}
              </Text>
            </Flexbox>
          )}
          {frontier.items.map((item, i) => (
            <Fragment key={item.key}>
              {i > 0 && <Divider dashed style={{ margin: 0 }} />}
              <Row item={item} />
            </Fragment>
          ))}
        </Block>
        {frontier.blocked.length > 0 && (
          <>
            <Divider dashed style={{ margin: 0 }} />
            <div className={styles.blockedHead} onClick={() => setShowBlocked(!showBlocked)}>
              <Icon icon={showBlocked ? ChevronDown : ChevronRight} size={12} />
              <span>还有 {frontier.blocked.length} 项在等依赖</span>
            </div>
            {showBlocked && (
              <Block variant="borderless" gap={0} padding={2}>
                {frontier.blocked.map((b, i) => (
                  <Fragment key={b.key}>
                    {i > 0 && <Divider dashed style={{ margin: 0 }} />}
                    <BlockedRow node={b.node} index={frontier.items.length + i + 1} />
                  </Fragment>
                ))}
              </Block>
            )}
          </>
        )}
      </div>
    </Flexbox>
  );
});

</script>
<script type="text/plain" data-module="src/components/GoalHeader.tsx">
import { Button, Flexbox, Icon, InputNumber, Modal, Popover, Text } from '@lobehub/ui';
import { Progress } from 'antd';
import { createStyles } from 'antd-style';
import { Pause, Play, RotateCcw } from 'lucide-react';
import { memo, useState } from 'react';

import { clock, duration, elapsed, usd } from '../model/format';
import { type Frontier, countAttempts, goalSentence } from '../model/frontier';
import type { GoalState } from '../types';
import { NewTag, useSharedStyles } from './shared';

// Mirrors the shipped Goal detail header (src/features/AgentGoals/GoalDetailPage.tsx):
// title → description → a row of metric cells (18px value / 12px label, separated by a left border)
// → the requirement block. The run/pause control sits with the metrics; budget is edited from the
// 费用 cell.

const useStyles = createStyles(({ css, token }) => ({
  header: css`
    padding-block: 8px 4px;
  `,
  title: css`
    width: 100%;
    padding: 0;
    border: none;

    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
    color: ${token.colorText};

    background: transparent;
    outline: none;
  `,
  metric: css`
    min-width: 112px;

    & + & {
      padding-inline-start: 18px;
      border-inline-start: 1px solid ${token.colorBorderSecondary};
    }
  `,
  clickable: css`
    cursor: pointer;
  `,
}));

interface GoalHeaderProps {
  state: GoalState;
  frontier: Frontier;
  onStart: () => void;
  onPause: () => void;
  onResume: () => void;
  onSetBudget: (v: { rounds: number | null; cost: number | null; perWork: number }) => void;
}

const RunPauseAction = ({ state, onStart, onPause, onResume }: Omit<GoalHeaderProps, 'frontier' | 'onSetBudget'>) => {
  const [open, setOpen] = useState(false);
  const { goal } = state;
  if (['achieved', 'failed', 'canceled'].includes(goal.status))
    return (
      <Button size="small" icon={<Icon icon={RotateCcw} />}>
        重新打开 <NewTag title="终态目标无 reopen 事件" />
      </Button>
    );
  if (goal.status === 'planning')
    return (
      <Button type="primary" size="small" icon={<Icon icon={Play} />} onClick={onStart}>
        开始执行
      </Button>
    );
  if (goal.status === 'paused')
    return (
      <Button type="primary" size="small" icon={<Icon icon={Play} />} onClick={onResume}>
        继续
      </Button>
    );
  return (
    <>
      <Button size="small" icon={<Icon icon={Pause} />} onClick={() => setOpen(true)}>
        暂停
      </Button>
      <Modal open={open} title="暂停这个目标？" okText="暂停" cancelText="取消" onCancel={() => setOpen(false)} onOk={() => { setOpen(false); onPause(); }}>
        <Flexbox gap={8}>
          <Text>暂停后不会再开始新的尝试；正在进行的尝试会跑到它自己结束为止，期间的费用仍会计入。</Text>
          <Text type="secondary" fontSize={13}>
            随时可以点「继续」恢复。立刻中断正在执行的 Agent 目前还做不到 <NewTag title="AbortSignal 未接入 runtime；红线" />。
          </Text>
        </Flexbox>
      </Modal>
    </>
  );
};

const Metric = memo<{ label: string; children: React.ReactNode; onClick?: () => void }>(({ label, children, onClick }) => {
  const { styles, cx } = useStyles();
  return (
    <Flexbox className={cx(styles.metric, onClick && styles.clickable)} gap={2} onClick={onClick}>
      {children}
      <Text fontSize={12} type="secondary">
        {label}
      </Text>
    </Flexbox>
  );
});

export const GoalHeader = memo<GoalHeaderProps>(({ state, frontier, onStart, onPause, onResume, onSetBudget }) => {
  const { styles } = useStyles();
  const { styles: shared } = useSharedStyles();
  const { goal } = state;
  const [budgetOpen, setBudgetOpen] = useState(false);
  const [rounds, setRounds] = useState<number | null>(goal.maxRounds);
  const [cost, setCost] = useState<number | null>(goal.maxTotalCost);
  const [perWork, setPerWork] = useState(goal.maxAttemptsPerWork);
  const overCost = goal.maxTotalCost != null && goal.spent >= goal.maxTotalCost;
  const passed = goal.checks.filter((c) => c.state === 'passed').length;
  const attempts = countAttempts(state);
  const progress = goal.checks.length ? Math.round((passed / goal.checks.length) * 100) : 0;
  const running = goal.nodes ? 0 : 0;

  return (
    <Flexbox className={styles.header} gap={8}>
      <Flexbox gap={5}>
        <input className={styles.title} defaultValue={goal.title} />
        <Text fontSize={15} style={{ lineHeight: 1.65 }}>
          {goal.requirement}
        </Text>
      </Flexbox>

      <Flexbox horizontal gap={18} wrap="wrap" align="center" paddingBlock={'6px 0'}>
        <Metric label="验收进度">
          <Flexbox horizontal align="center" gap={7}>
            <Progress percent={progress} showInfo={false} size={24} strokeColor="var(--ant-color-success)" type="circle" />
            <Text fontSize={18} weight={600}>
              {passed}/{goal.checks.length}
            </Text>
          </Flexbox>
        </Metric>
        <Metric label={frontier.needsYou > 0 ? '状态 · 需要你' : '状态'}>
          <Text fontSize={18} weight={600} type={frontier.needsYou ? 'warning' : goal.status === 'achieved' ? 'success' : undefined}>
            {goalSentence(goal, frontier)}
          </Text>
        </Metric>
        <Metric label="已进行">
          <Text fontSize={18} weight={600}>
            {goal.startedAt ? duration(clock.now - goal.startedAt) : '—'}
          </Text>
        </Metric>
        <Metric label={`尝试 · 单项最多 ${goal.maxAttemptsPerWork}`}>
          <Text fontSize={18} weight={600}>
            {attempts}
            <Text fontSize={13} type="secondary">
              {' '}
              / {goal.maxRounds ?? '∞'}
            </Text>
          </Text>
        </Metric>
        <Popover
          open={budgetOpen}
          onOpenChange={setBudgetOpen}
          trigger="click"
          content={
            <Flexbox gap={12} style={{ width: 260 }} padding={4}>
              <Text weight={600}>预算与保护</Text>
              <Flexbox gap={8}>
                <Flexbox horizontal justify="space-between" align="center">
                  <Text fontSize={13}>总费用上限</Text>
                  <InputNumber value={cost} min={0} step={1} prefix="$" onChange={(v) => setCost(v == null ? null : Number(v))} style={{ width: 110 }} placeholder="不限" />
                </Flexbox>
                <Flexbox horizontal justify="space-between" align="center">
                  <Text fontSize={13}>总尝试次数</Text>
                  <InputNumber value={rounds} min={1} onChange={(v) => setRounds(v == null ? null : Number(v))} style={{ width: 110 }} placeholder="不限" />
                </Flexbox>
                <Flexbox horizontal justify="space-between" align="center">
                  <Text fontSize={13}>单项任务最多尝试</Text>
                  <InputNumber value={perWork} min={1} onChange={(v) => setPerWork(Number(v ?? 1))} style={{ width: 110 }} />
                </Flexbox>
              </Flexbox>
              <Text fontSize={12} type="secondary">
                超过任一上限时目标会自动停下并来问你，不会静默继续花钱。
              </Text>
              <Flexbox horizontal justify="flex-end" gap={8}>
                <Button size="small" onClick={() => setBudgetOpen(false)}>
                  取消
                </Button>
                <Button size="small" type="primary" onClick={() => { onSetBudget({ rounds, cost, perWork }); setBudgetOpen(false); }}>
                  保存
                </Button>
              </Flexbox>
            </Flexbox>
          }
        >
          <div>
            <Metric label={`费用 · 上限 ${goal.maxTotalCost == null ? '不限' : usd(goal.maxTotalCost)}`} onClick={() => setBudgetOpen(true)}>
              <Text fontSize={18} weight={600} className={shared.mono} type={overCost ? 'warning' : undefined}>
                {usd(goal.spent)}
              </Text>
            </Metric>
          </div>
        </Popover>
        <Flexbox style={{ marginLeft: 'auto' }}>
          <RunPauseAction state={state} onStart={onStart} onPause={onPause} onResume={onResume} />
        </Flexbox>
      </Flexbox>
    </Flexbox>
  );
});

</script>
<script type="text/plain" data-module="src/components/Graph/Graph.tsx">
import { ActionIcon, Flexbox, Segmented, Text } from '@lobehub/ui';
import { createStyles } from 'antd-style';
import { Maximize2, X } from 'lucide-react';
import { memo, useMemo } from 'react';

import { clock, elapsed } from '../../model/format';
import { type Frontier, isStale } from '../../model/frontier';
import type { GoalNode, GoalState, NodeKind } from '../../types';
import { KIND_CN, KindDot, useKindColors } from '../shared';
import { POS, VIEW_W, edgePath } from './layout';

// Exploration graph. No chrome around it; two views:
//   stage — what got us here, what is moving now, and what the next advance can unlock (default)
//   all   — the whole graph
// Fullscreen is a real overlay, not a wider column. Kinds are told apart by shape + color only.

const useStyles = createStyles(({ css, token }) => ({
  head: css`
    padding-block: 4px;
  `,
  legend: css`
    font-size: 12px;
    color: ${token.colorTextTertiary};
  `,
  overlay: css`
    position: fixed;
    z-index: 1000;
    inset: 0;

    display: flex;
    flex-direction: column;

    padding-block: 12px 24px;
    padding-inline: 24px;

    background: ${token.colorBgContainer};
  `,
  overlayBody: css`
    overflow: auto;
    flex: 1;
    min-height: 0;
  `,
  svg: css`
    display: block;
    width: 100%;
    height: auto;

    .edge {
      fill: none;
      stroke: ${token.colorBorder};
      stroke-width: 1.5;
      transition:
        opacity 0.2s,
        stroke 0.2s;
    }

    .edge.dep {
      stroke-dasharray: 4 4;
    }

    .edge.dim {
      opacity: 0.3;
    }

    .edge.hot {
      opacity: 1;
      stroke: ${token.colorText};
      stroke-width: 2;
    }

    .node {
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .node .main {
      stroke-width: 1.5;
      transition:
        stroke-width 0.15s,
        filter 0.15s;
    }

    .node.dim {
      opacity: 0.45;
    }

    .node.frontier .main {
      stroke-width: 3;
    }

    .node.gate .main {
      stroke-dasharray: 6 4;
      stroke-width: 3;
    }

    .node.proposed .main {
      stroke-dasharray: 4 4;
    }

    .node.stale .main {
      stroke-dasharray: 2 4;
    }

    .node.selected .main {
      filter: drop-shadow(0 0 4px ${token.colorPrimaryBorder});
    }

    .node.hot .main {
      stroke-width: 3.5;
    }

    .node.fresh .main {
      filter: drop-shadow(0 0 6px ${token.colorPrimaryBorder});
    }

    .node text {
      pointer-events: none;
      font-size: 13px;
      fill: ${token.colorText};
    }

    .node text.task {
      font-family: ${token.fontFamilyCode};
      font-size: 11px;
      fill: ${token.colorTextSecondary};
    }

    .node text.badge {
      font-size: 9px;
      font-weight: 600;
      fill: ${token.colorBgContainer};
    }

    .node line.sep {
      stroke: ${token.colorBorderSecondary};
    }

    .pulse {
      animation: goal-pulse 1.6s ease-in-out infinite;
    }

    @keyframes goal-pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse {
        animation: none;
      }
    }
  `,
}));

export type GraphView = 'stage' | 'all';

interface GraphProps {
  state: GoalState;
  frontier: Frontier;
  hotId: string | null;
  selectedId: string | null;
  freshIds: Set<string>;
  onHover: (id: string | null) => void;
  onSelect: (id: string) => void;
  view: GraphView;
  onViewChange: (v: GraphView) => void;
  fullscreen: boolean;
  onFullscreen: (v: boolean) => void;
}

const ellipsize = (s: string, n: number) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

/**
 * Stage view: nodes that are done / moving / waiting on you, plus the nodes the next advance can
 * unlock (blocked only by things that are moving or ready). Deeper future is hidden.
 */
const stageNodes = (state: GoalState, frontier: Frontier) => {
  const active = new Set<string>();
  state.nodes.forEach((n) => {
    if (n.kind === 'goal') active.add(n.id);
    if (n.status !== 'proposed') active.add(n.id);
  });
  frontier.items.forEach((i) => active.add(i.node.id));
  const visible = new Set(active);
  frontier.blocked.forEach((b) => {
    if (b.blockers.every((x) => active.has(x.id))) visible.add(b.node.id);
  });
  return visible;
};

export const Graph = memo<GraphProps>(
  ({
    state,
    frontier,
    hotId,
    selectedId,
    freshIds,
    onHover,
    onSelect,
    view,
    onViewChange,
    fullscreen,
    onFullscreen,
  }) => {
    const { styles, cx } = useStyles();
    const colors = useKindColors();
    const { goal } = state;
    const visibleIds = useMemo(
      () => (view === 'all' ? new Set(state.nodes.map((n) => n.id)) : stageNodes(state, frontier)),
      [state, frontier, view],
    );
    const nodes = state.nodes.filter((n) => visibleIds.has(n.id));
    const frontierIds = new Set(frontier.items.map((i) => i.node.id));
    const maxY = Math.max(...nodes.map((n) => POS[n.id].y + POS[n.id].h)) + 24;
    const focus = hotId || selectedId || null;

    const head = (
      <Flexbox horizontal justify="space-between" align="center" className={styles.head}>
        <Flexbox horizontal gap={12} align="center">
          <Text fontSize={16} weight={600}>
            探索图
          </Text>
          <Segmented
            size="small"
            value={view}
            onChange={(v) => onViewChange(v as GraphView)}
            options={[
              { label: '当前阶段', value: 'stage' },
              { label: '全图', value: 'all' },
            ]}
          />
        </Flexbox>
        <Flexbox horizontal gap={12} align="center">
          <Flexbox horizontal gap={10} className={styles.legend} align="center">
            {(['problem', 'work', 'finding', 'decision'] as NodeKind[]).map((k) => (
              <Flexbox key={k} horizontal gap={4} align="center">
                <KindDot kind={k} />
                <span>{KIND_CN[k]}</span>
              </Flexbox>
            ))}
          </Flexbox>
          <ActionIcon
            icon={fullscreen ? X : Maximize2}
            size="small"
            title={fullscreen ? '退出全屏' : '全屏'}
            onClick={() => onFullscreen(!fullscreen)}
          />
        </Flexbox>
      </Flexbox>
    );

    const renderNode = (n: GoalNode) => {
      const p = POS[n.id];
      const c = colors[n.kind];
      const isFrontier = frontierIds.has(n.id);
      const isGate = n.kind === 'decision' && n.status === 'waiting';
      const stale = isStale(goal, n);
      const fresh = freshIds.has(n.id);
      const related = state.edges.some(
        ([a, b]) => (a === focus && b === n.id) || (b === focus && a === n.id),
      );
      const dim = focus
        ? !(n.id === focus || related)
        : n.status === 'resolved' && n.kind === 'work' && !isFrontier;
      const cls = cx(
        'node',
        isFrontier && !isGate && 'frontier',
        isGate && 'gate',
        n.status === 'proposed' && 'proposed',
        stale && 'stale',
        dim && !fresh && 'dim',
        selectedId === n.id && 'selected',
        (hotId === n.id || fresh) && 'hot',
        fresh && 'fresh',
      );
      const stroke = isGate
        ? 'var(--ant-color-warning)'
        : stale
          ? 'var(--ant-color-error)'
          : c.line;
      const fill = n.status === 'proposed' ? 'var(--ant-color-bg-container)' : c.soft;
      const running =
        n.kind === 'work' &&
        n.status === 'active' &&
        !n.delivered &&
        goal.status !== 'paused' &&
        !stale &&
        n.task &&
        n.lastActivity;
      const h = running ? 78 : p.h;
      const badge = n.kind === 'decision' ? (n.authority === 'agent' ? 'AI' : '你') : null;
      const touches = n.kind === 'work' ? (n.humanTouches ?? []) : [];
      return (
        <g
          key={n.id}
          className={cls}
          onMouseEnter={() => onHover(n.id)}
          onMouseLeave={() => onHover(null)}
          onClick={() => onSelect(n.id)}
        >
          {n.kind === 'decision' ? (
            <path
              className="main"
              d={`M ${p.x + 16} ${p.y} H ${p.x + p.w - 16} L ${p.x + p.w} ${p.y + p.h / 2} L ${p.x + p.w - 16} ${p.y + p.h} H ${p.x + 16} L ${p.x} ${p.y + p.h / 2} Z`}
              fill={fill}
              stroke={stroke}
            />
          ) : (
            <rect
              className="main"
              x={p.x}
              y={p.y}
              width={p.w}
              height={h}
              rx={n.kind === 'problem' ? 28 : n.kind === 'finding' ? 6 : 10}
              fill={fill}
              stroke={stroke}
            />
          )}
          <text x={p.x + p.w / 2} y={p.y + (running ? 26 : h / 2 + 5)} textAnchor="middle">
            {ellipsize(n.title, n.kind === 'decision' ? 20 : 24)}
          </text>
          {running && (
            <g>
              <line className="sep" x1={p.x + 16} y1={p.y + 42} x2={p.x + p.w - 16} y2={p.y + 42} />
              <circle
                className="pulse"
                cx={p.x + 26}
                cy={p.y + 60}
                r={3.5}
                fill="var(--ant-color-warning)"
              />
              <text className="task" x={p.x + 36} y={p.y + 64}>
                {n.task!.agent} · 已运行{' '}
                {elapsed(clock.now - (n.startedAt ?? n.lastActivity ?? clock.now))}
              </text>
            </g>
          )}
          {badge && (
            <g>
              <circle
                cx={p.x + p.w - 10}
                cy={p.y + 2}
                r={9}
                fill={
                  isGate
                    ? 'var(--ant-color-warning)'
                    : n.authority === 'agent'
                      ? c.line
                      : 'var(--ant-color-text)'
                }
              />
              <text className="badge" x={p.x + p.w - 10} y={p.y + 5.5} textAnchor="middle">
                {badge}
              </text>
            </g>
          )}
          {touches.length > 0 && (
            <g>
              <title>{touches.map((t) => t.text).join('\n')}</title>
              <circle cx={p.x + 10} cy={p.y + 2} r={9} fill="var(--ant-color-text)" />
              <text className="badge" x={p.x + 10} y={p.y + 5.5} textAnchor="middle">
                你
              </text>
            </g>
          )}
          {n.delivered && (
            <circle cx={p.x + p.w - 8} cy={p.y + 8} r={5} fill="var(--ant-color-warning)" />
          )}
        </g>
      );
    };

    const svg = (
      <svg
        className={styles.svg}
        viewBox={`0 0 ${VIEW_W} ${maxY}`}
        role="img"
        aria-label="Goal Graph"
        style={fullscreen ? { maxWidth: 1400, margin: '0 auto' } : undefined}
      >
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
            <path d="M0,0 L0,6 L7,3 z" fill="context-stroke" />
          </marker>
        </defs>
        {state.edges
          .filter(([a, b]) => visibleIds.has(a) && visibleIds.has(b))
          .map(([a, b, kind]) => {
            const hot = !!focus && (a === focus || b === focus);
            const dim = !!focus && !hot;
            return (
              <path
                key={`${a}-${b}-${kind}`}
                className={cx('edge', kind === 'depends_on' && 'dep', hot && 'hot', dim && 'dim')}
                d={edgePath(a, b, kind)}
                markerEnd={kind === 'depends_on' ? undefined : 'url(#arrow)'}
              />
            );
          })}
        {nodes.map(renderNode)}
      </svg>
    );

    if (fullscreen)
      return (
        <div className={styles.overlay}>
          {head}
          <div className={styles.overlayBody}>{svg}</div>
        </div>
      );

    return (
      <Flexbox gap={4}>
        {head}
        {svg}
      </Flexbox>
    );
  },
);

</script>
<script type="text/plain" data-module="src/components/Graph/NodeDetail.tsx">
import { Button, Flexbox, Icon, Input, InputNumber, Tag, Text, TextArea } from '@lobehub/ui';
import { Checkbox } from 'antd';
import { createStyles } from 'antd-style';
import { ArrowUp, ExternalLink, Lightbulb, Play, Trash2 } from 'lucide-react';
import { memo, useState } from 'react';

import { ago, clock, min, usd } from '../../model/format';
import { type Frontier, nodeStateText } from '../../model/frontier';
import type { EdgeKind, GoalState } from '../../types';
import { KIND_CN, KindDot, NewTag, useSharedStyles } from '../shared';

// Content of the right-side panel (Drawer): what a node is, where it came from, who touched it, and —
// for a not-yet-started task — an editor.

const useStyles = createStyles(({ css, token }) => ({
  ledgerLine: css`
    padding-block: 6px;
    border-block-start: 1px dashed ${token.colorBorderSecondary};

    &:first-of-type {
      border-block-start: none;
    }
  `,
  label: css`
    font-size: 12px;
    font-weight: 600;
    color: ${token.colorTextSecondary};
  `,
}));

const REL: Record<EdgeKind, string> = {
  decomposes: '拆出',
  depends_on: '依赖',
  investigates: '调查',
  produces: '产出',
  supports: '支持',
  contradicts: '反驳',
  leads_to: '导向',
};

interface NodeDetailProps {
  state: GoalState;
  frontier: Frontier;
  id: string;
  editing?: boolean;
  onSelect: (id: string) => void;
  onStart?: (id: string) => void;
}

export const NodeDetailTitle = memo<{ state: GoalState; frontier: Frontier; id: string }>(
  ({ state, frontier, id }) => {
    const { styles: shared } = useSharedStyles();
    const n = state.nodes.find((x) => x.id === id);
    if (!n) return null;
    return (
      <Flexbox horizontal gap={8} align="center" style={{ minWidth: 0 }}>
        <KindDot kind={n.kind} />
        <Text fontSize={12} className={shared.muted}>
          {KIND_CN[n.kind]}
        </Text>
        <Text weight={600} ellipsis style={{ minWidth: 0 }}>
          {n.title}
        </Text>
        <Text fontSize={12} type="secondary" style={{ flexShrink: 0 }}>
          {nodeStateText(state.goal, n, frontier)}
          {n.cost ? ` · ${usd(n.cost)}` : ''}
        </Text>
      </Flexbox>
    );
  },
);

export const NodeDetail = memo<NodeDetailProps>(
  ({ state, frontier, id, editing, onSelect, onStart }) => {
    const { styles, cx } = useStyles();
