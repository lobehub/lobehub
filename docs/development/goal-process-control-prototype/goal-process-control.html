    const { styles: shared } = useSharedStyles();
    const n = state.nodes.find((x) => x.id === id);
    const [title, setTitle] = useState(n?.title ?? '');
    const [desc, setDesc] = useState(n?.description ?? '');
    const [prio, setPrio] = useState(n?.priority ?? 0);
    const [deps, setDeps] = useState<string[]>(n?.dependsOn ?? []);
    if (!n) return null;
    const { goal } = state;
    const byId = (x: string) => state.nodes.find((m) => m.id === x);
    const editable = n.kind === 'work' && n.status === 'proposed';
    const producer = n.kind === 'finding' && n.from ? byId(n.from) : undefined;
    const producingAttempt = producer?.attempts?.find((a) => a.outcome === 'passed');
    const otherWorks = state.nodes.filter((w) => w.kind === 'work' && w.id !== n.id && !w.terminal);

    return (
      <Flexbox gap={16}>
        {editable && (
          <Flexbox gap={10}>
            <Flexbox gap={4}>
              <span className={styles.label}>标题</span>
              <Input value={title} onChange={(e) => setTitle(e.target.value)} />
            </Flexbox>
            <Flexbox gap={4}>
              <span className={styles.label}>要做什么 · 交付什么</span>
              <TextArea
                value={desc}
                onChange={(e) => setDesc(e.target.value)}
                autoSize={{ minRows: 3, maxRows: 8 }}
                placeholder="写清允许的产出与完成标准，会进入负责人 Task 的指令"
              />
            </Flexbox>
            <Flexbox gap={4}>
              <span className={styles.label}>优先级</span>
              <InputNumber
                value={prio}
                onChange={(v) => setPrio(Number(v ?? 0))}
                style={{ width: 120 }}
              />
            </Flexbox>
            <Flexbox gap={4}>
              <span className={styles.label}>先等这些完成（依赖）</span>
              <Flexbox gap={2}>
                {otherWorks.map((w) => (
                  <Checkbox
                    key={w.id}
                    checked={deps.includes(w.id)}
                    onChange={(e) =>
                      setDeps(e.target.checked ? [...deps, w.id] : deps.filter((d) => d !== w.id))
                    }
                  >
                    <Text fontSize={13}>{w.title}</Text>
                  </Checkbox>
                ))}
              </Flexbox>
            </Flexbox>
            <Flexbox horizontal gap={8} align="center" wrap="wrap">
              <Button type="primary" size="small">
                保存 <NewTag title="没有 goal.updateNode；今天只能 addNode / addEdge" />
              </Button>
              <Button size="small" icon={<Icon icon={ArrowUp} />}>
                先做这个 <NewTag title="调优先级 = updateNode，未建模" />
              </Button>
              {goal.status !== 'planning' && onStart && (
                <Button size="small" icon={<Icon icon={Play} />} onClick={() => onStart(n.id)}>
                  现在开始 <NewTag title="并行派发：coordinator 每次 tick 只派一个节点（串行）" />
                </Button>
              )}
              <Button size="small" danger icon={<Icon icon={Trash2} />}>
                移除 <NewTag title="retire 一个未开始的任务：未建模" />
              </Button>
            </Flexbox>
          </Flexbox>
        )}

        {!editable && n.description && <Text fontSize={13}>{n.description}</Text>}
        {n.body && <Text fontSize={13}>{n.body}</Text>}

        {n.kind === 'finding' && producer && (
          <Flexbox gap={4}>
            <span className={styles.label}>来源</span>
            <Flexbox horizontal gap={8} align="center" wrap="wrap">
              <KindDot kind={producer.kind} />
              <Text
                fontSize={13}
                style={{ cursor: 'pointer' }}
                onClick={() => onSelect(producer.id)}
              >
                {producer.title}
              </Text>
              {producingAttempt && (
                <>
                  <Text fontSize={12} type="secondary">
                    第 {producingAttempt.n} 次尝试 · {producingAttempt.taskId} ·{' '}
                    {ago(clock.now - producingAttempt.ended)}
                  </Text>
                  <Button type="text" size="small" icon={<Icon icon={ExternalLink} />}>
                    打开这次运行
                  </Button>
                  <Tag size="small">证据版本 #1</Tag>
                </>
              )}
            </Flexbox>
          </Flexbox>
        )}

        {!!n.humanTouches?.length && (
          <Flexbox gap={4}>
            <span className={styles.label}>人工参与</span>
            {n.humanTouches.map((t, i) => (
              <Flexbox key={i} horizontal gap={8} align="baseline">
                <Text
                  fontSize={12}
                  className={cx(shared.muted, shared.mono)}
                  style={{ flexShrink: 0 }}
                >
                  {ago(clock.now - t.t)}
                </Text>
                <Text fontSize={13}>{t.text}</Text>
              </Flexbox>
            ))}
          </Flexbox>
        )}

        {n.kind === 'work' && n.task && (
          <Flexbox gap={4}>
            <span className={styles.label}>负责人 Task</span>
            <Flexbox horizontal gap={8} align="center">
              <Text fontSize={13} className={shared.mono}>
                {n.task.id}
              </Text>
              <Text fontSize={13}>{n.task.agent}</Text>
              <Button type="text" size="small" icon={<Icon icon={ExternalLink} />}>
                打开会话
              </Button>
            </Flexbox>
            {n.lastLine && <div className={shared.evidence}>{n.lastLine}</div>}
          </Flexbox>
        )}

        {n.kind === 'work' && !!n.attempts?.length && (
          <Flexbox gap={2}>
            <span className={styles.label}>尝试记录</span>
            {n.attempts.map((a) => (
              <Flexbox key={a.n} gap={2} className={styles.ledgerLine}>
                <Flexbox horizontal gap={8} align="center">
                  <Text fontSize={12} weight={600} style={{ flexShrink: 0 }}>
                    第 {a.n} 次
                  </Text>
                  <Text
                    fontSize={12}
                    type={
                      a.outcome === 'passed'
                        ? 'success'
                        : a.outcome === 'failed'
                          ? 'danger'
                          : 'secondary'
                    }
                    style={{ flexShrink: 0 }}
                  >
                    {a.outcome === 'passed' ? '通过' : a.outcome === 'failed' ? '未通过' : '失联'}
                  </Text>
                  <Text
                    fontSize={12}
                    className={cx(shared.muted, shared.mono)}
                    style={{ flexShrink: 0 }}
                  >
                    {Math.round((a.ended - a.started) / min(1))} 分钟 · {usd(a.cost)}
                  </Text>
                  <Button
                    type="text"
                    size="small"
                    icon={<Icon icon={ExternalLink} />}
                    style={{ marginLeft: 'auto' }}
                  />
                </Flexbox>
                <Text fontSize={12} type="secondary">
                  {a.reason}
                </Text>
              </Flexbox>
            ))}
          </Flexbox>
        )}

        <Flexbox gap={4}>
          <span className={styles.label}>在图里的位置</span>
          {state.edges
            .filter(([a, b]) => a === id || b === id)
            .map(([a, b, kind]) => {
              const other = a === id ? b : a;
              const o = byId(other);
              if (!o) return null;
              return (
                <Flexbox
                  key={`${a}${b}${kind}`}
                  horizontal
                  gap={6}
                  align="center"
                  style={{ cursor: 'pointer' }}
                  onClick={() => onSelect(other)}
                >
                  <KindDot kind={o.kind} />
                  <Text fontSize={12} type="secondary">
                    {a === id ? `${REL[kind]} → ${o.title}` : `${o.title} → ${REL[kind]}这里`}
                  </Text>
                </Flexbox>
              );
            })}
        </Flexbox>

        {n.kind === 'finding' && (
          <Flexbox horizontal gap={8} align="center">
            <Button size="small" icon={<Icon icon={Lightbulb} />}>
              基于这个结论开一条任务
            </Button>
            <Text fontSize={12} className={shared.muted}>
              = addNode + leads_to
            </Text>
          </Flexbox>
        )}
      </Flexbox>
    );
  },
);

</script>
<script type="text/plain" data-module="src/components/Graph/layout.ts">
// Hand-placed layered layout: node positions fed to react-flow. Production computes them with a
// layered DAG layout (e.g. dagre/elk) over the goal graph snapshot.

import type { EdgeKind } from '../../types';

export interface Box {
  x: number;
  y: number;
  w: number;
  h: number;
}

// Columns: A x=40 w=220 · B x=300 w=280 · C x=620 w=300. Rows every ~104px.
export const POS: Record<string, Box> = {
  G: { x: 370, y: 24, w: 220, h: 48 },
  P1: { x: 40, y: 120, w: 220, h: 56 },
  W1: { x: 300, y: 120, w: 260, h: 56 },
  W5: { x: 620, y: 120, w: 300, h: 56 },
  F1: { x: 40, y: 220, w: 220, h: 52 },
  F2: { x: 300, y: 220, w: 200, h: 52 },
  F5: { x: 620, y: 220, w: 300, h: 52 },
  W6: { x: 40, y: 316, w: 220, h: 56 },
  W2: { x: 300, y: 316, w: 280, h: 84 },
  D0: { x: 620, y: 316, w: 300, h: 56 },
  F6: { x: 40, y: 444, w: 220, h: 52 },
  W3: { x: 620, y: 444, w: 300, h: 56 },
  D1: { x: 300, y: 444, w: 240, h: 56 },
  F4: { x: 620, y: 548, w: 240, h: 52 },
  F3: { x: 300, y: 548, w: 280, h: 52 },
  W4: { x: 620, y: 652, w: 300, h: 56 },
};

export const VIEW_W = 960;

const center = (p: Box) => ({ cx: p.x + p.w / 2, cy: p.y + p.h / 2 });

/** Curve between two boxes. `depends_on` and `produces` hug the right edge so they miss the rows between. */
export const edgePath = (a: string, b: string, kind: EdgeKind) => {
  if (kind === 'depends_on') [a, b] = [b, a];
  const from = POS[a];
  const to = POS[b];
  const fc = center(from);
  const tc = center(to);
  const hug = kind === 'depends_on' || (kind === 'produces' && to.y - (from.y + from.h) > 120);
  if (to.y >= from.y + from.h) {
    const x1 = hug ? from.x + from.w - 24 : fc.cx;
    const x2 = hug ? to.x + to.w - 24 : tc.cx;
    const y1 = from.y + from.h;
    const y2 = to.y;
    const my = (y1 + y2) / 2;
    return `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
  }
  if (from.y >= to.y + to.h) {
    // upward (e.g. finding supports problem)
    const x1 = fc.cx + 40;
    const x2 = tc.cx + 40;
    const y1 = from.y;
    const y2 = to.y + to.h;
    const my = (y1 + y2) / 2;
    return `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
  }
  const ltr = tc.cx > fc.cx;
  const x1 = ltr ? from.x + from.w : from.x;
  const x2 = ltr ? to.x : to.x + to.w;
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${fc.cy} C ${mx} ${fc.cy}, ${mx} ${tc.cy}, ${x2} ${tc.cy}`;
};

</script>
<script type="text/plain" data-module="src/components/SectionHeader.tsx">
import { Block, Flexbox, Icon, Tag, Text } from '@lobehub/ui';
import { createStyles } from 'antd-style';
import type { LucideIcon } from 'lucide-react';
import { memo } from 'react';

// The section-header contract used by TaskAcceptance / TaskActivities:
// Block clickable borderless · paddingBlock 4 / paddingInline 8 · 16px description-colored icon ·
// 13px/500 secondary text · optional count Tag · rotating chevron. `extra` sits on the far right and
// stops propagation. (src/features/AgentTasks/AgentTaskDetail/TaskAcceptanceHeader.tsx)

const useStyles = createStyles(({ css, token }) => ({
  arrow: css`
    flex: none;
    color: ${token.colorTextDescription};
    transition: transform 0.2s;
  `,
  arrowOpen: css`
    transform: rotate(90deg);
  `,
}));

/** Same 16×16 chevron the Task accordions use (shared/AccordionArrowIcon.tsx). */
const ArrowIcon = memo<{ isOpen?: boolean }>(({ isOpen }) => {
  const { styles, cx } = useStyles();
  return (
    <svg
      className={cx(styles.arrow, isOpen && styles.arrowOpen)}
      width={16}
      height={16}
      viewBox="0 0 16 16"
      fill="none"
      aria-hidden
    >
      <path
        d="M6 4l4 4-4 4"
        stroke="currentColor"
        strokeWidth={1.5}
        strokeLinecap="round"
        strokeLinejoin="round"
      />
    </svg>
  );
});

interface SectionHeaderProps {
  icon: LucideIcon;
  title: string;
  count?: number;
  isOpen?: boolean;
  extra?: React.ReactNode;
  onToggle: () => void;
}

export const SectionHeader = memo<SectionHeaderProps>(
  ({ icon, title, count, isOpen, extra, onToggle }) => {
    const toggle = (
      <Block
        clickable
        horizontal
        align="center"
        gap={8}
        paddingBlock={4}
        paddingInline={8}
        style={{ cursor: 'pointer', width: 'fit-content' }}
        variant="borderless"
        onClick={onToggle}
      >
        <Icon color="var(--ant-color-text-description)" icon={icon} size={16} />
        <Text color="var(--ant-color-text-secondary)" fontSize={13} weight={500}>
          {title}
        </Text>
        {!!count && <Tag size="small">{count}</Tag>}
        <ArrowIcon isOpen={isOpen} />
      </Block>
    );
    if (!extra) return toggle;
    return (
      <Flexbox horizontal align="center" justify="space-between">
        {toggle}
        <Flexbox horizontal gap={4} align="center" onClick={(e) => e.stopPropagation()}>
          {extra}
        </Flexbox>
      </Flexbox>
    );
  },
);

<script type="text/plain" data-module="src/components/shared.tsx">

// ── Execution status glyphs — mirrors src/components/ExecutionStatus.ts (TASK_STATUS_VISUALS).
// On move: replace with `TaskStatusIcon` / `RunningGlyph` from the app; keep the same semantics.

export type ExecStatus =
  | 'backlog'
  | 'running'
  | 'completed'
  | 'failed'
  | 'waitingForHuman'
  | 'scheduled'
  | 'paused'
  | 'canceled'
  | 'idle';

const STATUS_VISUALS: Record<ExecStatus, { color: string; icon: LucideIcon }> = {
  backlog: { color: 'var(--ant-color-text-quaternary)', icon: CircleDashed },
  canceled: { color: 'var(--ant-color-text-secondary)', icon: CircleSlash },
  completed: { color: 'var(--ant-color-success)', icon: CircleCheck },
  failed: { color: 'var(--ant-color-error)', icon: CircleX },
  idle: { color: 'var(--ant-color-text-tertiary)', icon: Circle },
  running: { color: 'var(--ant-color-warning)', icon: CircleDot },
  scheduled: { color: 'var(--ant-color-warning)', icon: Clock },
  waitingForHuman: { color: 'var(--ant-color-info)', icon: HandIcon },
  paused: { color: 'var(--ant-color-text-secondary)', icon: PauseCircle },
};

/** The app's RingLoadingIcon look: warning arc over a translucent warning track. */
const RingSpinner = memo<{ size: number }>(({ size }) => {
  const { styles } = useSharedStyles();
  const r = (size - 2) / 2;
  return (
    <svg
      width={size}
      height={size}
      viewBox={`0 0 ${size} ${size}`}
      className={styles.ring}
      style={{ display: 'block' }}
    >
      <circle
        cx={size / 2}
        cy={size / 2}
        r={r}
        fill="none"
        stroke="var(--ant-color-warning)"
        strokeOpacity={0.35}
        strokeWidth={2}
      />
      <circle
        cx={size / 2}
        cy={size / 2}
        r={r}
        fill="none"
        stroke="var(--ant-color-warning)"
        strokeWidth={2}
        strokeLinecap="round"
        strokeDasharray={`${Math.PI * r * 0.6} ${Math.PI * r * 1.4}`}
      />
    </svg>
  );
});

/** One glyph per execution semantic; `live` swaps the static running dot for the ring spinner. */
export const StatusGlyph = memo<{ status: ExecStatus; live?: boolean; size?: number }>(
  ({ status, live, size = 16 }) => {
    if (status === 'running' && live) return <RingSpinner size={size} />;
    const meta = STATUS_VISUALS[status];
    return <Icon icon={meta.icon} size={size} color={meta.color} />;
  },
);

export const buildStep = (index: number): GoalState => {
  const s = INITIAL();
  for (let i = 0; i <= index; i++) STEPS[i].apply(s);
  clock.now = at(STEPS[index].t);
  return s;
};

<script type="text/plain" data-module="src/model/activity.ts">
// Activity model — the feed is a per-node work record, not a raw event log.
//
// A Goal produces many runtime events (dispatch, evidence submission, verifier verdicts, lease
// renewals). Most of them belong *inside* a task: the verifier judging attempt #2 of "从零训练" is
// part of that task's story, not a separate line in the Goal's history. So the feed shows one entry
// per node — what that node did, by whom, how it ended — and folds the per-attempt detail under it.
//
// Goal-level entries (things that are not about a single node) stay as their own rows:
// create · pause · resume · budget · comment · achieved.
//
//   Source (production)                    → where it lands
//   goal_events created (graph seeded)     → goal row 「生成初始方案」
//   coordinator runTask / recovery         → the node's attempt list
//   task topic last line + heartbeat       → the node's live line while running
//   verify run passed / failed / errored   → the attempt's outcome (never its own row)
//   lease abandoned                        → the attempt's outcome (失联回收)
//   goal_nodes finding created             → the node's 结论 line
//   decisions opened / resolved            → the node's 人工参与 + the decision node's own entry
//   goal paused / resumed / setBudget      → goal row
//   task comment                           → goal row
//   goal achieved                          → goal row

import type { LucideIcon } from 'lucide-react';
import { Coins, MessageSquare, Pause, Play, Sparkles, Trophy } from 'lucide-react';

import type { GoalNode, GoalState } from '../types';

export type GoalEventKind = 'create' | 'pause' | 'resume' | 'budget' | 'comment' | 'achieved';

export const GOAL_EVENT_META: Record<GoalEventKind, { icon: LucideIcon; tone: 'neutral' | 'ok' | 'warn' }> = {
  create: { icon: Sparkles, tone: 'neutral' },
  pause: { icon: Pause, tone: 'warn' },
  resume: { icon: Play, tone: 'neutral' },
  budget: { icon: Coins, tone: 'warn' },
  comment: { icon: MessageSquare, tone: 'neutral' },
  achieved: { icon: Trophy, tone: 'ok' },
};

/** Per-node record: one row in the feed, with its attempts folded underneath. */
export interface NodeRecord {
  node: GoalNode;
  /** Newest timestamp on this node — sorts the feed. */
  t: number;
  /** Who is (or was) doing the work. */
  actor?: string;
  /** One plain sentence: what state this node reached. */
  summary: string;
  /** Findings this node produced. */
  findings: GoalNode[];
}

export interface GoalRecord {
  kind: GoalEventKind;
  t: number;
  who: string;
  text: string;
}

const lastAttemptEnd = (n: GoalNode) => (n.attempts?.length ? n.attempts.at(-1)!.ended : undefined);

const summarize = (n: GoalNode, state: GoalState): string => {
  const attempts = n.attempts ?? [];
  const real = attempts.filter((a) => a.outcome !== 'abandoned').length;
  const abandoned = attempts.filter((a) => a.outcome === 'abandoned').length;
  const suffix = abandoned > 0 ? `，另有 ${abandoned} 次失联回收` : '';
  if (n.kind === 'decision') return n.status === 'waiting' ? '等你决定' : n.body ?? '已决定';
  if (n.kind === 'problem') return n.status === 'resolved' ? '已被结论回答' : '待回答';
  switch (n.status) {
    case 'resolved':
      return `完成 · ${real} 次尝试${suffix}`;
    case 'retired':
      return `已放弃 · ${real} 次尝试${suffix}`;
    case 'waiting':
      return `${real} 次尝试都没通过验证，等你决定${suffix}`;
    case 'active':
      if (n.delivered) return '验收通过，等你确认';
      return `进行中 · 第 ${attempts.length + 1} 次尝试${suffix}`;
    default:
      return state.goal.status === 'planning' ? '待开始' : '还没开始';
  }
};

/** Nodes that have actually done something, newest first, plus the goal-level rows. */
export const buildRecords = (state: GoalState) => {
  const findingsBySource = new Map<string, GoalNode[]>();
  for (const f of state.nodes) {
    if (f.kind !== 'finding' || !f.from) continue;
    findingsBySource.set(f.from, [...(findingsBySource.get(f.from) ?? []), f]);
  }

  const nodes: NodeRecord[] = state.nodes
    .filter((n) => (n.kind === 'work' && (n.attempts?.length || n.status !== 'proposed')) || (n.kind === 'decision' && n.status !== 'proposed'))
    .map((n) => ({
      node: n,
      t: Math.max(n.at ?? 0, n.lastActivity ?? 0, lastAttemptEnd(n) ?? 0, n.humanTouches?.at(-1)?.t ?? 0),
      actor: n.task?.agent,
      summary: summarize(n, state),
      findings: findingsBySource.get(n.id) ?? [],
    }))
    .sort((a, b) => b.t - a.t);

  return nodes;
};

<script type="text/plain" data-module="src/model/format.ts">
// Time and money formatting. `clock.now` is the "current time" of the rendered step so relative
// ages stay truthful while replaying; production reads Date.now().

export const min = (n: number) => n * 60_000;

export const clock = { now: 0 };

export const ago = (ms: number) => {
  if (ms < min(1)) return '刚刚';
  if (ms < min(60)) return `${Math.round(ms / min(1))} 分钟前`;
  const h = Math.floor(ms / min(60));
  if (h < 24)
    return `${h} 小时${h < 3 ? ` ${Math.round((ms - h * min(60)) / min(1))} 分钟` : ''}前`;
  return `${Math.floor(h / 24)} 天前`;
};

export const duration = (ms: number) => ago(ms).replace('前', '');

export const short = (ms: number) =>
  ms < min(1)
    ? '刚刚'
    : ms < min(60)
      ? `${Math.round(ms / min(1))}m`
      : ms < min(60 * 24)
        ? `${Math.floor(ms / min(60))}h`
        : `${Math.floor(ms / min(60 * 24))}d`;

/** Running duration in the Task-page style: 12s · 3m 12s · 1h 04m. */
export const elapsed = (ms: number) => {
  const total = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
  if (m > 0) return `${m}m ${String(sec).padStart(2, '0')}s`;
  return `${sec}s`;
};

export const usd = (n: number) => `$${n.toFixed(2)}`;

export const hhmm = (t: number) => {
  const d = new Date(t);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

</script>
<script type="text/plain" data-module="src/model/frontier.ts">
// Frontier projection — what the coordinator would consider next — and the plain-word states the
// surface shows. Pure functions over GoalState; a production version reads the graph snapshot.

import type { GoalInfo, GoalNode, GoalState } from '../types';
import { ago, clock, min } from './format';

export const isStale = (goal: GoalInfo, n: GoalNode) =>
  n.kind === 'work' &&
  n.status === 'active' &&
  !n.delivered &&
  !!n.lastActivity &&
  clock.now - n.lastActivity > min(goal.leaseTimeoutMin);

export type FrontierItemKind =
  | 'gate'
  | 'budget'
  | 'acceptance'
  | 'stale'
  | 'running'
  | 'ready'
  | 'done';

export interface FrontierItem {
  key: string;
  kind: FrontierItemKind;
  node: GoalNode;
  /** 0 = needs you, 1 = running, 2 = ready */
  rank: number;
}

export interface BlockedItem {
  key: string;
  node: GoalNode;
  blockers: GoalNode[];
}

/** How many just-finished tasks stay in the list. */
export const RECENT_DONE = 2;

/**
 * Stable per-node number, taken from creation order in the graph — the row's identity, not its
 * position in today's list. `依赖 #2` keeps pointing at the same node forever.
 */
export const nodeNumbers = (state: GoalState) => {
  const map = new Map<string, number>();
  let n = 0;
  for (const node of state.nodes) if (node.kind === 'work') map.set(node.id, ++n);
  return map;
};

export interface Frontier {
  items: FrontierItem[];
  blocked: BlockedItem[];
  needsYou: number;
}

/**
 * Frontier = nodes that can change state under current conditions:
 * pending decisions addressed to the user, active Work, and proposed Work whose `depends_on` are all
 * resolved. Blocked Work is folded, not listed.
 */
export const computeFrontier = (state: GoalState): Frontier => {
  const byId = Object.fromEntries(state.nodes.map((n) => [n.id, n]));
  const items: FrontierItem[] = [];
  const blocked: BlockedItem[] = [];
  const budgetPaused = state.goal.status === 'paused' && state.goal.pauseCause === 'cost';
  for (const n of state.nodes) {
    if (n.kind === 'decision' && n.status === 'waiting' && n.authority === 'user') {
      items.push({ key: n.id, kind: 'gate', node: n, rank: 0 });
      continue;
    }
    if (n.kind !== 'work') continue;
    if (n.delivered) {
      // verifier passed; the human accept is an action on this Work, not a node
      items.push({ key: `accept:${n.id}`, kind: 'acceptance', node: n, rank: 0 });
      continue;
    }
    if (n.status === 'active') {
      // Budget exhausted: the running task IS the thing that needs you — one row, not two.
      if (budgetPaused) {
        items.push({ key: `budget:${n.id}`, kind: 'budget', node: n, rank: 0 });
        continue;
      }
      if (isStale(state.goal, n)) items.push({ key: n.id, kind: 'stale', node: n, rank: 0 });
      else items.push({ key: n.id, kind: 'running', node: n, rank: 1 });
      continue;
    }
    if (n.status === 'proposed') {
      const blockers = (n.dependsOn ?? [])
        .map((id) => byId[id])
        .filter((d) => d && d.status !== 'resolved');
      if (blockers.length) blocked.push({ key: n.id, node: n, blockers });
      else items.push({ key: n.id, kind: 'ready', node: n, rank: 2 });
    }
  }
  // Keep the last finished tasks visible so the list fades instead of items vanishing — a slice of
  // "what just happened" you can still click into for review.
  const done = state.nodes
    .filter((n) => n.kind === 'work' && (n.status === 'resolved' || n.status === 'retired'))
    .sort((a, b) => (b.at ?? 0) - (a.at ?? 0))
    .slice(0, RECENT_DONE)
    .map((n) => ({ key: `done:${n.id}`, kind: 'done' as const, node: n, rank: -1 }));

  items.sort((a, b) => a.rank - b.rank || (b.node.priority ?? 0) - (a.node.priority ?? 0));
  return {
    items: [...done, ...items],
    blocked,
    needsYou: items.filter((i) => i.rank === 0).length,
  };
};

export const goalSentence = (goal: GoalInfo, frontier: Frontier) => {
  switch (goal.status) {
    case 'planning':
      return '初始方案已生成，还没有开始';
    case 'running': {
      const stale = frontier.items.find((i) => i.kind === 'stale');
      if (stale)
        return `运行中，但已失联 · 最近动作 ${ago(clock.now - (stale.node.lastActivity ?? clock.now))}`;
      return `运行中 · 最近动作 ${ago(clock.now - (goal.lastActivity ?? clock.now))}`;
    }
    case 'verifying':
      return '整体验收中';
    case 'review':
      return frontier.items.some((i) => i.kind === 'gate')
        ? `等你决定 · 已等待 ${ago(clock.now - (goal.lastActivity ?? clock.now)).replace('前', '')}`
        : '验收通过，等你确认';
    case 'paused':
      return goal.pauseCause === 'cost'
        ? '已暂停 · 费用预算用完'
        : goal.pauseCause === 'rounds'
          ? '已暂停 · 尝试次数用完'
          : '已由你暂停';
    case 'achieved':
      return `已达成 · ${ago(clock.now - (goal.completedAt ?? clock.now))}`;
    case 'failed':
      return '未达成';
    case 'canceled':
      return '已取消';
  }
};

export const nodeStateText = (goal: GoalInfo, n: GoalNode, frontier: Frontier) => {
  if (n.kind === 'decision')
    return n.status === 'waiting'
      ? '等你决定'
      : n.authority === 'agent'
        ? 'Agent 已决定'
        : '你已决定';
  if (n.kind === 'finding') return `结论 · ${ago(clock.now - (n.at ?? clock.now))}`;
  if (n.kind === 'problem') return n.status === 'resolved' ? '已回答' : '待回答';
  if (n.delivered) return '验收通过，等你确认';
  switch (n.status) {
    case 'resolved':
      return '完成';
    case 'retired':
      return '已放弃';
    case 'waiting':
      return '等你决定';
    case 'active':
      if (goal.status === 'paused') return '已停止';
      if (isStale(goal, n)) return '失联，等待回收';
      return `进行中 · 第 ${(n.attempts?.length ?? 0) + 1} 次尝试`;
    case 'proposed': {
      const b = frontier.blocked.find((x) => x.node.id === n.id);
      if (b) return `等待「${b.blockers[0].title}」`;
      return goal.status === 'planning' ? '待开始' : '可以开始';
    }
    default:
      return n.status;
  }
};

export const countAttempts = (state: GoalState) =>
  state.nodes.reduce(
    (a, n) => a + (n.attempts?.filter((x) => x.outcome !== 'abandoned').length ?? 0),
    0,
  );

</script>
<script type="text/plain" data-module="src/types.ts">
// Domain-shaped view types for the Goal process-control surface.
// Mirrors packages/types/src/goal.ts (GoalGraphNode / GoalGraphEdge / GoalGraphDecision) plus the
// per-node execution projection (owner Task, attempts, liveness) the page needs.

export type NodeKind = 'goal' | 'problem' | 'work' | 'finding' | 'decision';
export type NodeStatus = 'proposed' | 'active' | 'waiting' | 'resolved' | 'rejected' | 'retired';
export type EdgeKind =
  | 'decomposes'
  | 'depends_on'
  | 'investigates'
  | 'produces'
  | 'supports'
  | 'contradicts'
  | 'leads_to';
export type Edge = [string, string, EdgeKind];

export interface Attempt {
  n: number;
  started: number;
  ended: number;
  outcome: 'passed' | 'failed' | 'abandoned';
  cost: number;
  reason: string;
  taskId?: string;
}

export interface OwnerTask {
  id: string;
  agent: string;
}

export interface GoalNode {
  id: string;
  kind: NodeKind;
  title: string;
  status: NodeStatus;
  /** Human-facing short ref (W-3). Shown only in detail, never in the list. */
  ref?: string;
  description?: string;
  /** Finding / decision body. */
  body?: string;
  cost?: number;
  priority?: number;
  dependsOn?: string[];
  attempts?: Attempt[];
  task?: OwnerTask;
  /** When the current attempt started — drives the running clock. */
  startedAt?: number;
  /** Last operation heartbeat (liveness). */
  lastActivity?: number;
  /** Last tool / assistant line from the owner Task's running topic. */
  lastLine?: string;
  /** Resolution time. */
  at?: number;
  /** Finding: the Work (or Problem) it came from. */
  from?: string;
  /** Decision: who is allowed to resolve it. */
  authority?: 'agent' | 'user';
  /** Decision sub-type. Only gates are decision nodes; other human actions mark the Work itself. */
  subtype?: 'gate';
  /** Work: the terminal "Complete full Goal acceptance" Work. */
  terminal?: boolean;
  /** Work: verifier passed, waiting for the human accept. */
  delivered?: boolean;
  /**
   * Human actions taken on this Work (budget top-up, gate choice, acceptance). Derived from
   * goal_events / acceptance decisions / task comments — shown as a 你 badge, never as extra nodes.
   */
  humanTouches?: HumanTouch[];
}

export type HumanTouchKind = 'budget' | 'retry' | 'retire' | 'accept' | 'reject' | 'guidance';

export interface HumanTouch {
  t: number;
  kind: HumanTouchKind;
  text: string;
}

export interface DecisionOption {
  id: string;
  label: string;
  consequence: string;
}

export interface PendingDecision {
  id: string;
  nodeId: string;
  workId: string;
  why: string;
  options: DecisionOption[];
  recommended: string;
}

export interface GoalCheck {
  label: string;
  state: 'pending' | 'passed' | 'failed';
}

export interface GoalInfo {
  id: string;
  title: string;
  agent: string;
  requirement: string;
  checks: GoalCheck[];
  maxRounds: number | null;
  maxTotalCost: number | null;
  maxAttemptsPerWork: number;
  leaseTimeoutMin: number;
  startedAt: number | null;
  completedAt?: number;
  status:
    'planning' | 'running' | 'verifying' | 'review' | 'paused' | 'achieved' | 'failed' | 'canceled';
  pauseCause?: 'user' | 'cost' | 'rounds';
  spent: number;
  lastActivity: number | null;
}

export type ActivityKind =
  | 'create'
  | 'start'
  | 'progress'
  | 'pass'
  | 'fail'
  | 'abandon'
  | 'finding'
  | 'decision'
  | 'budget'
  | 'pause'
  | 'resume'
  | 'comment'
  | 'achieved';

export interface ActivityEvent {
  t: number;
  kind: ActivityKind;
  /** 你 · 系统 · Agent · verifier · <agent name> */
  who: string;
  text: string;
  /** Node the event is about — rendered as a chip that highlights the graph. */
  nodeId?: string;
  detail?: string;
}

export interface GoalState {
  goal: GoalInfo;
  nodes: GoalNode[];
  edges: Edge[];
  decision: PendingDecision | null;
  log: ActivityEvent[];
}

</script>
