lockfile: false
resolutionMode: highest
dedupePeerDependents: true
ignoreWorkspaceRootCheck: true
enablePrePostScripts: true

publicHoistPattern:
  - '*@umijs/lint*'
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'
  - '@auth/core'
  - 'pdfjs-dist'

packages:
  - packages/**
  - .
  - e2e
  - apps/desktop/src/main
  - apps/auth
  - apps/server
  - apps/share
  - apps/workbench

minimumReleaseAgeExclude:
  - '@auv-js/api-client@0.0.25'
  - '@auv-js/cli-darwin-arm64@0.0.25'
  - '@auv-js/cli-darwin-x64@0.0.25'
  - '@auv-js/cli-linux-arm64-gnu@0.0.25'
  - '@auv-js/cli-linux-x64-gnu@0.0.25'
  - '@auv-js/cli-win32-x64-msvc@0.0.25'
  - '@auv-js/cli@0.0.25'
  - '@auv-js/sdk@0.0.25'
  - '@lobehub/*'

# Build scripts run one at a time. Several peer-variant copies of
# @lobehub/editor resolve in this workspace and every copy's postinstall
# patches the SAME hoisted `lexical` files; run in parallel they race on those
# writes and CI fails with "Patch context mismatch" (LOBE-13963). Only the
# handful of packages allowed below build, so serializing costs seconds.
childConcurrency: 1

allowBuilds:
  '@google/genai': true
  '@lobehub/editor': true
  '@lobehub/editor@https://pkg.pr.new/%40lobehub%2Feditor%406a85671': true
  '@sentry/cli': true
  '@vercel/speed-insights': true
  core-js: false
  electron-sparkle-updater: false
  es5-ext: false
  esbuild: false
  ffmpeg-static: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
  workerd: true

overrides:
  '@lobehub/ui': https://pkg.pr.new/@lobehub/ui@7f8f8c2
  '@lobehub/icons': https://pkg.pr.new/@lobehub/icons@51fdd35
  '@lobehub/editor': https://pkg.pr.new/%40lobehub%2Feditor%406a85671
  '@lobehub/charts': https://pkg.pr.new/@lobehub/charts@7299e60
  '@lobehub/tts': https://pkg.pr.new/@lobehub/tts@8d29894
  '@lobehub/fluent-emoji': https://pkg.pr.new/@lobehub/fluent-emoji@ad41eee
  '@react-pdf/image': 3.0.4
  '@types/react': 19.2.13
  '@vitest/coverage-v8': 5.0.0
  baseline-browser-mapping: 2.10.31
  drizzle-orm: ^0.45.2
  fast-xml-parser: 5.4.2
  lexical: 0.42.0
  # Keep the coupled core/autolink patches applied without a root lockfile.
  micromark: 4.0.3
  micromark-extension-gfm-autolink-literal: 2.1.0
  node-gyp: ^12.4.0
  pdfjs-dist: 5.4.530
  react: 19.2.7
  react-dom: 19.2.7
  's3rver>fast-xml-parser': 3.21.1
  stylelint-config-clean-order: 7.0.0
  typescript: 6.0.3
  vitest: 5.0.0
  'zod@^4': 4.6.5

patchedDependencies:
  '@upstash/qstash': patches/@upstash__qstash.patch
  micromark@4.0.3: patches/micromark@4.0.3.patch
  micromark-extension-gfm-autolink-literal@2.1.0: patches/micromark-extension-gfm-autolink-literal@2.1.0.patch
