lockfile: false
# pnpm 12 must keep dependency installation explicit, including exec/run.
verifyDepsBeforeRun: false
resolutionMode: highest
dedupePeerDependents: true
ignoreWorkspaceRootCheck: true
enablePrePostScripts: true

publicHoistPattern:
  - '*@umijs/lint*'
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'
  - '@auth/core'
  - 'pdfjs-dist'

packages:
  - packages/**
  - .
  - e2e
  - apps/desktop/src/main
  - apps/auth
  - apps/server
  - apps/share
  - apps/workbench

minimumReleaseAgeExclude:
  - '@lobehub/*'
  - virtua@0.53.5

# Build scripts run one at a time. Several peer-variant copies of
# @lobehub/editor resolve in this workspace and every copy's postinstall
# patches the SAME hoisted `lexical` files; run in parallel they race on those
# writes and CI fails with "Patch context mismatch" (LOBE-13963). Only the
# handful of packages allowed below build, so serializing costs seconds.
childConcurrency: 1

allowBuilds:
  '@google/genai': true
  '@hatchet-dev/typescript-sdk': false
  '@lobehub/editor': true
  '@sentry/cli': true
  '@vercel/speed-insights': true
  core-js: false
  electron-sparkle-updater: false
  es5-ext: false
  esbuild: false
  ffmpeg-static: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
  workerd: true

overrides:
  '@lobehub/ui': ^6.1.0
  '@lobehub/icons': ^6.0.0
  '@lobehub/editor': ^5.0.0
  '@lobehub/charts': ^6.0.0
  '@lobehub/fluent-emoji': ^5.0.0
  # The private Market SDK does not follow the npm releases. Force every importer,
  # transitive ones included, onto the vendored tarballs built from it.
  '@lobehub/market-sdk': file:vendor/lobehub-market-sdk-0.41.0-cpc.2.tgz
  '@lobehub/market-types': file:vendor/lobehub-market-types-1.17.1-cpc.2.tgz
  # Stay on the latest 1.9.x: @opentelemetry/*@2.x peers reject 1.10.0, and mixing both splits drizzle-orm into duplicate peer variants.
  '@opentelemetry/api': 1.9.1
  '@react-pdf/image': 3.0.4
  # 0.2.11 moved the optional `import('zod-openapi')` out of try/catch, which fails the Turbopack build.
  '@standard-community/standard-openapi': 0.2.10
  '@types/react': 19.2.13
  '@vitest/coverage-v8': 5.0.0
  baseline-browser-mapping: 2.10.31
  # Without a lockfile pnpm resolves optional peers per importer, and drizzle-orm
  # ended up as several peer variants (otel 1.9.0 at the root, 1.10.0 in
  # packages/database). `SQL`/`PgColumn` are nominal across copies, which turns
  # every cross-package query into TS2345/TS2769. Pin the version so every
  # importer resolves the same copy.
  drizzle-orm: 0.45.4
  fast-xml-parser: 5.4.2
  lexical: 0.42.0
  # 2.2 serializes attention by trial and re-render, which takes minutes on a long
  # paragraph. The CJK extension is written against the 2.2 attention API and keeps it.
  mdast-util-to-markdown: 2.1.2
  'mdast-util-to-markdown-cjk-friendly>mdast-util-to-markdown': ^2.2.0
  # Keep the coupled core/autolink patches applied without a root lockfile.
  micromark: 4.0.3
  micromark-extension-gfm-autolink-literal: 2.1.0
  node-gyp: ^12.4.0
  pdfjs-dist: 5.4.530
  react: 19.2.7
  react-dom: 19.2.7
  's3rver>fast-xml-parser': 3.21.1
  stylelint-config-clean-order: 7.0.0
  typescript: 6.0.3
  # 5.1 changes leading/trailing slash handling and breaks provider URL contracts.
  url-join: 5.0.0
  vitest: 5.0.0
  'zod@^4': 4.6.5

patchedDependencies:
  '@lobehub/editor@5.0.2': patches/@lobehub__editor@5.0.2.patch
  '@chat-adapter/discord@4.38.1': patches/@chat-adapter__discord@4.38.1.patch
  micromark@4.0.3: patches/micromark@4.0.3.patch
  micromark-extension-gfm-autolink-literal@2.1.0: patches/micromark-extension-gfm-autolink-literal@2.1.0.patch
  request-filtering-agent@3.2.1: patches/request-filtering-agent@3.2.1.patch
